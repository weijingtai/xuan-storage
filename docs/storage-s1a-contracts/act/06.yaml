ACT_VERSION: 1
TASK_ID: mimo-storage-s1a-contracts/06
TITLE: analyzer 负测试 — 证明非法策略组合写不出来
TYPE: contract
ORDER: 6
DEPENDS_ON: [mimo-storage-s1a-contracts/05]
DISPATCH_STATUS: ready
STRONG_MODEL_ONLY: true   # 方向易反，需较强模型或人工复核

OBJECTIVE: >
  建立一个【故意编译不过】的 fixture 工程，用 dart analyze 的退出码证明
  非法策略组合在语法上不存在。这是 §2.3 「防混用」主张的唯一硬证据。

READ_THIS_THREE_TIMES: |
  本任务【不是】「写测试让它变绿」。
  本任务是【证明某些代码写不出来】。
  fixture 里的代码【必须编译失败】，脚本才算通过。
  如果你让 fixture 编译通过了，就是把方向做反了，整项作废。

SCOPE:
  READ:
    - docs/superpowers/specs/2026-07-31-storage-architecture-design.md   # §2.3 参数表；§2.3.2 三类验证手段
    - core/lib/model/storage_policy.dart        # ACT 02 产物，违规样本要针对它的真实签名写
    - core/pubspec.yaml
  WRITE:
    - test_fixtures/policy_negative/pubspec.yaml
    - test_fixtures/policy_negative/lib/violations.dart
    - test_fixtures/policy_negative/analysis_options.yaml
    - scripts/run_policy_negative_check.sh

LAYOUT_DECISION: |
  fixture 放在【仓库根】的 test_fixtures/policy_negative/，不放在 core/test/ 下。

  理由（已实测）：嵌套在 core/test/ 下的 fixture 会被 `cd core && dart analyze`
  扫到，导致 ACT 05 的全包 analyze 失败；而用 analysis_options 的 exclude 排除后，
  fixture 单独 analyze 时会向上继承那条排除规则，变成「No issues found」，
  负测试反而失效。放仓库根则两边互不可见，最稳。

  fixture 依赖 persistence_core 用相对路径：
    dependencies:
      persistence_core:
        path: ../../core

FILE_CONTENT:
  test_fixtures/policy_negative/analysis_options.yaml: |
    # 独立配置，切断向上继承。不要 include 任何 lints 包，
    # 我们只关心「是否产生 error 级问题」。
    analyzer:
      errors:
        unused_import: ignore
        unused_local_variable: ignore

  test_fixtures/policy_negative/lib/violations.dart: |
    // 本文件【故意编译不过】。每一行都对应设计稿 §2.3 的一条参数表约束。
    // 若某一行竟然编译通过，说明对应约束失效，必须回 ACT 02 修 storage_policy.dart。
    import 'package:persistence_core/persistence_core.dart';

    // 违规 1：shared 没有 channels 参数
    const v1 = StoragePolicy.shared(
      carriers: {Carrier.row},
      channels: {Channel.lan},
    );

    // 违规 2：control 没有任何参数
    const v2 = StoragePolicy.control(publisher: Publisher.user);

    // 违规 3：private 没有 cloud 参数（cloud 结构上不可关闭）
    const v3 = StoragePolicy.private(
      carriers: {Carrier.row},
      cloud: false,
    );

    // 违规 4：private 没有 channels 参数
    const v4 = StoragePolicy.private(
      carriers: {Carrier.row},
      channels: {Channel.lan},
    );

    // 违规 5：子类构造器私有，跨库不可见
    const v5 = PrivatePolicy(carriers: {Carrier.row});

  scripts/run_policy_negative_check.sh: |
    #!/usr/bin/env bash
    # 负测试：fixture 内的违规代码【必须】产生 error 级问题。
    # dart analyze 退出码分级：0=无问题 1=info 2=warning 3=error
    # 【只判非零是不够的】——只剩警告时也是 2，会假通过。必须恰好为 3。
    set -uo pipefail
    FIXTURE_DIR="$(cd "$(dirname "$0")/../test_fixtures/policy_negative" && pwd)"
    cd "$FIXTURE_DIR" || { echo "找不到 fixture 目录"; exit 1; }

    dart pub get --suppress-analytics >/dev/null 2>&1

    dart analyze --suppress-analytics . >/tmp/policy_negative_analyze.log 2>&1
    ACTUAL=$?

    if [ "$ACTUAL" -eq 3 ]; then
      echo "✅ 负测试通过：违规代码产生了 error 级问题（退出码 3）"
      echo "   实际报告的问题："
      grep -E "^\s+error" /tmp/policy_negative_analyze.log | head -10
      exit 0
    fi

    echo "❌ 负测试失败：期望 dart analyze 退出码 3（error），实际 $ACTUAL"
    case "$ACTUAL" in
      0) echo "   含义：违规代码【竟然全部编译通过】。storage_policy.dart 的参数表约束失效了。" ;;
      1) echo "   含义：只有 info 级问题，没有 error。约束没生效。" ;;
      2) echo "   含义：只有 warning 级问题，没有 error。约束没生效。" ;;
      *) echo "   含义：analyze 本身执行异常，检查 fixture 的 pub get 是否成功。" ;;
    esac
    echo "   完整输出："
    cat /tmp/policy_negative_analyze.log
    exit 1

CONSTRAINTS:
  - 脚本必须 `chmod +x`。
  - 【不要】为了让脚本通过而去修改 violations.dart 使其编译成功。方向反了。
  - 【不要】把期望退出码放宽成「非零」。只剩警告时退出码是 2，会假通过。
  - 五条违规样本必须【逐条】对着 core/lib/model/storage_policy.dart 的真实签名写。
    若 ACT 02 的实现与设计稿有出入，以实现为准并【上报差异】，不要自行改实现来迁就样本。
  - fixture 的 pubspec name 用 policy_negative_fixture，publish_to: none。

TESTS_FIRST:
  # 本 ACT 的「测试」就是脚本自身。自检方式：先做反向验证再做正向验证。
  CASES:
    - NAME: script_fails_when_violations_removed
      BEHAVIOR: >
        自检步骤（做完删掉临时改动）：把 violations.dart 内容临时换成
        一个合法的空 main()，跑脚本，【必须】看到「❌ 负测试失败」且脚本退出码为 1。
        这证明脚本方向没反。做完把 violations.dart 恢复。
      RED_COMMAND: bash scripts/run_policy_negative_check.sh
      RED_EXPECT: 脚本打印 ❌ 且退出码 1
      COVERS: [A3]

    - NAME: script_passes_with_violations_present
      BEHAVIOR: >
        violations.dart 为五条违规样本时跑脚本，【必须】看到「✅ 负测试通过」
        且脚本退出码为 0，输出里列出实际的 error 条目。
      RED_COMMAND: bash scripts/run_policy_negative_check.sh
      RED_EXPECT: 首次运行时 fixture 尚不存在，脚本报错退出非 0
      COVERS: [A3]

VERIFICATION:
  - CMD: test -x scripts/run_policy_negative_check.sh
    EXPECT_EXIT: 0
  - CMD: bash scripts/run_policy_negative_check.sh
    EXPECT_EXIT: 0
  - CMD: cd core && dart analyze --fatal-infos
    EXPECT_EXIT: 0   # 关键：fixture 放在仓库根，不得影响 core 的全包 analyze
  - CMD: cd core && flutter test
    EXPECT_EXIT: 0

DONE_WHEN:
  - 脚本可执行且返回 0
  - core 的全包 analyze 与 test 仍然全绿（fixture 未污染主包）
  - 自检 case 1 已实际执行过并确认脚本会在无违规时失败
