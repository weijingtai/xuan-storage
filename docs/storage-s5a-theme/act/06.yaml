SIGNATURE:
  # §5.5.3：store 构造器只有两个参数（零网络的结构性保证，P3-a1 tear-off 会断言）
  in_memory_theme_resource_store.dart: |
    final class InMemoryThemeResourceStore implements ThemeResourceStore {
      /// 构造 reference store。
      /// - scopeUid: 作用域 uid
      /// - localReader: 必需。bundled/活跃世代/override 的唯一来源。
      /// 【v4：不再接收 remoteFetcher/packageStore/signatureVerifier】那三样归 XRAP。
      /// reference 的零 IO 由「只有一个本地读取端口」这一结构事实保证 --
      /// 它连发起网络的能力都没有，比"默认实现抛异常"更强。
      InMemoryThemeResourceStore({
        required this.scopeUid,
        required ThemeLocalReader localReader,
      });

      @override
      final String scopeUid;
      // 持有 localReader，调 mergeThemeTokens（ACT 04）产出 ThemeTokenSet。
      // 缓存键 (activeThemeId, packageVersion, overridesRevision) 三元组，相同返回 identical（P2）。
      // watchResolved：覆盖层变更/主题切换/XRAP 活跃指针翻转时推送新值。
      // listLocalThemes：XRAP 活跃世代 + generation 0。
      // selectTheme/clearThemeSelection/applyOverrides/removeOverrides/listOverrides：写覆盖层。
    }

  # §4.5：装配入口 + XrapThemeLocalReader
  theme_assembly.dart: |
    /// 把 XRAP 的落地产物接到 S5a 读路径上的 reference reader（§4.5 第 4 步）。
    final class XrapThemeLocalReader implements ThemeLocalReader {
      /// - tokenStore: §4.5 第 1 步创建的那一个，与 materializer 工厂捕获的是同一个实例
      /// - installer: XRAP 安装器，只用来读活跃指针（active）；不得调 ensureInstalled/checkForUpdate（P4 会断言）
      /// - initialOverrides: 用户覆盖差量初始快照；生产实现改查 drift 覆盖表
      XrapThemeLocalReader({
        required InMemoryThemeTokenStore tokenStore,
        required DatasetInstaller installer,
        required Map<String, OverrideEntry> initialOverrides,
      });

      @override
      Future<Map<String, dynamic>> readBundledTokens();
      // 实现：_tokens.tokensOf(0)；为 null 抛 StateError（fail closed，装配漏了 ensureInstalled）。

      @override
      Future<Map<String, dynamic>?> readActiveThemeTokens(String themeId);
      // 六步无分支（§4.5）：
      // 1. themeId != themeDatasetId -> 抛 ArgumentError
      // 2. final active = await installer.active(themeDatasetId);
      // 3. active == null || !active.isUsable -> 返回 null
      // 4. active.generation == 0 -> 返回 null（第 0 代由 readBundledTokens 承担）
      // 5. final t = _tokens.tokensOf(active.generation); t == null -> 返回 null
      // 6. 返回 t

      @override
      Future<Map<String, OverrideEntry>> readOverrides();  // 返回 initialOverrides 只读视图
    }

    /// reference 装配入口。P4 的唯一注入点。
    /// 按顺序做四件事（§4.5，缺一不可）：
    ///   1. final tokenStore = InMemoryThemeTokenStore();
    ///   2. ThemeModuleRegistry.register(themeMaterializer: () => InMemoryThemeMaterializer(tokenStore));
    ///   3. await installer.ensureInstalled(themeDatasetId);  // 不触网
    ///   4. return InMemoryThemeResourceStore(scopeUid: scopeUid,
    ///        localReader: XrapThemeLocalReader(tokenStore: tokenStore, installer: installer, initialOverrides: initialOverrides));
    /// ⚠️ assembleThemeStore 不接收 localReader -- reader 由它自己造，否则 P4 只测自己传的假货。
    Future<ThemeResourceStore> assembleThemeStore({
      required String scopeUid,
      required DatasetInstaller installer,
      required Map<String, OverrideEntry> initialOverrides,
    });

CONSTRAINTS:
  - **store 构造器只有两个参数** `{required String scopeUid, required ThemeLocalReader localReader}`（§5.5.3）。
    P3-a1 tear-off 断言会检查函数类型；新增任何 required 参数即红。这是零网络的结构性保证。
  - **assembleThemeStore 不接收 localReader**（§4.5 末注）。reader 由它自己按第 4 步造。
    P3-b/P6 需注入探针 reader 时，**直接构造 InMemoryThemeResourceStore**，不走装配函数。
  - **readActiveThemeTokens 六步无分支**（§4.5）。不得加 else 分支或提前 return。
  - **缓存 identical**（§6.6 缓存）：相同 (activeThemeId, packageVersion, overridesRevision) 返回同一实例；
    改一次 override 后 identical 为 false（P2）。overridesRevision 单调递增。
  - **不可变性**：resolve() 结果的 Map 逐层 unmodifiable（A16，与 ACT 04 一致）。
  - **assembleThemeStore 第 3 步 ensureInstalled 不触网**（XRAP dataset_installer.dart 明写）。
  - dartdoc 中文（A18）。

