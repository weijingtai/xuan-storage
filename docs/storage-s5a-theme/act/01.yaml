ACT_VERSION: 1
TASK_ID: mimo-storage-s5a-theme/01
TITLE: 契约层 · 中立数据结构与溯源类型
TYPE: contract
ORDER: 1
DEPENDS_ON: []
DISPATCH_STATUS: ready
STRONG_MODEL_ONLY: false

PREREQUISITES:
  - 基线前置（stop condition #1）：以下五个文件必须存在，缺任何一个立即停：
    `core/lib/model/storage_policy.dart` / `storage_policy_registry.dart` /
    `storage_classification.dart` / `cancellation_token.dart` / `dataset/dataset_materializer.dart`
  - 先跑 `cd core && flutter pub get` 确认基线可编译。

OBJECTIVE: >
  交付 S5a 契约层的第一组：源无关的中立 token 数据结构与一次解析的完整溯源。
  这一层不依赖 `theme` 包、不依赖 `xuan_config`、不依赖 drift（设计 §2.2 / §5.1 / §5.2）。
  零业务逻辑，只有值类型定义。

SCOPE:
  READ:
    - docs/superpowers/specs/2026-08-03-s5a-theme-resource-distribution-design.md   # §5.1 中立数据结构；§5.2 溯源结构；§2.2 依赖方向
    - core/lib/model/ports.dart                                                     # dartdoc 中文注释风格，照抄密度
    - core/lib/model/storage_error.dart                                            # 既有值类型写法
  WRITE:
    - core/lib/model/theme_token_types.dart
    - core/lib/model/theme_resolution.dart

SIGNATURE:
  # 严格照设计 §5.1 / §5.2 原文，不要自行增删字段。以下是必须逐字满足的形状约束：
  theme_token_types.dart: |
    // 包：persistence_core  文件：core/lib/model/theme_token_types.dart
    final class ThemeTokenSet {
      final ThemeTokenSection light;
      final ThemeTokenSection dark;
      final ThemeResolution resolution;        // 溯源，类型在 theme_resolution.dart
      const ThemeTokenSet({required this.light, required this.dark, required this.resolution});
    }
    final class ThemeTokenSection {
      final Map<String, dynamic> components;   // 组件 id -> 原始 Map（源无关，本层不解析业务语义）
      final Map<String, dynamic>? chart;       // 可空
      final Map<String, dynamic>? semantic;    // 可空
      const ThemeTokenSection({required this.components, this.chart, this.semantic});
    }
  theme_resolution.dart: |
    final class ThemeResolution {
      final String? activeThemeId;             // 未装包时 null（纯 bundled）
      final String? activeThemeVersion;
      final ThemeSelectionOrigin selectionOrigin;
      final List<ThemeLayerInfo> layers;       // 按优先级从高到低
      final DateTime resolvedAtUtc;
      final List<String> orphanedOverrideKeys; // 默认 const []
      const ThemeResolution({required this.activeThemeId, required this.activeThemeVersion,
        required this.selectionOrigin, required this.layers, required this.resolvedAtUtc,
        this.orphanedOverrideKeys = const []});
    }
    enum ThemeSelectionOrigin { userSelected, officialDefault, bundledFallback }
    final class ThemeLayerInfo {
      final ThemeLayerKind kind;
      final String sourceId;                   // 主题包 id / 'bundled' / 'user_override'
      final int contributedKeyCount;           // 诊断用
      const ThemeLayerInfo({required this.kind, required this.sourceId, required this.contributedKeyCount});
    }
    enum ThemeLayerKind { userOverride, installedPackage, bundled }

CONSTRAINTS:
  - `persistence_core` 不得依赖 `theme` 包或 `xuan_config`（设计 §2.2，验收 A5a/A5b）。
    这两个文件只 import dart 核心与同包类型，不 import 任何外部业务包。
  - `ThemeTokenSection.components` / `chart` / `semantic` 是 `Map<String, dynamic>`，
    **不在契约层做 unmodifiable 包装** -- 不可变性是 reference 合并产物的要求（A16），在 ACT 04/06 落地。
  - 所有公开成员必须有中文 dartdoc，照 `core/lib/model/ports.dart` 的密度（验收 A18，下限 >= 60，本 ACT 贡献若干条）。
  - 不要新建名为 `InstalledTheme` / `AvailableTheme` 的类型（已裁定移除，残留门禁会扫，见 ACT 07）。

TESTS_FIRST:
  CASES:
    - NAME: token_set_and_section_shape
      FILE: core/test/theme_resource_store_contract_test.dart
      BEHAVIOR: >
        构造 ThemeTokenSet（light/dark 各一个 ThemeTokenSection，含 resolution），
        断言三字段可读、类型正确；ThemeTokenSection.chart 与 semantic 接受 null。
        此测试在本 ACT 先写"形状"部分，ACT 02/06 会扩充同一文件。
      RED_COMMAND: cd core && flutter test test/theme_resource_store_contract_test.dart
      RED_EXPECT: 编译失败（ThemeTokenSet 不存在），退出码非 0
      COVERS: [A6]

    - NAME: resolution_orphan_default_empty
      FILE: core/test/theme_resource_store_contract_test.dart
      BEHAVIOR: >
        构造 ThemeResolution 不传 orphanedOverrideKeys，断言该字段 == const []。
        证明默认值生效（防止执行者漏写默认值导致 null）。
      RED_COMMAND: cd core && flutter test test/theme_resource_store_contract_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A15]

    - NAME: layer_kind_priority_order
      FILE: core/test/theme_resource_store_contract_test.dart
      BEHAVIOR: >
        断言 ThemeLayerKind.values 顺序为 [userOverride, installedPackage, bundled]，
        即优先级从高到低。这是 §6.1 三层模型的编译期锚点。
      RED_COMMAND: cd core && flutter test test/theme_resource_store_contract_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A15]

VERIFICATION:
  - CMD: cd core && dart analyze --fatal-infos lib/model/theme_token_types.dart lib/model/theme_resolution.dart
    EXPECT_EXIT: 0
  - CMD: grep -rn "class .*Impl\|UnimplementedError" core/lib/model/theme_token_types.dart core/lib/model/theme_resolution.dart
    EXPECT_EXIT: 1   # 零实现，无匹配
  - CMD: grep -rnE "^\s+(theme|xuan_config):" core/pubspec.yaml
    EXPECT_EXIT: 1   # 不依赖 theme / xuan_config
  - CMD: grep -rn "package:xuan_config\|package:theme" core/lib/model/theme_token_types.dart core/lib/model/theme_resolution.dart
    EXPECT_EXIT: 1

ON_FAIL:
  - RED 阶段测试没红（写实现前就绿）-> 测试没真正依赖新类型/新行为，
    停下重写测试，【不要】继续往下做
  - 实现后 VERIFICATION 某条不过 -> 先看是不是 EXPECT 写错（尤其 grep -c 的
    双 EXPECT 语义：无匹配时打印 0 且退出码 1，两者都断言），再改实现
  - core / drift / p2p 的【既有】测试变红 -> 立即停下。
    本 ACT 只加不改，既有测试变红说明动到了不该动的地方
  - SELF_CHECK/变红自检某条注入后【没有】变红 -> 那条门禁是假的，
    必须重写门禁而不是跳过自检（本仓门禁纪律第 8 条）
  - 基线类命令（analyze 数量、测试数量）不符 -> 不要改基线迁就实现，
    先确认是不是真的引入了新问题
  - `core/lib/model/dataset/` 下任何文件被改 -> 立即停下（XRAP 契约只读，stop condition #4）
  - 连续两次修不好同一条 -> 在纪要「决定记录」写下现象与已排除的可能，停下上报，
    不要连续第三次尝试

DONE_WHEN:
  - 两个源文件存在且 analyze 零 issue
  - 三个测试用例存在（先红后绿）
  - 不修改任何既有文件（本 ACT 只新增 2 个源文件；测试文件本 ACT 只写"形状"部分用例，ACT 02/06 会扩充）
