ACT_VERSION: 1
TASK_ID: mimo-storage-s5a-theme/07
TITLE: 门禁脚本 + 总验收 + BUILD-THEME 占位移交
TYPE: gate
ORDER: 7
DEPENDS_ON: [mimo-storage-s5a-theme/01, /02, /03, /04, /05, /06]
DISPATCH_STATUS: ready
STRONG_MODEL_ONLY: false

OBJECTIVE: >
  交付两个门禁脚本（analyze gate + residue gate），创建 BUILD-THEME 占位任务纪要（防三条 SHALL 丢失），
  并跑总验收命令串。本 ACT 完成后 S5a 整体交付完成。

SCOPE:
  READ:
    - docs/superpowers/specs/2026-08-03-s5a-theme-resource-distribution-design.md   # §11.0 总表；§11.6 残留门禁脚本全文
    - tasks/mimo-storage-s5a-theme.md                                              # A1/A2/A3/A4/A17/A18 验收口径
    - scripts/run_s1a_analyze_gate.sh                                              # S1a 既有，analyze gate 同形制
  WRITE:
    - scripts/run_s5a_analyze_gate.sh
    - scripts/run_s5a_residue_gate.sh
    - tasks/mimo-storage-build-theme.md                                            # BUILD-THEME 占位纪要（R5 Finding F2）

SIGNATURE:
  # §11.6：残留门禁脚本全文（照抄即可运行，已逐字核对与 §11.1/11.2/11.3 一致）
  run_s5a_residue_gate.sh: |
    #!/usr/bin/env bash
    # scripts/run_s5a_residue_gate.sh
    # S5a 残留门禁：已裁定移出 S5a 的标识符出现即失败。
    # 从仓库根目录执行。macOS /bin/bash 是 3.2.57 -- 只用普通数组，不用 declare -A / mapfile。
    set -euo pipefail

    readonly FORBIDDEN='InstalledTheme|AvailableTheme|ThemeRemoteFetcher|ThemePackageStore|ThemeSignatureVerifier|ThemeSignatureVerdict|refreshCatalog|listInstalled'

    # 三个显式文件数组（与设计 §11.1/11.2/11.3 逐字对应）
    CONTRACT_FILES=(
      "core/lib/model/theme_token_types.dart"
      "core/lib/model/theme_resolution.dart"
      "core/lib/model/theme_resource_store.dart"
      "core/lib/model/theme_value_types.dart"
      "core/lib/model/theme_source_ports.dart"
      "core/lib/model/theme_storage_policies.dart"
      "core/lib/model/theme_dataset.dart"
      "core/lib/model/theme_module_registry.dart"
    )
    REFERENCE_FILES=(
      "core/lib/reference/theme_token_merger.dart"
      "core/lib/reference/in_memory_theme_resource_store.dart"
      "core/lib/reference/in_memory_theme_materializer.dart"
      "core/lib/reference/theme_assembly.dart"
    )
    TEST_FILES=(
      "core/test/support/theme_bench_fixture.dart"
      "core/test/support/theme_probes.dart"
      "core/test/theme_token_merger_test.dart"
      "core/test/theme_resource_store_contract_test.dart"
      "core/test/theme_module_registry_test.dart"
      "core/test/theme_materializer_test.dart"
      "core/test/theme_startup_path_test.dart"
      "core/test/theme_merge_bench_test.dart"
    )
    ALL_FILES=( "${CONTRACT_FILES[@]}" "${REFERENCE_FILES[@]}" "${TEST_FILES[@]}" )

    # 覆盖下限之一：交付清单里的文件必须全部存在
    missing=0
    for f in "${ALL_FILES[@]}"; do
      if [ ! -f "${f}" ]; then
        echo "MISSING_FILE: ${f}"
        missing=$(( missing + 1 ))
      fi
    done
    if [ "${missing}" -ne 0 ]; then
      echo "SCAN_INCOMPLETE: ${missing} declared deliverable(s) missing"
      exit 2
    fi

    # 覆盖下限之二：数组本身不许被改空
    readonly SCANNED=${#ALL_FILES[@]}
    if [ "${SCANNED}" -lt 20 ]; then
      echo "SCAN_TOO_NARROW: only ${SCANNED} files in deliverable arrays (expected >= 20)"
      exit 2
    fi

    # 残留扫描。grep 三种退出码全部显式处理，不用 || true
    set +e
    matches="$(grep -nE "${FORBIDDEN}" "${ALL_FILES[@]}")"
    grep_status=$?
    set -e
    if [ "${grep_status}" -ge 2 ]; then
      echo "GREP_ERROR: exit ${grep_status}"
      exit 3
    fi
    if [ "${grep_status}" -eq 0 ]; then
      echo "RESIDUE_FOUND:"
      echo "${matches}"
      exit 1
    fi

    echo "RESIDUE_GATE_OK (scanned ${SCANNED} deliverable files, 0 residue)"
    exit 0

  # analyze gate：沿用 S1a 口径，开工时重新测定基线写死
  run_s5a_analyze_gate.sh: |
    #!/usr/bin/env bash
    # scripts/run_s5a_analyze_gate.sh
    # S5a 静态分析门禁，沿用 S1a 三条制（见 scripts/run_s1a_analyze_gate.sh 同形制）：
    # ①S5a 自有文件 --fatal-infos 零 issue；
    # ②有 issue 的文件集合是冻结白名单子集；
    # ③全包 issue 总数 ≤ 冻结基线。
    # ⚠️ 开工时重新测定基线（S1a 的 57 是它自己那次的，不可直接沿用）。
    # 执行者：照 run_s1a_analyze_gate.sh 的结构，把文件集合换成 S5a 自有文件
    # （8 契约 + 4 reference + 8 测试 + 2 脚本），测出基线后写死。
    set -euo pipefail
    # ... 照 S1a 结构实现 ...

CONSTRAINTS:
  - **两个脚本都必须 `chmod +x`**（验收命令直接调用它们）。
  - **residue gate 不用 `ls` glob**（R4-P1-7）：用显式文件数组 + 逐个 `[ -f ]` 断言。
    缺文件 `exit 2`（`MISSING_FILE:`），数组被改空 `exit 2`（`SCAN_TOO_NARROW:`），
    grep 自身出错 `exit 3`，发现残留 `exit 1`（`RESIDUE_FOUND:`）。
    grep 三种退出码全部显式处理，**不用 `|| true`**。
  - **analyze gate 基线必须重新测定**（S1a 的 57 不可沿用）。
  - **BUILD-THEME 占位纪要**（R5 Finding F2）：创建 `tasks/mimo-storage-build-theme.md`，
    含目标 + 三条 SHALL（spec.md :60 数值非法 / :86 未知字段 / 第二轮评审 #5 整体形状非法）+
    指向设计 §4.3/§11.5。哪怕只有这几行，也要落成真实文件，防三条 SHALL 在移交中丢失。
  - **三条变红自检**（设计 §11.6 表）逐条做：
    1. 在任一 `core/lib/model/theme_*.dart` 加一行 `// InstalledTheme` -> `exit 1` + `RESIDUE_FOUND:` -> 改回
    2. 把 `core/lib/reference/theme_assembly.dart` 临时改名 -> `exit 2` + `MISSING_FILE:` -> 改回
    3. 把 `TEST_FILES` 数组临时清空 -> `exit 2` + `SCAN_TOO_NARROW:` -> 改回
    每条改坏后 `git status --porcelain` 为空。

TESTS_FIRST:
  CASES:
    - NAME: residue_gate_self_check_residue
      FILE: scripts/run_s5a_residue_gate.sh   # 自检，不是 dart 测试
      BEHAVIOR: >
        临时在 core/lib/model/theme_token_types.dart 加 `// InstalledTheme` 注释，
        跑 bash scripts/run_s5a_residue_gate.sh，断言 exit 1 且 stdout 含 RESIDUE_FOUND:。
        改回后 git status 为空。
      RED_COMMAND: bash scripts/run_s5a_residue_gate.sh
      RED_EXPECT: exit 1 + stdout 含 RESIDUE_FOUND:
      COVERS: [残留门禁]

    - NAME: residue_gate_self_check_missing_file
      FILE: scripts/run_s5a_residue_gate.sh
      BEHAVIOR: >
        把 core/lib/reference/theme_assembly.dart 临时改名（mv 到 .bak），
        跑脚本断言 exit 2 + stdout 含 MISSING_FILE:。改回后 git status 为空。
      RED_COMMAND: bash scripts/run_s5a_residue_gate.sh
      RED_EXPECT: exit 2 + stdout 含 MISSING_FILE:
      COVERS: [残留门禁]

    - NAME: residue_gate_self_check_array_emptied
      FILE: scripts/run_s5a_residue_gate.sh
      BEHAVIOR: >
        临时把 TEST_FILES 数组清空（编辑脚本），跑脚本断言 exit 2 + stdout 含 SCAN_TOO_NARROW:。
        改回后 git status 为空。
      RED_COMMAND: bash scripts/run_s5a_residue_gate.sh
      RED_EXPECT: exit 2 + stdout 含 SCAN_TOO_NARROW:
      COVERS: [残留门禁]

VERIFICATION:
  # A1：analyze gate
  - CMD: bash scripts/run_s5a_analyze_gate.sh
    EXPECT_EXIT: 0
  # 残留门禁
  - CMD: bash scripts/run_s5a_residue_gate.sh
    EXPECT_EXIT: 0
  # A2：core 全量测试（排除 benchmark tag）
  - CMD: cd core && flutter test --exclude-tags benchmark
    EXPECT_EXIT: 0
  # A3：契约层零实现 + 覆盖下限 == 8
  - CMD: grep -rnE "class .*Impl|UnimplementedError" core/lib/model/theme_*.dart
    EXPECT_EXIT: 1
  - CMD: ls core/lib/model/theme_*.dart | wc -l
    EXPECT_STDOUT: "8"
    EXPECT_EXIT: 0
  # A4：theme 包零改动（theme 是独立仓库）
  - CMD: cd /Users/jingtaiwei/Git/Public/xuan-migration/theme && git status --porcelain
    EXPECT_STDOUT: ""
    EXPECT_EXIT: 0
  # A5a/b：persistence_core 不依赖 theme / xuan_config
  - CMD: grep -nE "^\s+(theme|xuan_config):" core/pubspec.yaml
    EXPECT_EXIT: 1
  # A17：xuan-qizhengsiyu 零改动
  - CMD: git -C /Users/jingtaiwei/Git/Public/xuan-migration/xuan-qizhengsiyu status --porcelain
    EXPECT_STDOUT: ""
    EXPECT_EXIT: 0
  # 两个脚本可执行
  - CMD: test -x scripts/run_s5a_analyze_gate.sh && test -x scripts/run_s5a_residue_gate.sh
    EXPECT_EXIT: 0
  # BUILD-THEME 占位纪要存在
  - CMD: test -f tasks/mimo-storage-build-theme.md
    EXPECT_EXIT: 0
  # 不改 XRAP 契约
  - CMD: git diff --quiet -- core/lib/model/dataset/
    EXPECT_EXIT: 0

DONE_WHEN:
  - 两个脚本存在、可执行、三条变红自检全过
  - BUILD-THEME 占位纪要存在
  - 总验收命令串全绿：
    `bash scripts/run_s5a_analyze_gate.sh && bash scripts/run_s5a_residue_gate.sh && (cd core && flutter test --exclude-tags benchmark)`
  - A1/A2/A3/A4/A5a/A5b/A17 全过
  - 不修改 XRAP 契约 / theme 包 / xuan-qizhengsiyu painter
