    - core/lib/model/theme_resolution.dart                                         # ACT 01 产物：ThemeResolution/ThemeLayerInfo/ThemeLayerKind
    - core/lib/model/theme_value_types.dart                                        # ACT 02 产物：OverrideEntry/OverrideOrigin
  WRITE:
