OBJECTIVE: >
  交付 §6.6 合并算法的权威实现（纯函数，无状态）。这是 S5a 的核心价值落地：
  三层取值（override > package > bundled，null 也算命中）、原子组补全、orphan 判定、
  反扁平化与字典序稳定排序。将来的 drift 生产实现必须复用它，不得重写。

