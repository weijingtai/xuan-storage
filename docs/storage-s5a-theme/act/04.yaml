SIGNATURE:
  # §6.6：纯函数，无状态。算法只有这一份权威定义。
  theme_token_merger.dart: |
    // 包：persistence_core  文件：core/lib/reference/theme_token_merger.dart
    // 【reference】§6.6 合并算法的可执行形式。纯函数，无状态，零 IO。

    /// 合并三层 token 为一份源无关的 ThemeTokenSet。
    ///
    /// 输入（均已扁平化，key 形如 light.components.four_zhu_card.shadow.color）：
    /// - bundledTokens: bundled 默认主题（恒存在，最后兜底）
    /// - packageTokens: 已装主题包；null 表示无已装包
    /// - overrides: 用户覆盖差量
    /// - activeThemeId / activeThemeVersion / selectionOrigin: 溯源信息
    ///
    /// 实现顺序（§6.6 末注）：1 输入校验 -> 5 orphan 判定 -> 2 逐 key 取值 -> 4 原子组补全 -> 3 记贡献数 -> 6 反扁平化
    ThemeTokenSet mergeThemeTokens({
      required Map<String, dynamic> bundledTokens,
      required Map<String, dynamic>? packageTokens,
      required Map<String, OverrideEntry> overrides,
      required String? activeThemeId,
      required String? activeThemeVersion,
      required ThemeSelectionOrigin selectionOrigin,
      required DateTime resolvedAtUtc,
    }) {
      // 见 §6.6 六步。关键点：
      //  - 第 2 步：null 也算命中，用 containsKey 不用 ??
      //  - 第 4 步：原子组清单见 §6.2（shadow/border/text_shadow/padding/margin）
      //  - 第 5 步：orphan 不参与输出，加入 orphanedOverrideKeys，数据不删
      //  - 第 6 步：所有层级 Map 按 key 字典序插入（SplayTreeMap 或先排序），顶层按 brightness 拆 light/dark
    }

    // 原子组清单（写死，不得由执行者推断，§6.2）：
    //   .shadow        -> color/blur_radius/offset_x/offset_y
    //   .border        -> color/width
    //   .text.text_shadow -> color/blur_radius/offset_x/offset_y
    //   .padding/.margin -> top/bottom/left/right/all（标量整体替换，Map 按方向补全）

CONSTRAINTS:
  - **纯函数，无状态**：不得持有任何实例字段、缓存、IO。缓存是 ACT 06 store 的职责，不在本文件。
  - **null 也算命中**（§6.6 第 2 步）：某层显式给 null 须命中该层而非穿透下层。**用 `containsKey`，不用 `??`**。
    这是 A9 的关键用例，写错就红。
  - **orphan 判定顺序**（§6.6 末注）：必须 1->5（判定）->2->4->3->6。若 orphan 在第 2 步之后判定，
    会参与原子组补全并污染结果。写测试时注入 orphan 覆盖验证它不出现在结果里。
  - **原子组补全**（§6.6 第 4 步）：组内至少一个叶子来自较高层时，其余成员从较低层补齐；
    较低层也没有则保持缺失（由 token_loader 字段默认值兜底，不在本层）。padding/margin 双形态见 §6.2。
  - **字典序稳定**（§6.6 第 6 步）：所有层级 Map 按 key 字典序插入（`SplayTreeMap` 或先排序后插入）。
    这是 P7 的实现保证。
  - **不可变性**（§6.6 末）：合并产出的 `ThemeTokenSection.components/chart/semantic` 必须是
    `Map.unmodifiable` 且内部嵌套逐层 unmodifiable。这是 A16/P2 的保证。
  - dartdoc 中文（A18）。

