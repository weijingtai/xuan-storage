SIGNATURE:
  # 严格照设计 §5.5.4 原文。CountingDatasetInstaller 的完整定义已在设计 §5.5.4 给出，照抄即可编译。
  theme_probes.dart: |
    // 包：persistence_core (test)  文件：core/test/support/theme_probes.dart
    // 【reference 测试探针】§5.5.4。三个探针，照抄即可编译。

    /// 计数式 ThemeLocalReader spy。P3-b 行为正向控制用。
    final class CountingLocalReader implements ThemeLocalReader {
      CountingLocalReader(this._fixture);
      final Map<String, dynamic> _fixture;   // 任意非空 fixture（readBundledTokens 返回它）

      int bundledReadCount = 0;
      int activeThemeReadCount = 0;
      int overrideReadCount = 0;

      @override
      Future<Map<String, dynamic>> readBundledTokens() async {
        bundledReadCount++;
        return Map.unmodifiable(_fixture);
      }
      @override
      Future<Map<String, dynamic>?> readActiveThemeTokens(String themeId) async {
        activeThemeReadCount++;
        return null;   // 默认无已装主题包，P6 用 SlowLocalReader 替代
      }
      @override
      Future<Map<String, OverrideEntry>> readOverrides() async {
        overrideReadCount++;
        return const <String, OverrideEntry>{};
      }
    }

    /// 活跃世代读取挂起的 reader。P6 用：readActiveThemeTokens 返回永不完成的 Completer.future，
    /// 另两个方法正常返回。
    final class SlowLocalReader implements ThemeLocalReader {
      SlowLocalReader(this._fixture);
      final Map<String, dynamic> _fixture;
      final Completer<Map<String, dynamic>?> _never = Completer<Map<String, dynamic>?>();

      @override
      Future<Map<String, dynamic>> readBundledTokens() async => Map.unmodifiable(_fixture);
      @override
      Future<Map<String, dynamic>?> readActiveThemeTokens(String themeId) => _never.future;  // 永不完成
      @override
      Future<Map<String, OverrideEntry>> readOverrides() async => const <String, OverrideEntry>{};
    }

    /// P4/A21 用的 XRAP 安装器 spy。implements DatasetInstaller 必须六个抽象方法全实现。
    /// 它不只是计数器 -- ensureInstalled 会真的调 descriptor.materializer() 工厂并驱动 materialize，
    /// 这样 P4/A21 测的才是 §4.5 那条真链路。本 fake 零 IO 零网络：载荷来自入参的内存 Stream。
    /// 完整定义见设计 §5.5.4，照抄：构造器 {required Stream<List<int>> Function() bundledPayload}、
    /// 六个 <方法名>CallCount（初值 0）、calledDatasetIds（List<String> 初值 <String>[]）、
    /// resetCounts()、六个方法逐个写死 fake 返回表达式。
    /// ensureInstalled: +1 追加 id；已有 ready -> alreadyCurrent(_record!)；否则调
    ///   DatasetRegistry.lookup(datasetId)! .materializer() .materialize(manifest: d.bundledManifest,
    ///   payload: bundledPayload(), generation: 0) -> _record = InstalledDataset(datasetId, generation:0,
    ///   manifest: d.bundledManifest, status: DatasetGenerationStatus.ready, sourceId:'fake.bundled',
    ///   actualRowCount: outcome.rowCount, installedAtUtc: DateTime.utc(2026)) -> InstallOutcome.installed(_record!)
    /// checkForUpdate: +1 追加 id；恒返 sourceUnavailable(reason:'fake: 本探针不触网', current:_record)
    /// active: +1 追加 id；返 _record（未装过则 null） -- 读路径走这里
    /// generations: +1 追加 id；返 _record == null ? <InstalledDataset>[] : [_record!]
    /// rollbackTo: +1 追加 id；返 alreadyCurrent(_record!)；_record == null 时抛 StateError
    /// collectGarbage: +1；only != null 时追加它否则追加 '*'；恒返 0 字节
    final class CountingDatasetInstaller implements DatasetInstaller {
      CountingDatasetInstaller({required Stream<List<int>> Function() bundledPayload});
      int ensureInstalledCallCount = 0;
      int checkForUpdateCallCount = 0;
      int activeCallCount = 0;
      int generationsCallCount = 0;
      int rollbackToCallCount = 0;
      int collectGarbageCallCount = 0;
      final List<String> calledDatasetIds = <String>[];
      void resetCounts();
      // ... 六个 @override 方法照设计 §5.5.4 实现 ...
    }

  # §7.5 ThemeBenchFixture：叶子数 >= 700 防空输入假通过。
  theme_bench_fixture.dart: |
    // 包：persistence_core (test)  文件：core/test/support/theme_bench_fixture.dart
    // 【reference 共同 fixture】§7.5。供 P1/P2/P7 与 P4/A21 用例使用。

    /// 共同 fixture（§7.5）：
    /// - bundled 层：16 个 components，每个含 §6.2 全部原子组（shadow 4 + border 2 + padding 4）+ 8 标量 -> 每组件 18 叶子
    /// - 6 个组件各带 1 variant（对齐 default.yaml variants=6）
    /// - package 层：覆盖 8 个组件的各 3 叶子
    /// - override 层：50 条（含 5 条 orphan，驱动 §6.6 第 5 步）
    /// - light/dark 各一份 -> 全量约 (16×18 + 6×18) × 2 ≈ 792 叶子 key
    /// 禁止用空 Map 跑 P1 -- 那是假通过。叶子总数须断言 >= 700。
    final class ThemeBenchFixture {
      ThemeBenchFixture();

      /// bundled 层扁平 token（key 形如 light.components.four_zhu_card.shadow.color）。
      Map<String, dynamic> get bundledTokens;

      /// package 层扁平 token（覆盖 bundled 的 8 个组件各 3 叶子）。
      Map<String, dynamic> get packageTokens;

      /// override 层 50 条（含 5 条 orphan，orphan 的 key 不在 bundled/package）。
      Map<String, OverrideEntry> get overrides;

      /// §4.3 行 schema 的 JSONL 字节流，供 CountingDatasetInstaller 落地 generation 0。
      /// 每次返回一条新的 Stream<List<int>>（Stream 只能监听一次）。
      /// 内容 == bundledTokens 扁平 key 按 {"k":..,"v":..,"t":..} 序列化，无 g 字段（R4-P0）。
      Stream<List<int>> Function() get bundledJsonlBytes;

      /// 叶子总数下限断言（>= 700，防 fixture 被悄悄改小，§7.5）。
      /// 测试启动时调一次：assert(ThemeBenchFixture().leafCount >= 700);
      int get leafCount;
    }

CONSTRAINTS:
  - **CountingDatasetInstaller.ensureInstalled 必须真调 `descriptor.materializer().materialize(...)`**（设计 §5.5.4），
    不能伪造落地物。否则 P4/A21 测的不是 §4.5 真链路。它通过 `DatasetRegistry.lookup(datasetId)` 取 descriptor。
  - **六个计数字段初值一律 0；calledDatasetIds 初值 `<String>[]`（List 不是 Set，可重复）**。
  - **SlowLocalReader.readActiveThemeTokens 返回永不完成的 `Completer.future`**（不是 `Future.delayed`，是永远不 complete）。
  - **ThemeBenchFixture.leafCount >= 700**（§7.5 硬要求，防空输入假通过）。测试启动时必须断言一次。
  - **bundledJsonlBytes 的内容不含 `g` 字段**（R4-P0：载荷行只有 k/v/t）。
  - 这两个文件是 `core/test/support/` 下的支撑文件，**不是测试文件**（无 `test()` 调用）--
    ACT 07 的 A2 逐文件计数须豁免它们（见 ACT 07 R12 修复）。
  - 不得改 XRAP 契约（`core/lib/model/dataset/`）。
  - dartdoc 中文（A18）。

