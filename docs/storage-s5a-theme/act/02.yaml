ACT_VERSION: 1
TASK_ID: mimo-storage-s5a-theme/02
TITLE: 契约层 · 主门面 ThemeResourceStore + 值类型 + 注入端口 ThemeLocalReader
TYPE: contract
ORDER: 2
DEPENDS_ON: [mimo-storage-s5a-theme/01]
DISPATCH_STATUS: ready
STRONG_MODEL_ONLY: false

OBJECTIVE: >
  交付 S5a 的主读写门面端口、配套值类型、以及唯一的本地读取注入端口。
  本 ACT 是「读写不对称」（§2.5）与「零网络结构性保证」（§5.5.1/§5.5.2/§5.5.3）的契约落点。
  零实现，只签名 + dartdoc。

SCOPE:
  READ:
    - docs/superpowers/specs/2026-08-03-s5a-theme-resource-distribution-design.md   # §5.3 主门面；§5.4 值类型；§5.5.2 注入端口；§5.5.3 store 构造器；§2.5 读写不对称；§2.6 写入形状
    - core/lib/model/theme_token_types.dart                                        # ACT 01 产物
    - core/lib/model/theme_resolution.dart                                         # ACT 01 产物
    - core/lib/model/cancellation_token.dart                                       # S1a 既有，CancellationToken 类型
    - core/lib/model/storage_error.dart                                            # StorageError 基类
  WRITE:
    - core/lib/model/theme_resource_store.dart
    - core/lib/model/theme_value_types.dart
    - core/lib/model/theme_source_ports.dart

SIGNATURE:
  # 严格照设计 §5.3 / §5.4 / §5.5.2 原文。不要增删方法。
  theme_resource_store.dart: |
    // 包：persistence_core  文件：core/lib/model/theme_resource_store.dart
    abstract interface class ThemeResourceStore {
      String get scopeUid;

      // ── 读 ──
      /// 解析当前生效主题：三层合并（override > 已装包 > bundled），逐 key 取第一命中。
      /// 【性能硬约束】不得发起任何网络请求、不得触发 XRAP 安装流程。
      Future<ThemeTokenSet> resolve({CancellationToken? cancel});

      /// 当前生效主题的解析结果流。覆盖层变更、主题切换、XRAP 活跃指针翻转时推送。
      Stream<ThemeTokenSet> watchResolved();

      /// 本地可用的主题清单（XRAP 活跃世代落地物 + generation 0）。
      Future<List<LocalTheme>> listLocalThemes();

      // ── 写 · 主题选择 ──
      Future<void> selectTheme(String themeId);
      Future<void> clearThemeSelection();

      // ── 写 · 用户覆盖层（只作用于用户覆盖层，§2.6）──
      /// 批量应用覆盖差量。原子提交：要么全成，要么全不成。只存差量。
      /// 【只作用于用户覆盖层】§2.5 读写不对称：写不碰主题包与 bundled。
      Future<void> applyOverrides({required Map<String, dynamic> patch, required OverrideOrigin origin});

      /// 删除指定覆盖，恢复到下层。不存在的 key 静默忽略（幂等）。
      /// 【只作用于用户覆盖层】仅删用户覆盖，不动主题包与 bundled。
      Future<void> removeOverrides(Set<String> tokenKeys);

      /// 当前全部用户覆盖（诊断与"恢复默认"UI 用）。
      Future<Map<String, OverrideEntry>> listOverrides();
    }
    // ⚠️ 本端口不提供任何安装类方法（归 XRAP，§0.0 裁定 3）。

  theme_value_types.dart: |
    final class LocalTheme {
      final String id;
      final String displayName;
      final String author;
      final int generation;        // XRAP 世代号；0 即 bundled 内置世代
      const LocalTheme({required this.id, required this.displayName, required this.author, required this.generation});
    }
    final class OverrideEntry {
      final dynamic value;
      final OverrideOrigin origin;
      final DateTime updatedAtUtc;
      const OverrideEntry({required this.value, required this.origin, required this.updatedAtUtc});
    }
    final class OverrideOrigin {
      static const manual = OverrideOrigin._('manual', null, null);
      final String kind;
      final String? sourceThemeId;
      final String? sourceThemeVersion;
      const OverrideOrigin._(this.kind, this.sourceThemeId, this.sourceThemeVersion);
      const OverrideOrigin.fromPackage({required String themeId, required String version})
          : this._('package', themeId, version);
    }

  theme_source_ports.dart: |
    // §5.5.2：S5a 只保留一个注入端口（remote/package/signature 三类归 XRAP）。
    abstract interface class ThemeLocalReader {
      /// 读取 bundled（XRAP generation 0）的已解析、已扁平化 token。
      /// 返回值不得为 null -- bundled 是最后兜底层，恒存在（XRAP 协议 P5）。
      Future<Map<String, dynamic>> readBundledTokens();

      /// 读取 XRAP 当前活跃世代的主题 token；无已装主题时返回 null。
      /// 【不触发安装】只读已翻转到活跃指针的落地物。
      Future<Map<String, dynamic>?> readActiveThemeTokens(String themeId);

      /// 读取用户覆盖差量（private 层，XRAP 硬拒的那部分）。
      Future<Map<String, OverrideEntry>> readOverrides();
    }

CONSTRAINTS:
  - `ThemeResourceStore` 是 `abstract interface class`，**不提供任何安装类方法**
    （`install`/`uninstall`/`download` 等名字出现即违规，归 XRAP）。
  - `applyOverrides` 与 `removeOverrides` 的 dartdoc 各含「只作用于用户覆盖层」字样；
    `resolve` 的 dartdoc 含「三层合并」字样（验收 A6，逐条 grep -c == 1）。
  - `ThemeLocalReader` 是**唯一**注入端口。不得再定义 `ThemeRemoteFetcher` /
    `ThemePackageStore` / `ThemeSignatureVerifier` 等端口（残留门禁会扫，见 ACT 07）。
  - `InMemoryThemeResourceStore` 的构造器在 ACT 06 落地，本 ACT 只定义端口。
    构造器形状约束（P3-a1 tear-off 断言会检查）：
    `InMemoryThemeResourceStore({required String scopeUid, required ThemeLocalReader localReader})`，
    **没有第三参数**（这是零网络的结构性保证）。
  - dartdoc 中文，密度照 `ports.dart`（A18）。

