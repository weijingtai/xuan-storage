      BEHAVIOR: >
        构造 OverrideOrigin.fromPackage(themeId: 'pkg.a', version: '1.2')，
        断言 kind == 'package' / sourceThemeId == 'pkg.a' / sourceThemeVersion == '1.2'。
        OverrideOrigin.manual 断言三字段为 manual/null/null。证明"存值不存引用"。
      RED_COMMAND: cd core && flutter test test/theme_resource_store_contract_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A6]

