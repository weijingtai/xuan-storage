        抽象方法名集合（通过 `ThemeResourceStore` 的 `abstract interface` 声明无法运行时枚举，
        故改用源码扫描）：grep `Future<.*> (install|uninstall|download|fetch|verify)` 在
        theme_resource_store.dart 内 EXPECT_EXIT=1。此用例在 ACT 06 用构造器 tear-off
        断言 P3-a1 兜住；本 ACT 先落 A7 的源码扫描版。
      RED_COMMAND: cd core && flutter test test/theme_resource_store_contract_test.dart
