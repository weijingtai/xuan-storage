      COVERS: [A7]

    - NAME: read_write_asymmetry_dartdoc_present
      FILE: core/test/theme_resource_store_contract_test.dart
      BEHAVIOR: >
        断言 theme_resource_store.dart 中：
        `applyOverrides` 段落 dartdoc 含「只作用于用户覆盖层」；
        `removeOverrides` 段落 dartdoc 含「只作用于用户覆盖层」；
        `resolve` 段落 dartdoc 含「三层合并」。
        用读文件 + 子串断言（不依赖运行时反射）。
      RED_COMMAND: cd core && flutter test test/theme_resource_store_contract_test.dart
      RED_EXPECT: 编译失败，先红
