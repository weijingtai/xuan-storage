           都填【互不相同的可辨识值】（不要全填 null，null 比对不出搬运错误）；
        3. 打开 PersistenceDriftDatabase 触发升级；
        4. 断言升级后：
           - 行数【仍是 3】（漏搬会红）；
           - 每一行的每一个字段【逐字段】等于插入时的值（搬错列会红）；
           - 每一行的 peer_id 【都】等于 'firestore'（回填错会红）。
        只断言"表里有 peer_id 列"是不够的 —— 那种写法漏搬数据也会绿。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_schema_v7_migration_test.dart
      RED_EXPECT: 编译失败或断言失败（schemaVersion 仍是 6、无 peer_id 列），退出码非 0
      COVERS: [A3]

    - NAME: backfilled_peer_id_matches_firestore_gateway_literal
      FILE: drift/test/sync/outbox_peer_ack_schema_v7_migration_test.dart
      BEHAVIOR: >
        以纯文本读取 firebase/lib/persistence_firebase.dart，提取
        `PeerId('...')` 里的字面量，断言它与本迁移的回填常量【逐字相等】。
        不要把 'firestore' 在两处各写一遍就算数 —— 那正是将来某人改了一处
        忘了另一处的入口，而后果是历史游标全部失效且无任何报错。
        若 firebase 包路径不可达（跨包读文件），改为断言迁移代码里的回填常量
        逐字等于 'firestore' 并在注释里指明它与 ACT 01b 的对应关系。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_schema_v7_migration_test.dart
      RED_EXPECT: 断言失败，先红
      COVERS: [A3]

    - NAME: fresh_database_creates_v7_shape_directly
      FILE: drift/test/sync/outbox_peer_ack_schema_v7_migration_test.dart
      BEHAVIOR: >
        新建库（`NativeDatabase.memory()`，走 onCreate 不走 onUpgrade），断言：
        - t_outbox_peer_ack 表存在且主键是 (operation_id, peer_id)；
        - t_sync_state 主键是 (scope_uid, peer_id, entity_type)；
        - 两条 idx_outbox_peer_ack_* 索引存在。
        onCreate 与 onUpgrade 是两条独立代码路径，只测一条是 drift 迁移最经典的漏。
        主键与索引用 `PRAGMA table_info` / `PRAGMA index_list` 查，不要靠"插入不报错"推断。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_schema_v7_migration_test.dart
      RED_EXPECT: 断言失败，先红
      COVERS: [A3]

    - NAME: peer_ack_primary_key_rejects_duplicate_pair
      FILE: drift/test/sync/outbox_peer_ack_schema_v7_migration_test.dart
      BEHAVIOR: >
        非 happy-path。往 t_outbox_peer_ack 插入 (op-1, cloud)，再插入 (op-1, lan) ——
        断言【两行都在】（同一操作对不同对端各一行，这是本表存在的意义）。
        再重复插入 (op-1, cloud) —— 断言抛主键冲突。
        若主键错写成只有 operationId，第一步就会红；错写成没有主键，第三步会红。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_schema_v7_migration_test.dart
      RED_EXPECT: 断言失败，先红
      COVERS: [A3]

    - NAME: t_outbox_table_shape_unchanged
