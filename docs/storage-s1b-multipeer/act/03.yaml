SELF_CHECK:
  - 把 _InMemoryOutboxStore 的 ack 临时改成按 operationId 存（丢掉 peerId 维度）→
    `ack_for_one_peer_does_not_hide_record_from_another` 与
    `backlog_stream_is_per_peer` 必须【同时】变红。只红一条说明覆盖不足 → 改回
  - 把 markFailed 的 dead 判定临时改成全局 →
    `dead_for_one_peer_does_not_kill_another` 必须变红 → 改回
  - 给 ports.dart 里任意一个 peerId 临时加默认值 →
    `no_default_value_on_peer_id` 与 grep 门禁必须变红 → 改回
  - 三次自检后 `git status --porcelain` 必须为空

ON_FAIL:
  - RED 阶段测试没红（写实现前就绿）→ 测试没真正依赖新类型/新行为，
    停下重写测试，【不要】继续往下做
  - 实现后 VERIFICATION 某条不过 → 先看是不是 EXPECT 写错（尤其 grep -c 的
    双 EXPECT 语义：无匹配时打印 0 且退出码 1），再改实现
  - core / drift / firebase 的【既有】测试变红 → 立即停下。
    本 ACT 只加不改，既有测试变红说明动到了不该动的地方
  - SELF_CHECK 的某条注入后【没有】变红 → 那条门禁是假的，
    必须重写门禁而不是跳过自检
  - 基线类命令（analyze 数量、测试数量）不符 → 不要改基线迁就实现，
    先确认是不是真的引入了新问题
  - 连续两次修不好同一条 → 在纪要「决定记录」写下现象与已排除的可能，停下上报，
    不要连续第三次尝试

DONE_WHEN:
  - ports.dart 的【11 个】方法带 required PeerId，enqueue 逐字未变
  - 两个内存 fake 按二元组/三元组存状态，core 全部测试绿
  - 六个测试用例全部存在，三条 SELF_CHECK 已实做并确认能变红
  - drift 处于【预期的编译失败】状态 —— 这是中间态，不是缺陷，写进当前状态区
