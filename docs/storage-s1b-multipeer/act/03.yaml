        把 peer 维度塞进 t_outbox 会让 payload 复制 N 份并制造 N 份可能不一致的真相 ——
        这是个很容易"顺手就做了"的错误设计，需要一条测试拦着。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_schema_v7_migration_test.dart
      RED_EXPECT: 断言失败，先红
