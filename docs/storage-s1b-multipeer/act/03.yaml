        把 peer 维度塞进 t_outbox 会让 payload 复制 N 份并制造 N 份可能不一致的真相 ——
        这是个很容易"顺手就做了"的错误设计，需要一条测试拦着。
      RED_COMMAND: cd drift && flutter test test/sync/schema_v7_migration_test.dart
      RED_EXPECT: 断言失败，先红
      COVERS: [A3]

    - NAME: old_migration_branches_untouched
      FILE: drift/test/sync/schema_v7_migration_test.dart
      BEHAVIOR: >
        以纯文本读取 drift/lib/persistence_drift.dart，断言 onUpgrade 里
        `if (from < 2)` 到 `if (from < 6)` 五个分支【逐字】仍在，
        且 `if (from < 7)` 恰好出现 1 次。
        历史迁移路径改一个字都可能让停留在旧版本的用户升级失败，
        而那类用户你无法测试 —— 只能靠文本级守卫。
      RED_COMMAND: cd drift && flutter test test/sync/schema_v7_migration_test.dart
      RED_EXPECT: 断言失败，先红
      COVERS: [A3]

VERIFICATION:
  - CMD: cd drift && flutter test test/sync/schema_v7_migration_test.dart
    EXPECT_EXIT: 0
  # 本 ACT 全程不破坏编译：drift 整包 ERROR 必须为 0
  - CMD: 'cd drift && dart analyze --format=machine 2>/dev/null | grep -c "^ERROR"'
    EXPECT_STDOUT: "0"
    EXPECT_EXIT: 1
  - CMD: cd drift && flutter test
    EXPECT_EXIT: 0
  # core 与 firebase 完全没被卷入
  - CMD: cd core && flutter test
    EXPECT_EXIT: 0
  - CMD: cd firebase && flutter test
    EXPECT_EXIT: 0
  - CMD: git diff --exit-code "$(cat .act-base)"..HEAD -- core firebase
    EXPECT_EXIT: 0
  - CMD: 'grep -c "int get schemaVersion => 7;" drift/lib/persistence_drift.dart'
    EXPECT_STDOUT: "1"
    EXPECT_EXIT: 0
  # 五段历史迁移分支一个不少
  - CMD: 'for n in 2 3 4 5 6; do grep -q "if (from < $n)" drift/lib/persistence_drift.dart || { echo "LOST:$n"; exit 1; }; done; echo OLD_BRANCHES_OK'
    EXPECT_STDOUT: "OLD_BRANCHES_OK"
    EXPECT_EXIT: 0
  - CMD: 'grep -c "if (from < 7)" drift/lib/persistence_drift.dart'
    EXPECT_STDOUT: "1"
    EXPECT_EXIT: 0
  # 回填常量正确
  - CMD: "grep -c \"Constant('firestore')\" drift/lib/persistence_drift.dart"
    EXPECT_STDOUT: "1"
    EXPECT_EXIT: 0
  # 主键已切到三元组
  - CMD: 'grep -c "Set<Column> get primaryKey => {scopeUid, peerId, entityType};" drift/lib/persistence_drift.dart'
    EXPECT_STDOUT: "1"
    EXPECT_EXIT: 0
  # t_outbox 主键未变
  - CMD: 'grep -c "Set<Column> get primaryKey => {operationId};" drift/lib/persistence_drift.dart'
    EXPECT_STDOUT: "1"
    EXPECT_EXIT: 0
  # 不得用手写 ALTER TABLE 改主键
  - CMD: 'grep -niE "customStatement\(.*ALTER TABLE.*t_sync_state" drift/lib/persistence_drift.dart'
    EXPECT_EXIT: 1
  # 本 ACT 不碰任何 Store / DAO 实现体
  - CMD: 'git diff "$(cat .act-base)"..HEAD -- drift/lib/persistence_drift.dart | grep -E "^[+-].*(class DriftOutboxStore|class DriftSyncStateStore|class OutboxRecordsDao|class SyncStatesDao)"'
    EXPECT_EXIT: 1
  # 跨包比对测试没有降级分支（不许出现"读不到就退而求其次"的 skip）
  - CMD: 'grep -nE "skip:|, skip" drift/test/sync/schema_v7_migration_test.dart'
    EXPECT_EXIT: 1

SELF_CHECK:
  - 把回填常量临时改成空串 → `v6_upgrade_preserves_every_cursor_field` 与
    `backfilled_peer_id_matches_firestore_gateway_literal` 必须【同时】变红 → 改回
  - 把 firebase 侧的 `PeerId('firestore')` 临时改成 `PeerId('firestore_v2')` →
    `backfilled_peer_id_matches_firestore_gateway_literal` 必须变红 → 改回。
    **这一步证明跨包比对真的跨了包**，只比对本文件常量的写法这一步不会红
  - 把 peer_id 列的 withDefault 临时去掉（让既有行为 NULL）→
    迁移测试必须变红 → 改回
  - 在 TableMigration 里临时把 cursor_updated_at_utc 映射成常量（模拟搬错列）→
    `v6_upgrade_preserves_every_cursor_field` 必须变红并指出是哪个字段 → 改回。
    **这一步是本 ACT 的关键自检** —— 如果它不红，说明你的迁移测试只验了列存在、
    没有逐字段比对，那么真正的搬运错误也不会被抓到
  - 把 t_sync_state 主键临时改回二元组 →
    `sync_state_pk_allows_same_entity_for_two_peers` 必须变红 → 改回
  - 把 OutboxPeerAcks 主键临时改成只有 operationId →
    `peer_ack_primary_key_rejects_duplicate_pair` 必须变红 → 改回
  - 六次自检后 `git status --porcelain` 必须为空

ON_FAIL:
  - RED 阶段测试没红（写实现前就绿）→ 测试没真正依赖新类型/新行为，
    停下重写测试，【不要】继续往下做
  - 实现后 VERIFICATION 某条不过 → 先看是不是 EXPECT 写错（尤其 grep -c 的
    双 EXPECT 语义：无匹配时打印 0 且退出码 1），再改实现
  - 【必须】drift 整包编译不过或既有测试变红 → 立即停下，撤回你多改的东西。**
    本 ACT 的定义性质就是"全程绿"，编译不过说明你碰了端口或 DAO
  - SELF_CHECK 的某条注入后【没有】变红 → 那条门禁是假的，
    必须重写门禁而不是跳过自检
  - 跨包定位 firebase 源文件失败 → **不要改成断言本文件常量**，
    先修定位函数（照抄 ACT 02 的逐级向上找法）。改断言等于放弃这条门禁
  - 基线类命令（analyze 数量、测试数量）不符 → 不要改基线迁就实现，
    先确认是不是真的引入了新问题
  - 连续两次修不好同一条 → 在纪要「决定记录」写下现象与已排除的可能，停下上报，
    不要连续第三次尝试

DONE_WHEN:
  - schemaVersion 为 7，onUpgrade 新增且仅新增 from<7 一段，前五段逐字未动
  - t_outbox_peer_ack 表存在，主键 (operation_id, peer_id)，两条索引就位
  - t_sync_state 有 peer_id 列（默认 'firestore'），主键为三元组
  - 【必须】drift 整包编译通过、276 个既有测试全绿；core / firebase 零 diff**
  - 八个测试用例全部存在且通过
  - 六条 SELF_CHECK 已实做并确认能变红（尤其第二条跨包、第四条搬错列）
  - .act-base 已删除，未被提交
