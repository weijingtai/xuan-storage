OBJECTIVE: >
  把 §5.2.2 第 1、2 条要求的【全部 schema 变更】一次做完，且【一个字都不碰端口与
  Store 实现】。本 ACT 结束时 drift 整包仍然编译、276 个既有测试仍然全绿。

  一次做完的三件事：
    ① 建 t_outbox_peer_ack 表（per-peer ack 水位）
    ② t_sync_state 加 peer_id 列（带默认值 'firestore'，既有行自动回填）
    ③ t_sync_state 主键切到 {scopeUid, peerId, entityType}

  ⚠ **为什么③放在这里而不是留给端口那个 ACT** —— 见 WHY_SCHEMA_GOES_FIRST。

WHY_SCHEMA_GOES_FIRST: >
  ⚠ 这是转译 v3 相对 v2 的结构性改动，人类 2026-08-02 裁定（方案 A）。开工前读懂它。

  转译 v2 试图三步走：端口(03) → 加列(04) → 主键+实现(05)，
  想让每一步都保持可编译。**这做不到**，实测原因：

    drift/lib/persistence_drift.dart:614  class DriftOutboxStore implements OutboxStore
    drift/lib/persistence_drift.dart:916  class DriftSyncStateStore implements SyncStateStore

  这两个类【直接 implements core 的端口】。一旦端口加了 `required peerId`，
  它们必然报 NON_ABSTRACT_CLASS_INHERITS_ABSTRACT_MEMBER —— 编译是被
  【端口变更】打断的，不是被 schema 打断的，加不加列都一样红（Codex R2 已实证）。

  结论：在静态类型 + 跨包 implements 的结构下，"端口变更"与"实现跟进"
  **无法拆到两个 ACT 而不产生不可编译的中间态**。

  于是改成：
    · 本 ACT（03）= 纯 schema。端口不动、Store 签名不动 ⇒ 整包全程绿。
    · 下一个 ACT（04）= 端口 + 实现，在【同一个 ACT 内】从红走到绿。

  【关键事实，本 ACT 成立的前提】：改 t_sync_state 主键【不会】破坏编译。
  drift 的 `primaryKey` override 只影响生成的 DDL 与 upsert 的冲突目标；
  SyncStatesDao 的 `where(tbl.scopeUid.equals(..) & tbl.entityType.equals(..))`
  是列比较，不依赖主键，照常编译。而此刻 peer_id 只有 'firestore' 一个取值，
  三元组主键的唯一性与二元组等价 ⇒ **行为零变化**。
  如果你发现改完主键 drift 编译不过，那是你顺手改了别的东西，撤回来。

WHY_STRONG_MODEL: >
  ⚠ 这个 ACT 为什么必须强模型：
  写错的迁移【不会抛异常、不会让测试变红】。t_sync_state 主键从
  {scopeUid, entityType} 变成 {scopeUid, peerId, entityType}，SQLite 上做不到
  ALTER，必须建新表 + 搬数据 + 改名。搬数据时若把 peerId 回填成空串、或漏搬几行、
  或把 cursor_updated_at_utc 搬丢，结果是【所有历史游标失效 → 全量重拉】——
  用户看到的是"app 突然卡住并重新下载全部数据"，而代码里一行错误日志都没有。
  这类 bug 只有靠"造一个 v6 库、升级、逐字段比对"才能抓到，所以 TESTS_FIRST
  的第二条是本 ACT 的生死线。

