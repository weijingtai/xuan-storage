TASK_ID: mimo-storage-s1b-multipeer/03
TITLE: drift schema v6 → v7 —— t_outbox_peer_ack 新表 + t_sync_state 主键加 peerId + 历史行回填
TYPE: schema-migration
ORDER: 4
DEPENDS_ON: [mimo-storage-s1b-multipeer/02]
DISPATCH_STATUS: ready
STRONG_MODEL_ONLY: true    # 全任务风险最高的一块：迁移写错【不会报错】，但会静默丢历史游标

OBJECTIVE: >
  给 ACT 02 定下的 per-peer 语义配上持久化结构（§5.2.2 第 1、2 条）。
  本 ACT【只动 schema 与迁移】，不改 DriftOutboxStore / DriftSyncStateStore 的方法体 ——
  那是 ACT 04。拆开是因为迁移错误的代价与实现错误的代价完全不是一个量级。

WHY_STRONG_MODEL: >
  ⚠ 这个 ACT 为什么必须强模型：
  写错的迁移【不会抛异常、不会让测试变红】。t_sync_state 主键从
  {scopeUid, entityType} 变成 {scopeUid, peerId, entityType}，SQLite 上做不到
  ALTER，必须建新表 + 搬数据 + 改名。搬数据时若把 peerId 回填成空串、或漏搬几行、
  或把 cursor_updated_at_utc 搬丢，结果是【所有历史游标失效 → 全量重拉】——
  用户看到的是"app 突然卡住并重新下载全部数据"，而代码里一行错误日志都没有。
  这类 bug 只有靠"造一个 v6 库、升级、逐字段比对"才能抓到，所以 TESTS_FIRST
  的第一条是本 ACT 的生死线。

