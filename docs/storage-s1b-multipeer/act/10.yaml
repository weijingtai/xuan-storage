ACT_VERSION: 1
TASK_ID: mimo-storage-s1b-multipeer/10
TITLE: 收口 —— barrel 导出 + 架构守卫测试 + run_s1b_analyze_gate.sh 三段式冻结门禁
TYPE: governance
ORDER: 12
DEPENDS_ON: [mimo-storage-s1b-multipeer/09]
DISPATCH_STATUS: ready
STRONG_MODEL_ONLY: false

OBJECTIVE: >
  收口三件事：把 S1b 的新能力挂进包的公开面、建立 A1 的可执行门禁、
  用测试守住本任务确立的不变式，防止后续改动把它们悄悄退化掉。

SCOPE:
  READ:
    - scripts/run_s1a_analyze_gate.sh
      # 【三段式冻结门禁的范本，照抄骨架】：
      #   BASELINE_TOTAL:24 / BASELINE_FILES:27 / S1A_FILES:40
      #   检查1 :61-85  scoped analyze 必须零 issue
      #   检查2 :105-119 有 issue 的文件 ⊆ 冻结白名单
      #   检查3 :121-129 全包总数不超基线
      #   注意 :127 的分支：总数【低于】基线时提示同步下调，不是报错
    - core/lib/persistence_core.dart          # 既有 barrel，【末尾追加不重排】
    - tasks/mimo-storage-s1b-multipeer.md     # A1–A12 全文
    - tasks/mimo-storage-s1a-contracts.md     # A10 门禁返工记录：member 正则去白名单的教训
    - core/test/s1a_dartdoc_coverage_test.dart
      # S1a 的 dartdoc 门禁成品。它经过两轮返工才做对，【照抄它的通用式正则与覆盖下限】，
      # 不要重新发明 —— 重新发明的第一版一定会漏掉某些声明形态
  WRITE:
    - scripts/run_s1b_analyze_gate.sh
    - core/test/s1b_architecture_guard_test.dart
  MODIFY:
    - core/lib/persistence_core.dart          # 仅在 export 列表【末尾追加】
    - tasks/mimo-storage-s1b-multipeer.md     # 当前状态区 + 决定记录（不改验收标准区）

TASK_DETAIL:
  barrel: >
    在 core/lib/persistence_core.dart 的 export 列表【末尾追加】以下 3 行，不重排既有行：
      export 'model/sync_peer.dart';
      export 'model/conflict_arbiter.dart';
      export 'routing/peer_fanout_pusher.dart';
    （config_layer 之类不存在 —— 本任务只新增了这三个文件，
      其余改动都在既有文件里，它们已经在 barrel 中。）

  analyze_gate_baselines: >
    三段式门禁要覆盖【三个包】，这是它与 S1a 版本的最大区别（S1a 只有 core）。
    2026-08-02 实测基线（挂账值，写死在脚本里）：

      core     退出码 3   总数 58   34 ERROR / 9 WARNING / 15 INFO   9 个文件
      drift    退出码 2   总数 162  0 ERROR / 70 WARNING / 92 INFO   71 个文件
      firebase 退出码 3   总数 38   2 ERROR / 17 WARNING / 19 INFO

    ⚠ firebase 那 2 个 ERROR 【应当已被 ACT 01b 清零】。
    脚本里 firebase 的 ERROR 基线写 **0**，不是 2 ——
    ACT 01b 的 DONE_WHEN 已要求清零，这里不给它留退路。
    若执行到本 ACT 时 firebase 仍有 ERROR，说明 01b 没做完，【停下上报】。

    core 那 34 个 ERROR 是 main 分支既有断点（four_zhu_card_templates 孤儿模块
    import 了 drift，而 core 没有 drift 依赖），与 S1a 冻结基线逐条一致，继续挂账。

    S1B_FILES（检查1 的 scoped analyze 对象）列本任务新增/重写的文件：
      core/lib/model/sync_peer.dart
      core/lib/model/conflict_arbiter.dart
      core/lib/routing/peer_fanout_pusher.dart
      core/lib/model/ports.dart
      core/lib/sync/sync_runtime.dart
      core/lib/core/sync_coordinator.dart
      core/lib/routing/remote_gateway_router.dart
      drift/lib/persistence_drift.dart
      drift/lib/sync/record_local_applier.dart
      firebase/lib/persistence_firebase.dart
      firebase/lib/firebase_realtime_remote_gateway.dart
      + 本任务新增的全部 test 文件
    这些文件的 `dart analyze --fatal-infos` 必须【零 issue】。

  gate_must_be_provable: >
    S1a 的门禁脚本是靠【三条注入负测试】证明有效的，本 ACT 照做：
      注入1 往 S1B_FILES 里的某个文件加一个 unused import → 检查1 必须红
      注入2 往【非白名单】文件（例如 core/lib/model/types.dart 的某个未被本任务
             触及的位置）加 unused import → 检查2 必须红
      注入3 往【白名单内】文件（例如 core/lib/model/calculation_strategy_config_data_model.dart）
             加 unused import → 检查3 必须红（总数超基线）
    三条都要实做并把结果写进纪要，只写脚本不验证等于没做。

  bash_compatibility: >
    macOS 的 /bin/bash 是 **3.2.57**：
      · 没有 `declare -A`（关联数组）
      · 没有 `mapfile` / `readarray`
    S1a 的脚本用多行字符串 + for 循环绕开了这两个，照抄那个写法。

  grep_c_semantics: >
    `grep -c` 在无匹配时【打印 "0" 并且退出码为 1】。
    因此凡是用 grep -c 做断言的地方，EXPECT_STDOUT 与 EXPECT_EXIT 【两个都要写】，
    只写一个会漏判。S1a 的脚本里有现成写法。

  dartdoc_guard: >
    照抄 core/test/s1a_dartdoc_coverage_test.dart 的通用式正则与覆盖下限机制，
    扫描本任务新增的三个源文件 + 改动过的公开声明。
    【必须有写死的覆盖数下限】—— 没有下限，正则被改窄后门禁会静默失效。
    下限取实测值往下留少量余量，并在注释里写明实测值与日期。
    S1a 的 A10 为此返工了两轮，教训是：不要手工枚举声明形态白名单，用通用式。

CONSTRAINTS:
  - 【不要】重排或删除 core/lib/persistence_core.dart 里的既有 export 行。
  - 【不要】给 firebase 的 ERROR 留基线余量。见 analyze_gate_baselines。
  - 【不要】用 `declare -A` 或 `mapfile`。见 bash_compatibility。
  - 【不要】只写 EXPECT_STDOUT 不写 EXPECT_EXIT。见 grep_c_semantics。
  - 【不要】重新发明 dartdoc 门禁的正则。见 dartdoc_guard。
  - 【不要】修改任务纪要的「验收标准」区（A1–A12）。转译者与执行者都无权改它。
  - 架构守卫测试必须是【可以变红】的。写完按 SELF_CHECK 反向验证。

TESTS_FIRST:
  CASES:
    - NAME: barrel_exports_all_new_public_api
      FILE: core/test/s1b_architecture_guard_test.dart
      BEHAVIOR: >
        文件顶部【只】`import 'package:persistence_core/persistence_core.dart';`
        （不逐个 import model/ 下的文件）。为每个新增文件各引用至少一个该文件独有的公开类型：
          sync_peer.dart          -> SyncPeer / PeerCapabilities / PeerId / PeerFanoutPusher
          conflict_arbiter.dart   -> LamportStamp / ArbitrationDecision / ConflictArbiter
          peer_fanout_pusher.dart -> DefaultPeerFanoutPusher
        编译通过即证明 barrel 完整；遗漏任一条则该类型未定义，编译失败。
      RED_COMMAND: cd core && flutter test test/s1b_architecture_guard_test.dart
      RED_EXPECT: 编译失败（barrel 未导出），退出码非 0
      COVERS: [A12]

    - NAME: six_blockers_are_all_removed
      FILE: core/test/s1b_architecture_guard_test.dart
      BEHAVIOR: >
        §5.2.1 六个阻断点的收口守卫，逐条以纯文本断言：
          ① t_outbox_peer_ack 表存在      -> drift/lib/persistence_drift.dart 含 't_outbox_peer_ack'
          ② t_sync_state 主键含 peerId    -> 含 '{scopeUid, peerId, entityType}'
          ③ markSuccess 带 peerId         -> core/lib/model/ports.dart 含 'required PeerId peerId'
          ④ 存在 pushToAll                -> core/lib/model/sync_peer.dart 含 'pushToAll'
          ⑤ 存在 fan-out 实现             -> peer_fanout_pusher.dart 存在且含 'Future.wait'
          ⑥ PeerCapabilities 取代 RegionCapabilities
                                          -> sync_peer.dart 含 'PeerCapabilities'，
                                             且 ports.dart 不再含 'RemoteGateway'
        六条各一个断言，失败时打印是哪一条。
        这是整个 S1b 的"完工清单"，任何一条被后续改动退化都会在这里红。
      RED_COMMAND: cd core && flutter test test/s1b_architecture_guard_test.dart
      RED_EXPECT: 断言失败（部分阻断点未拆除），退出码非 0
      COVERS: [A12]

    - NAME: fail_closed_semantics_preserved
      FILE: core/test/s1b_architecture_guard_test.dart
      BEHAVIOR: >
        以纯文本读取 core/test/policy_channel_filter_test.dart，断言其中【逐字】包含
        `if (p == null) return false;`。
        这是 S1a 留下的可执行规格，ACT 09 的实现照抄了它。
        规格文件本身被改宽（例如改成 return true）会让 ACT 09 的实现失去参照，
        而这种改动在 review 里极易被当成"修个笔误"放过。
      RED_COMMAND: cd core && flutter test test/s1b_architecture_guard_test.dart
      RED_EXPECT: 断言失败，先红
      COVERS: [A7]

    - NAME: no_wall_clock_in_conflict_path
      FILE: core/test/s1b_architecture_guard_test.dart
      BEHAVIOR: >
        包级守卫（与 ACT 07 的同名单元测试重复是【故意】的 —— 删一个另一个还在）。
        断言 core/lib/model/conflict_arbiter.dart 【不含】
        `DateTime` / `.now()` / `updatedAt`。
        "顺手加个时间戳兜底比较"是定序代码最常见的退化路径，
        加了之后所有功能测试仍会绿。
      RED_COMMAND: cd core && flutter test test/s1b_architecture_guard_test.dart
      RED_EXPECT: 断言失败，先红
      COVERS: [A8]

    - NAME: chinese_dartdoc_on_new_public_declarations
      FILE: core/test/s1b_architecture_guard_test.dart
      BEHAVIOR: >
        照抄 core/test/s1a_dartdoc_coverage_test.dart 的通用式正则（顶层 + 类内成员），
        扫描 sync_peer.dart / conflict_arbiter.dart / peer_fanout_pusher.dart，
        对每个公开声明断言紧邻上方存在 `///` 注释块且含 CJK 字符（正则 [一-鿿]）。
        失败时打印 文件:行号 与该行内容。
        【必须同时断言覆盖到的声明总数 >= 一个写死的下限】。
        S1a 的 A10 为这条返工两轮，教训是：不要手工枚举声明形态白名单。
      RED_COMMAND: cd core && flutter test test/s1b_architecture_guard_test.dart
      RED_EXPECT: 断言失败，退出码非 0
      COVERS: [A12]

    - NAME: barrel_existing_lines_intact
      FILE: core/test/s1b_architecture_guard_test.dart
      BEHAVIOR: >
        以纯文本读取 core/lib/persistence_core.dart，断言 S1a 交付的那批 export
        （model/storage_classification.dart / storage_policy.dart /
        storage_policy_registry.dart / transport.dart / export_bundle.dart 等）
        【逐行仍在】，且新增的 3 行各恰好出现一次。
        重排 barrel 不会让任何测试变红，但会让 git blame 失去意义、
        也容易在合并时把某一行吃掉。
      RED_COMMAND: cd core && flutter test test/s1b_architecture_guard_test.dart
      RED_EXPECT: 断言失败，先红
      COVERS: [A12]

VERIFICATION:
  - CMD: bash scripts/run_s1b_analyze_gate.sh
    EXPECT_EXIT: 0
  - CMD: cd core && flutter test
    EXPECT_EXIT: 0
  - CMD: cd drift && flutter test
    EXPECT_EXIT: 0
  - CMD: cd firebase && flutter test
    EXPECT_EXIT: 0
  # firebase 的 ERROR 必须为 0（ACT 01b 的成果不得回退）
  - CMD: 'cd firebase && dart analyze --format=machine 2>/dev/null | grep -c "^ERROR"'
    EXPECT_STDOUT: "0"
  # barrel 三行各恰好一次
  - CMD: 'for f in "model/sync_peer.dart" "model/conflict_arbiter.dart" "routing/peer_fanout_pusher.dart"; do n=$(grep -c "^export ''$f'';" core/lib/persistence_core.dart); [ "$n" = "1" ] || { echo "BAD:$f=$n"; exit 1; }; done; echo BARREL_OK'
    EXPECT_STDOUT: "BARREL_OK"
    EXPECT_EXIT: 0
  # S1a 的 barrel 行未被删
  - CMD: 'for f in "model/storage_classification.dart" "model/storage_policy.dart" "model/storage_policy_registry.dart" "model/transport.dart"; do grep -q "^export ''$f'';" core/lib/persistence_core.dart || { echo "LOST:$f"; exit 1; }; done; echo S1A_BARREL_INTACT'
    EXPECT_STDOUT: "S1A_BARREL_INTACT"
    EXPECT_EXIT: 0
  # 门禁脚本 bash 3.2 兼容
  - CMD: 'grep -nE "declare -A|mapfile|readarray" scripts/run_s1b_analyze_gate.sh'
    EXPECT_EXIT: 1
  # S1a 的规格文件与门禁脚本未被改动
  - CMD: git diff --exit-code main.. -- core/test/policy_channel_filter_test.dart scripts/run_s1a_analyze_gate.sh
    EXPECT_EXIT: 0
  # 验收标准区未被篡改
  - CMD: 'git diff main.. -- tasks/mimo-storage-s1b-multipeer.md | grep -E "^[-+].*- \[ \] A(1[0-2]|[1-9]) " | grep "^-"'
    EXPECT_EXIT: 1

SELF_CHECK:
  - 【门禁脚本三条注入负测试，必须实做】：
    · 往 S1B_FILES 里某文件加 unused import → 检查1 变红 → 撤销
    · 往非白名单文件加 unused import        → 检查2 变红 → 撤销
    · 往白名单内文件加 unused import        → 检查3 变红（总数超基线）→ 撤销
    三条结果写进纪要「当前状态」。只写脚本不验证等于没做
  - 临时删掉 barrel 里任意一行新增 export → `barrel_exports_all_new_public_api` 必须变红 → 改回
  - 临时把某个新增公开声明的中文注释删掉 → dartdoc 门禁必须变红并报出该行 → 改回
  - 临时把 dartdoc 门禁的下限调到 999 → 必须变红（证明下限自检有效）→ 改回
  - 临时把 `if (p == null) return false;` 改成 return true →
    `fail_closed_semantics_preserved` 必须变红 → 改回
  - 全部自检后 `git status --porcelain` 必须为空

DONE_WHEN:
  - scripts/run_s1b_analyze_gate.sh 存在、bash 3.2 兼容、退出码 0
  - 三条注入负测试已实做并确认能让对应检查变红，结果写进纪要
  - barrel 追加 3 行，S1a 的既有行未被重排或删除
  - 六个测试用例全部存在且通过
  - core / drift / firebase 三个包全部测试绿，firebase ERROR 为 0
  - 纪要「当前状态」与「决定记录」已更新（含 06b 的 Firestore rev 留 null 决定、
    ACT 03 回填值改 'firestore'、ACT 08 若降级 RWW 的记录）
  - 验收标准区 A1–A12 逐字未动
