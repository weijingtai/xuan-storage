SIGNATURE:
  conflict_arbiter.dart: |
    /// 版本坐标：(hlc, deviceId)。
    ///
    /// 【为什么需要 deviceId】：`HybridLogicalClock` 只有 (l, c)，没有 nodeId。
    /// 两台设备在同一物理毫秒各写一次且互不知情时 `isConcurrentWith == true`、
    /// `compareTo == 0` —— HLC 给的是【因果序（偏序）】，不是全序。
    /// deviceId 作为决胜位把它补成全序，保证任意两台设备对同一对版本
    /// 得出【同一个】结论。
    ///
    /// 比较规则：先比 hlc；hlc 相等（并发）时比 deviceId 字典序，大者胜。
    final class VersionStamp implements Comparable<VersionStamp> {
      /// HLC 戳。打包形式见 ACT 12 的线上格式规格。
      final HybridLogicalClock hlc;

      /// 写入该版本的设备标识。取自 [DeviceIdentity.deviceId]。
      final String deviceId;

      /// 构造一个 [VersionStamp]。
      const VersionStamp({required this.hlc, required this.deviceId});

      /// 从线上打包值还原。[packed] 为 `(l << 16) | c`。
      factory VersionStamp.fromPacked(int packed, String deviceId);

      /// 打包成线上格式 int64。
      int toPacked();

      @override
      int compareTo(VersionStamp other);
    }

    /// 一次冲突的裁决。
    enum ArbitrationDecision {
      /// 远端版本胜出，应覆盖本地。被覆盖的【本地】版本要留档。
      takeRemote,

      /// 本地版本胜出，远端变更应被丢弃。被丢弃的【远端】版本【同样】要留档。
      keepLocal,

      /// 两者坐标完全相同 —— 同一版本，无冲突，无需写入。
      identical,
    }

    /// 冲突仲裁器。决定"远端来的这条变更该不该覆盖本地"。
    ///
    /// 【纯函数，无 IO、无状态】。持久化由调用方（ACT 11 的 applier）负责 ——
    /// 混进来会让它没法被单元测试穷举，而定序正是最需要穷举的那类代码。
    abstract interface class ConflictArbiter {
      /// 比较远端与本地版本，给出裁决。
      ///
      /// [remote] 可空：历史 oplog 条目没有戳。降级规则见 TASK_DETAIL。
      /// [local] 可空：t_entity_stamp 里还没有该实体的戳（首次收到）。
      ArbitrationDecision arbitrate({
        required VersionStamp? remote,
        required VersionStamp? local,
      });
    }

    /// 默认实现：严格按 (hlc, deviceId) 全序比较。
    final class HlcConflictArbiter implements ConflictArbiter {
      /// 构造一个 [HlcConflictArbiter]。
      const HlcConflictArbiter();
    }

  types.dart ChangeApplyOutcome 增加: |
    /// 本次冲突中【被丢弃的那一方】的 payload（§5.3 冲突可见化）。
    ///
    /// · decision 为 applied 且发生覆盖 → 这里是【被覆盖的本地版本】
    /// · decision 为 skipped 且原因是仲裁判 keepLocal → 这里是【被丢弃的远端版本】
    ///
    /// 两个方向都要留档。只留前者是不够的：远端 loser 被丢弃后游标照常推进
    /// （skipped 不阻止推进，见 ACT 11），那条远端变更【再也不会被拉到】。
    /// 会话式同步可能两周才跑一次，用户丢的是"这两周里对方改的东西"。
    final String? discardedPayloadJson;

    /// 被丢弃那一方的版本坐标，用于向用户展示"你丢的是哪个版本、来自哪台设备"。
    final VersionStamp? discardedStamp;

    /// 被丢弃的是哪一侧。null 表示本次没有冲突。
    final ConflictSide? discardedSide;

    /// 冲突中被丢弃的一侧。
    enum ConflictSide { local, remote }

TASK_DETAIL:
  total_order_requirement: >
    compareTo 必须是【全序】：
    · 反对称  a.compareTo(b) == -b.compareTo(a)
    · 传递性  a<b 且 b<c ⇒ a<c
    · 自反    a.compareTo(a) == 0
    · **0 当且仅当 hlc 相等【且】 deviceId 相等**

    最后一条是关键：hlc 相等但 deviceId 不同【不得】返回 0。
    返回 0 会让两台设备的并发编辑被判为 identical，于是谁都不覆盖谁，
    两边永久分叉 —— 而且不报错。

  null_degradation: >
    两个参数都可空，四种组合各有明确语义，【各须一条测试】：

      remote=null, local=null   → identical（都没戳，无从比较，不写入）
      remote=null, local≠null   → **keepLocal**（远端是无戳的历史条目，不覆盖有戳的本地）
      remote≠null, local=null   → **takeRemote**（本地首次收到该实体，直接采用）
      remote≠null, local≠null   → 正常比较

    第二条的方向是 fail-safe：丢远端的一次更新，用户下次同步还能拿到；
    丢本地的编辑不可恢复。
    【不要】写成"拿不准就 takeRemote" —— 那正是 §5.2.3 判定为缺陷的 RWW 行为，
    等于本 ACT 白做。

  discarded_is_bidirectional: >
    §5.3 要求"冲突时保留被覆盖的版本并使其对用户可见可回溯"。
    【两个方向都要】：
      takeRemote → 留【本地】被覆盖的 payload
      keepLocal  → 留【远端】被丢弃的 payload
    只留前者是常见的漏：keepLocal 时游标照常推进（skipped 不阻止推进），
    那条远端变更再也不会被拉到，用户永远不知道对方改过什么。

  arbiter_is_pure: >
    ConflictArbiter 【无 IO、无状态、不碰数据库】。它只回答"谁赢"。
    "被丢弃的 payload 存到哪"是 ACT 11 的事。

  no_applier_changes: >
    【本 ACT 不改 drift/lib/sync/record_local_applier.dart】。
    修 canAdvanceCursor 恒真、把仲裁器接进 applier，都是 ACT 11。

CONSTRAINTS:
  - 【不要】用墙上时钟（DateTime）参与定序。ACT 06 已交付 HLC，用它。
  - 【不要】在 hlc 相等时返回 0 而不比 deviceId。见 total_order_requirement。
  - 【不要】把 null 降级写成"拿不准就 takeRemote"。见 null_degradation。
  - 【不要】只留 takeRemote 方向的被覆盖 payload。见 discarded_is_bidirectional。
  - 【不要】新建 DeviceIdentity 的替代品。ports.dart:240 已有。
  - 【不要】给 ChangeApplyOutcome 的新字段加 required（既有构造点会全挂）。
  - 【不要】让 ConflictArbiter 有 IO 或可变状态。
  - 【不要】改 record_local_applier.dart。那是 ACT 11。
  - 每个公开声明必须有中文 dartdoc（A12）。

TESTS_FIRST:
  CASES:
    - NAME: later_hlc_wins_regardless_of_device
      FILE: core/test/s1b_conflict_arbiter_test.dart
      BEHAVIOR: >
        remote 的 hlc 严格大于 local，且 remote.deviceId 字典序【更小】
        （'aaa' vs 'zzz'）→ takeRemote。
        反过来 local 的 hlc 更大而 deviceId 更小 → keepLocal。
        证明 hlc 是第一顺位，deviceId 只在并发时说话 ——
        写成"先比 deviceId"这条会红。
      RED_COMMAND: cd core && flutter test test/s1b_conflict_arbiter_test.dart
      RED_EXPECT: 编译失败（VersionStamp 不存在），退出码非 0
      COVERS: [A8]

    - NAME: concurrent_tie_broken_by_device_id_deterministically
      FILE: core/test/s1b_conflict_arbiter_test.dart
      BEHAVIOR: >
        【本 ACT 最重要的一条】。两个 VersionStamp 的 hlc【完全相等】
        （用 ACT 06 的 `hlc_alone_is_not_a_total_order` 造出的那种并发戳），
        deviceId 分别 'device-a' / 'device-b'。
        - remote='device-b', local='device-a' → takeRemote
        - 【互换角色】remote='device-a', local='device-b' → keepLocal
        断言两次的【胜者是同一台设备】—— 这就是"全序且确定"的可执行定义。
        hlc 相等时直接返回 identical 的实现这条会红，
        而那种写法让两台设备永久分叉且不报错。
      RED_COMMAND: cd core && flutter test test/s1b_conflict_arbiter_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A8]

    - NAME: identical_iff_both_hlc_and_device_equal
      FILE: core/test/s1b_conflict_arbiter_test.dart
      BEHAVIOR: >
        - hlc 相等 + deviceId 相等 → identical
        - hlc 相等 + deviceId 不同 → 【不是】identical
        - hlc 不同 + deviceId 相等 → 【不是】identical
        identical 语义是"同一个版本，无需写入"，判宽了会漏掉真实冲突。
      RED_COMMAND: cd core && flutter test test/s1b_conflict_arbiter_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A8]

    - NAME: comparison_is_a_total_order_exhaustive
      FILE: core/test/s1b_conflict_arbiter_test.dart
      BEHAVIOR: >
        构造至少 8 个 VersionStamp（跨 hlc 与 deviceId 的组合，
        含若干 hlc 相等 deviceId 不同的并发对），对所有两两与三三组合断言：
        - 反对称 `a.compareTo(b) == -b.compareTo(a)`
        - 传递性 a<b 且 b<c ⇒ a<c（三重循环穷举）
        - 自反   `a.compareTo(a) == 0`
        - **0 当且仅当 hlc 与 deviceId 都相等**（这一条是 Codex R1 指出的
          "只验性质抓不到 `rev - other.rev` 式实现"的补丁）
        最后一条要显式遍历所有配对逐个断言，不能只靠前三条推。
      RED_COMMAND: cd core && flutter test test/s1b_conflict_arbiter_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A8]

    - NAME: null_degradation_four_combinations
      FILE: core/test/s1b_conflict_arbiter_test.dart
      BEHAVIOR: >
        非 happy-path，四种 null 组合逐个断言（见 TASK_DETAIL.null_degradation）：
          (null, null)  → identical
          (null, 有)    → keepLocal    ← fail-safe 方向
          (有, null)    → takeRemote
          (有, 有)      → 正常比较
        全程【不抛异常】。
        写成"拿不准就 takeRemote"时第二条会红 —— 那会让所有无戳的历史
        oplog 条目无条件覆盖本地，等于退回 RWW。
      RED_COMMAND: cd core && flutter test test/s1b_conflict_arbiter_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A8]

    - NAME: outcome_carries_discarded_side_both_directions
      FILE: core/test/s1b_conflict_arbiter_test.dart
      BEHAVIOR: >
        构造两个 ChangeApplyOutcome：
        ① takeRemote 场景 → discardedSide == ConflictSide.local，
           discardedPayloadJson 是【本地旧 payload】，discardedStamp 是本地戳
        ② keepLocal 场景  → discardedSide == ConflictSide.remote，
           discardedPayloadJson 是【远端 payload】，discardedStamp 是远端戳
        再构造一个【不传】这三个字段的 outcome，断言能编译且三者为 null
        （既有构造点未破坏）。
        只实现方向①的话②会红 —— 而②正是"用户永远不知道对方改过什么"的成因。
      RED_COMMAND: cd core && flutter test test/s1b_conflict_arbiter_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A9]

    - NAME: arbiter_has_no_wall_clock_and_no_io
      FILE: core/test/s1b_conflict_arbiter_test.dart
      BEHAVIOR: >
        以纯文本读取 core/lib/model/conflict_arbiter.dart，断言【不含】
        `DateTime` / `.now()` / `updatedAt` / `serverTime` / `Future<` / `async`。
        文本级守卫，故意不依赖类型系统 ——
        "顺手加个时间戳兜底比较"是这类代码最常见的退化路径，
        加了之后所有功能测试仍会绿。
      RED_COMMAND: cd core && flutter test test/s1b_conflict_arbiter_test.dart
      RED_EXPECT: 断言失败或文件不存在，先红
      COVERS: [A8]

    - NAME: packed_round_trips_losslessly
      FILE: core/test/s1b_conflict_arbiter_test.dart
      BEHAVIOR: >
        对一组 VersionStamp（含 l 接近 48 位上限、c 接近 16 位上限的边界值）
        做 `toPacked()` → `fromPacked()` 往返，断言 hlc 逐字段相等。
        再断言两个不同 stamp 的 packed 值【不相等】。
        这条是 A14 线上格式的第一道防线：打包丢位会让远端戳被读成另一个值，
        而那不会报错，只会让定序悄悄错乱。
      RED_COMMAND: cd core && flutter test test/s1b_conflict_arbiter_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A14]

