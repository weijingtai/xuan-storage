TASK_DETAIL:
  applier_constructor_signature: >
    【本 ACT 的接线契约，执行者照抄，不要自创注入方式】（Codex R3 · P0-1：
    v3 要求 applier "读本地实体、读本地戳、走同事务写"，却没说通过什么接口读、
    怎么注入、既有构造点怎么迁移 —— 便宜执行者无法机械实现）。

    现状（record_local_applier.dart:6-13）是【回调注入式】：两个函数字段
    `applyRecord` / `deleteRecord`，由 DriftRecordDataSource 的方法引用填充。
    **新依赖沿用同一风格**，不要改成传仓库对象或传 Database ——
    那会把 8 个构造点全部推倒重写，且让 applier 依赖 drift 具体类型。

    改造后的构造签名（四个新增参数全部 required）：

      class RecordLocalApplier implements LocalApplier {
        final Future<void> Function(RecordMeta meta, List<SearchTag> tags) applyRecord;
        final Future<bool> Function(String uuid) deleteRecord;

        /// 读本地实体是否存在。用于区分 local stamp == null 的两种现实
        /// （本地无实体 / 本地有实体但边表无戳）。返回 null 表示无实体。
        final Future<RecordMeta?> Function(String uuid) readLocalRecord;

        /// 读本地 HLC 戳。直接转发 ACT 08 的
        /// PersistenceDriftDatabase.getEntityStamp。边表无该行时返回 null。
        /// scopeUid 由 applyRemoteChanges 的【本次调用参数】传入，
        /// 【不在构造时捕获】—— 见下方 scope_is_per_call。
        final Future<EntityStampRow?> Function({
          required String scopeUid,
          required String entityId,
        }) readLocalStamp;

        /// 同事务写入。直接转发 ACT 08 的
        /// PersistenceDriftDatabase.applyWithStamp（A13 的生产落地点）。
        /// applier【不得】自己 transaction(...) 里分别写记录和戳。
        final Future<void> Function({
          required String scopeUid,
          required String entityType,
          required String entityId,
          required int hlcPacked,
          required String deviceId,
          required Future<void> Function() write,
        }) applyWithStamp;

        /// 冲突仲裁器。**字段类型是抽象接口** `ConflictArbiter`
        /// （ACT 09 的 conflict_arbiter.dart:112），纯函数、无 IO。
        /// 声明成抽象接口是为了让测试能注入 fake（见 TESTS_FIRST 里
        /// "注入恒返回 keepLocal 的 fake" 那条）；
        /// 生产与大部分测试构造点【实例化具体类】
        /// `const HlcConflictArbiter()`（09.yaml:124，有 const 构造）。
        /// ⚠ 【不要写 `const ConflictArbiter()`】—— 那是抽象接口，不能实例化，
        /// 照抄会直接编译不过（Codex R4 · P0-2 抓到 v3.1 的这个错）。
        final ConflictArbiter arbiter;

        RecordLocalApplier({
          required this.applyRecord,
          required this.deleteRecord,
          required this.readLocalRecord,
          required this.readLocalStamp,
          required this.applyWithStamp,
          required this.arbiter,
        });

  scope_is_per_call: >
    ⚠⚠ 【scopeUid 是"每次调用"的量，不是"每个实例"的量 —— 这一条决定回调签名】
    （Codex R4 · P0-2：v3.1 一边说"不进构造参数以便跨 scope 复用"，
    一边让样板闭包在构造点捕获固定的 scope，两句话互相取消。
    照后者写出来的实例**根本不能跨 scope 工作**，而前者是承诺）。

    定下来的一致契约：**需要访问数据库的两个回调显式接收 `scopeUid`**，
    由 `applyRemoteChanges({required scopeUid, ...})` 把【本次调用】的值传进去。
      · `readLocalStamp({required scopeUid, required entityId})`
      · `applyWithStamp({required scopeUid, required entityType, ...})`
    这样同一个 applier 实例真的能跨 scope 复用，承诺与实现一致。

    `readLocalRecord(uuid)` **不需要** scopeUid ——
    `DriftRecordDataSource.getRecord(uuid)` 本身是按 scope 构造的实例方法，
    uuid 在 scope 内已唯一。这不是疏漏，是这两类依赖的性质不同：
    前两个直接打库（scope 是查询条件），后一个走已绑定 scope 的数据源。

    【不许】改回"构造时捕获 scope"。若执行者觉得传参啰嗦而想走回头路，
    那就等于把"跨 scope 复用"这句承诺删掉 —— 二者只能选一套，本 ACT 选的是传参。

  existing_construction_sites: >
    既有构造点【共 8 处，全部在测试代码里，生产 lib/ 下一处都没有】（已实测）：
      · drift/test/sync/record_local_applier_test.dart:76, 104, 149, 175
      · drift/test/sync/record_sync_e2e_test.dart:111, 172, 231
      · drift/lib/sync/record_local_applier.dart:10（定义处，不是调用）
    所以本 ACT 的迁移面【只在 drift/test 内】，不牵动任何业务仓库 ——
    这也是选回调注入而非仓库注入的另一个理由。

    **`drift_record_data_source.dart` 一个字都不用改**（Codex R4 · P0-2）：
    按 uuid 读单条的方法【已经存在】，就是
    `drift/lib/record/drift_record_data_source.dart:89` 的
    `Future<RecordMeta?> getRecord(String uuid)`，签名与 readLocalRecord 完全吻合。
    v3.1 曾写"若没有 findRecordByUuid 就地加一个"—— 那个名字是凭空造的，
    照着做会重复造一个已存在的接口。**直接用 getRecord，不要新增方法。**

    每个构造点按下面这个样板补四个参数（以 record_local_applier_test.dart:76 为例）：

      final applier = RecordLocalApplier(
        applyRecord: ds.applyRemoteRecord,
        deleteRecord: ds.softDeleteRecord,
        readLocalRecord: (uuid) => ds.getRecord(uuid),
        readLocalStamp: ({required scopeUid, required entityId}) =>
            db.getEntityStamp(
          scopeUid: scopeUid, entityType: 'record_meta', entityId: entityId,
        ),
        applyWithStamp: ({
          required scopeUid, required entityType, required entityId,
          required hlcPacked, required deviceId, required write,
        }) => db.applyWithStamp(
          scopeUid: scopeUid, entityType: entityType, entityId: entityId,
          hlcPacked: hlcPacked, deviceId: deviceId, write: write,
        ),
        arbiter: const HlcConflictArbiter(),
      );

    【不要】在测试里裸查表绕过 `getRecord` —— 那样生产接线仍然是空的，
    A13 与本条 P0-1 的修正就都落不了地。
    【不要】新增任何读单条方法 —— `getRecord` 已经存在且签名吻合。
    若样板里的某个回调在当前代码里无法直接引用，
    【停下核对】，不要凭记忆造方法名（Codex R4 · P0-2 就是抓这个）。

  cursor_rule: >
    正确规则：**只要 outcomes 里存在任何一条 `ChangeApplyDecision.failed`，
    canAdvanceCursor 就必须为 false，且 lastError 非 null。**

    理由：游标推进意味着"这一页我处理完了，下次从后面拉"。
    有一条没应用成功却推进游标，那条变更就再也不会被拉到 —— 永久丢失。
    宁可下次重拉整页（幂等，代价是一点流量），也不能丢。

    `skipped` 【不阻止】游标推进 —— skipped 是"有意不应用"（已应用过、更旧、
    被仲裁判为 keepLocal），不是失败。把 skipped 也算进去会让游标永远卡在
    第一个被仲裁拒绝的位置上，同步彻底停摆。这个区分是本 ACT 最容易写反的地方。

  observe_before_apply: >
    【本 ACT 最容易漏、且漏了不报错的一条】。每一条带 hlcPacked 的入站变更，
    在仲裁【之前】必须调 `clock.observe(remoteStamp.hlc)`。
    漏掉的后果：本地时钟不会被顶上去，下次本地写入的戳可能小于刚收到的远端戳，
    因果关系倒置，而所有功能测试仍会绿。
    ACT 08 的属性测试守的是时钟本身，本 ACT 这条守的是【调用点】。

  malformed_payload_is_failed_not_skipped: >
    JSON 解析失败、必需字段缺失、写库抛异常 —— 这三类【一律归 failed】，
    因此 canAdvanceCursor 为 false、lastError 非空。
    只有【终局性拒绝】才可以是 skipped：已应用过、identical、仲裁判 keepLocal。
    把畸形 payload 归 skipped 会让游标照常推进，那条变更永久丢失
    —— 正是 §5.2.3 要修的那个 bug 换了个入口（Codex R1 · P0-9）。

  keep_local_must_archive_remote: >
    仲裁判 keepLocal 时，outcome 必须填 discardedSide = remote +
    远端的 payload 与 stamp。
    理由（Codex R1 · P0-8）：skipped 不阻止游标推进，游标一推进，
    那条远端变更【再也不会被拉到】。"下次同步还能重新拿到"是错的。
    用户丢的是"这两周里对方改的东西"，且完全不知情。

  arbitration_wiring: >
    ⚠ 定序坐标是 **(hlc, deviceId)**，类型是 ACT 09 的 `VersionStamp`。
    【定序坐标里不存在 LamportStamp、不存在 rev】——
    转译 v1 用的 `(rev, deviceId)` / `LamportStamp` 已被 HLC 方案整体取代
    （人类 2026-08-02 裁定，见纪要决定记录；Codex R2 抓到 v2 此处仍有残留）。
    ⚠ 注意区分：`RecordMeta.rev` 作为【业务字段】的解析与保存
    【继续合法存在】（它是记录自身的业务版本号，不是定序坐标）——
    本 ACT 禁的是把 rev 当仲裁依据，不是禁这个字段名（Codex R4 · P2-1）。

    在应用每条 change 前先仲裁：
      1. 从 change 取 `(hlcPacked, deviceId)`（ACT 08 加的两个可空字段）
         构造 remote `VersionStamp`：
           · 两者【都非空】 → `VersionStamp.fromPacked(hlcPacked!, deviceId!)`
           · 任一为空       → remote 传 **null**（不是"补个默认值"）。
             按 ACT 09 的降级规则，remote=null 会得到 keepLocal —— fail-safe 方向。
             【不要】把 hlcPacked null 补成 0：0 是一个合法且最小的戳，
             补 0 等于宣称"这条远端变更来自纪元起点"，仍然参与比较，
             而"没有戳"和"戳很小"是两回事。
      2. 取本地当前版本的 `VersionStamp` —— 从 t_entity_stamp 边表读，
         见 local_stamp_comes_from_side_table 与
         distinguish_missing_entity_from_missing_stamp。
      3. 每条带 hlcPacked 的 change，在【仲裁之前】调 `clock.observe(...)`
         （见 observe_before_apply）。
      4. arbitrate 结果：
         takeRemote → 走 `applyWithStamp(...)` 应用；outcome 填
                      discardedSide = **local** + 被覆盖的本地 payload 与 stamp
         keepLocal  → 记 decision: skipped；outcome 填 discardedSide = **remote** +
                      被丢弃的远端 payload 与 stamp（见 keep_local_must_archive_remote）；
                      reason 用 SkipReasonCode:301 里最接近的值并在 message 写明，
                      【不要】往那个 enum 加值 —— 它是公开 API
         identical  → 记 skipped，不写库，discardedSide 为 null

  distinguish_missing_entity_from_missing_stamp: >
    ⚠ **边表查不到戳，有两种完全不同的现实**（Codex R2）：
      (a) 本地【根本没有这个实体】—— 首次收到。takeRemote 是对的，
          没有任何本地数据被覆盖，discardedSide 应为 **null**。
      (b) 本地【有这个实体，但它是 S1b 之前写入的，从没被打过戳】——
          takeRemote 会【覆盖一份真实存在的本地数据】。
          此时必须填 discardedSide = **local** + 被覆盖的本地 payload；
          discardedStamp 为 null（本来就没有戳），这是合法的。

    ACT 09 的 arbitrate 是纯函数，两种情况给它的 local 都是 null，它分不出来 ——
    **区分的责任在本 ACT**。做法：仲裁前先查本地实体是否存在
    （applier 本来就要读它才能拿到旧 payload），据此决定 discardedSide。

    不区分的后果：所有 S1b 之前的历史数据被远端覆盖时【一律不留档】，
    用户看不到自己丢了什么 —— 而历史数据恰恰是最多、最不该丢的那一批。

  local_stamp_comes_from_side_table: >
    本地 stamp 从 ACT 08 的 **t_entity_stamp 边表**读，键 (scopeUid, entityType, entityId)。
    【不要】去 RecordMeta 找 —— 它在另一个仓库且没有这个字段，
    正是转译 v1 在这里假设了不存在的数据源（Codex R1 · P0-7）。
    ⚠ 查不到边表记录【不等于】本地没有这个实体 —— 见 distinguish_missing_entity_from_missing_stamp。
    写入时走 ACT 08 交付的 `applyWithStamp(...)` 生产接口，戳与记录同事务落盘
    （A13 门禁守着）。【不要】自己 `db.transaction(() {...})` 里分别写两处。

  no_coordinator_changes: >
    【不改 sync_coordinator.dart】。:382 的守卫写得是对的，问题在于它永远不触发。
    本 ACT 让它真的能触发即可。改守卫会让"applier 报错了没"与
    "coordinator 拦住了没"两件事混在一起，出问题时无法归因。

CONSTRAINTS:
  - 【不要】让 skipped 阻止游标推进。见 cursor_rule 末段 —— 会让同步彻底停摆。
  - 【不要】改 sync_coordinator.dart。见 no_coordinator_changes。
  - 【不要】往 SkipReasonCode 或 RecordMeta 加字段。前者是公开 API，
    后者在另一个仓库（repository-interface-record）。需要就停下上报。
  - 【不要】在 catch 路径里吞掉异常后仍返回 canAdvanceCursor: true。那就是现在的 bug。
  - 【不要】把 lastError 填成一个笼统的 'some changes failed'。
    要带上【第一条失败的 operationId 与原始错误】，否则线上排查时
    只知道"有东西失败了"却不知道是哪条。
  - 每个改动的公开声明必须更新中文 dartdoc（A12）。

TESTS_FIRST:
  CASES:
    - NAME: failed_change_blocks_cursor_advance
      FILE: drift/test/sync/record_local_applier_conflict_test.dart
      BEHAVIOR: >
        【本 ACT 的生死线 —— 直接对应 §5.2.3「那条变更永久丢失」】。
        构造 3 条 change，让【中间那条】的 applyRecord 抛异常（注入的回调里抛）。
        断言返回的 LocalApplyResult：
        - `canAdvanceCursor` 为 【false】；
        - `lastError` 【非 null】，且其 message 里含【那条失败 change 的 operationId】；
        - `appliedCount` 为 2（另外两条确实应用了 —— 一条失败不该中断整批）；
        - outcomes 里恰好一条 decision 为 failed。
        当前实现这条会红（恒真 true / lastError 恒 null）。
      RED_COMMAND: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
      RED_EXPECT: 断言失败（canAdvanceCursor 恒为 true），退出码非 0
      COVERS: [A10]

    - NAME: skipped_change_does_not_block_cursor_advance
      FILE: drift/test/sync/record_local_applier_conflict_test.dart
      BEHAVIOR: >
        【与上一条方向相反，必须同时成立】。构造 3 条 change，
        让其中一条被仲裁判为 keepLocal（记 skipped），其余正常应用。
        断言 `canAdvanceCursor` 为 【true】。
        写成"有任何非 applied 就不推进"时这条会红 ——
        而那种写法会让游标永远卡在第一个被仲裁拒绝的位置，同步彻底停摆。
        这是本 ACT 最容易写反的地方，两条测试必须成对存在。
      RED_COMMAND: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
      RED_EXPECT: 断言失败，先红
      COVERS: [A10]

    - NAME: all_success_still_advances_cursor
      FILE: drift/test/sync/record_local_applier_conflict_test.dart
      BEHAVIOR: >
        回归守卫：全部应用成功时 canAdvanceCursor 为 true、lastError 为 null。
        修 bug 时把条件写反（变成"恒 false"）会让同步完全不前进，
        而那种错误在只测失败路径的情况下不会被发现。
      RED_COMMAND: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
      RED_EXPECT: 断言失败或编译失败，先红
      COVERS: [A10]

    - NAME: entity_type_mismatch_still_blocks_advance
      FILE: drift/test/sync/record_local_applier_conflict_test.dart
      BEHAVIOR: >
        回归守卫：传一个不匹配的 entityType，断言仍返回 canAdvanceCursor: false
        （applier.dart:19-27 的既有行为是对的，不能被本 ACT 改坏）。
        改 canAdvanceCursor 的计算方式时很容易把这个早退分支一并重写掉。
      RED_COMMAND: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
      RED_EXPECT: 断言失败或编译失败，先红
      COVERS: [A10]

    - NAME: malformed_payload_is_failed_and_blocks_cursor
      FILE: drift/test/sync/record_local_applier_conflict_test.dart
      BEHAVIOR: >
        非 happy-path 三连（对应 Codex R1 · P0-9）。三条 change 分别是：
        ① payloadJson 不是合法 JSON；② JSON 合法但缺 meta 字段；③ 写库回调抛异常。
        对每一条断言：`decision == failed`、`canAdvanceCursor == false`、
        `lastError` 非空且 message 含该条的 operationId。
        把畸形 payload 归 skipped 的实现这条会红 —— 而那种写法让游标照常推进，
        那条变更永久丢失，等于把 §5.2.3 的 bug 换了个入口重新引入。
      RED_COMMAND: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
      RED_EXPECT: 断言失败（当前恒真 true），退出码非 0
      COVERS: [A10]

    - NAME: keep_local_archives_the_discarded_remote
      FILE: drift/test/sync/record_local_applier_conflict_test.dart
      BEHAVIOR: >
        【对应 Codex R1 · P0-8】。注入恒返回 keepLocal 的 fake arbiter，
        远端 change 带一个可辨识的 payload。断言 outcome：
        - `decision == skipped`、`canAdvanceCursor == true`（skipped 不阻止推进）；
        - `discardedSide == ConflictSide.remote`；
        - `discardedPayloadJson` 【等于那条远端 payload】；
        - `discardedStamp` 非空且等于远端戳。
        只在 takeRemote 方向留档的实现这条会红。
        而它红的现实含义是：游标已推进，那条远端变更再也拉不到，
        用户永远不知道对方改过什么。
      RED_COMMAND: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A9]

    - NAME: observe_called_on_every_stamped_inbound_change
      FILE: drift/test/sync/record_local_applier_conflict_test.dart
      BEHAVIOR: >
        用计数式 fake HlcClock（记录 observe 的调用次数与参数，
        【不用 fail()】—— applier 里有 catch-all）。
        送 5 条带 hlcPacked 的 change + 2 条不带的，断言：
        - `observe` 被调用【恰好 5 次】；
        - 每次的参数等于对应 change 的戳；
        - **observe 的调用发生在 arbitrate 之前**（用调用序列记录断言顺序）。
        漏调 observe 时因果性静默消失，其余测试全绿 —— 只有这条会红。
      RED_COMMAND: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A8]

    - NAME: arbiter_keep_local_records_skipped_not_applied
      FILE: drift/test/sync/record_local_applier_conflict_test.dart
      BEHAVIOR: >
        注入一个恒返回 keepLocal 的 fake ConflictArbiter。断言：
        - 注入的 applyRecord 回调【一次都没被调用】（用计数式 fake 记录调用次数，
          【不用 fail()】—— applier 里有 catch-all 会吞掉 TestFailure）；
        - outcome 的 decision 为 skipped；
        - `appliedCount` 为 0。
        证明仲裁真的挡在写库之前，而不是"写完再说"。
      RED_COMMAND: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
      RED_EXPECT: 编译失败（applier 尚不接受 arbiter），退出码非 0
      COVERS: [A8]

    - NAME: take_remote_archives_the_overwritten_local
      FILE: drift/test/sync/record_local_applier_conflict_test.dart
      BEHAVIOR: >
        注入恒返回 takeRemote 的 fake arbiter，本地已有一个可辨识的旧 payload
        【且边表里有它的戳】。断言应用后的 ChangeApplyOutcome：
        - `discardedSide == ConflictSide.local`；
        - `discardedPayloadJson` 【等于那份旧 payload】（不是 null、不是新 payload）；
        - `discardedStamp` 非 null 且等于边表里那个本地戳。
        ⚠ 字段名是 ACT 09 定的 `discarded*`，【不是】 `overwritten*` ——
        v1 用的旧名已随双向留档改造一并取消（Codex R2 抓到 v2 此处仍是旧名）。
        §5.3 要求"冲突时保留被覆盖的版本并使其对用户可见可回溯"。
        字段存在但从不填值，是这类需求最常见的落地失败方式 ——
        看起来做了，实际上用户永远看不到自己丢了什么。
      RED_COMMAND: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A9]

    - NAME: stampless_existing_local_is_archived_but_absent_local_is_not
      FILE: drift/test/sync/record_local_applier_conflict_test.dart
      BEHAVIOR: >
        【对应 Codex R2：null 降级把"边表无戳"等同于"本地实体不存在"】。
        两个场景，边表里【都】查不到戳，但断言结果【必须不同】：
        ① 本地【没有】该实体 → 应用远端后 `discardedSide` 为 **null**、
           `discardedPayloadJson` 为 null（没有任何本地数据被覆盖）；
        ② 本地【有】该实体（S1b 之前写入的历史行，可辨识的旧 payload），
           边表无戳 → 应用远端后 `discardedSide == ConflictSide.local`、
           `discardedPayloadJson` 【等于那份历史 payload】、
           `discardedStamp` 为 null（本来就没戳，这是合法的）。
        把两者一视同仁的实现，②会红 —— 而②的现实含义是：
        所有 S1b 之前的历史数据被覆盖时一律不留档，
        而历史数据恰恰是最多、最不该丢的那一批。
      RED_COMMAND: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A9]

    - NAME: missing_hlc_on_remote_change_keeps_local
      FILE: drift/test/sync/record_local_applier_conflict_test.dart
      BEHAVIOR: >
        非 happy-path。送一条【不带 hlcPacked】的 change（历史 oplog 条目），
        本地边表【有】戳。用【真实的】 HlcConflictArbiter（不是 fake）。断言：
        - decision 为 skipped（remote=null → keepLocal，ACT 09 的 fail-safe 方向）；
        - `discardedSide == ConflictSide.remote`；
        - applyRecord 回调【一次都没被调用】。
        实现若把 hlcPacked null 补成 0 再构造 VersionStamp，这条会红 ——
        0 是一个合法且最小的戳，补 0 等于宣称"这条远端变更来自纪元起点"，
        仍然参与比较，而"没有戳"和"戳很小"是两回事。
      RED_COMMAND: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A8, A9]

VERIFICATION:
  - CMD: cd drift && dart analyze --fatal-infos lib/sync/record_local_applier.dart
    EXPECT_EXIT: 0
  - CMD: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
    EXPECT_EXIT: 0
  - CMD: cd drift && flutter test
    EXPECT_EXIT: 0
  - CMD: cd core && flutter test
    EXPECT_EXIT: 0
  # 恒真的字面量必须消失
  - CMD: 'grep -n "canAdvanceCursor: true," drift/lib/sync/record_local_applier.dart'
    EXPECT_EXIT: 1
  # lastError 不再恒 null
  - CMD: 'grep -c "lastError: null," drift/lib/sync/record_local_applier.dart'
    EXPECT_STDOUT: "1"
    EXPECT_EXIT: 0
  # 本 ACT 不改 coordinator
  - CMD: git diff --exit-code "$(cat .act-base)"..HEAD -- core/lib/core/sync_coordinator.dart
    EXPECT_EXIT: 0
  # 不得往公开 enum 加值
  # ⚠ 原写法末尾带 `|| true`，那让它【恒为 0】、永远不可能红（Codex R1 · P2-24）。
  #    改成：只要 diff 里出现新增的 SkipReasonCode 枚举值就失败。
  #    注意匹配的是【枚举值定义】而非引用 —— 引用它是允许的，加值才不允许。
  - CMD: 'git diff "$(cat .act-base)"..HEAD -- core/lib/model/types.dart | grep -nE "^\+\s+[a-z][A-Za-z0-9]*,\s*$" | grep -q . && echo NEW_ENUM_VALUE_ADDED'
    EXPECT_EXIT: 1
  # 残留旧名守卫：LamportStamp / overwritten* 一律不许再出现（rev 除外——它是业务字段）
  - CMD: 'grep -nE "LamportStamp|overwrittenPayloadJson|overwrittenStamp" drift/lib/sync/record_local_applier.dart drift/test/sync/record_local_applier_conflict_test.dart'
    EXPECT_EXIT: 1
  # rev 不得用作仲裁坐标（业务字段除外）：applier 里不许出现"rev 参与定序"的写法
  - CMD: 'grep -nE "rev.*compareTo|compareTo.*rev|rev.*hlc|hlc.*rev" drift/lib/sync/record_local_applier.dart'
    EXPECT_EXIT: 1
  # 必须用 ACT 09 的 VersionStamp
  - CMD: 'grep -q "VersionStamp" drift/lib/sync/record_local_applier.dart'
    EXPECT_EXIT: 0
  # 戳与记录必须走 ACT 08 的同事务接口，不许自己开事务分别写
  - CMD: 'grep -c "applyWithStamp(" drift/lib/sync/record_local_applier.dart'
    EXPECT_STDOUT: "1"
    EXPECT_EXIT: 0
  - CMD: 'grep -nE "\.transaction\(" drift/lib/sync/record_local_applier.dart'
    EXPECT_EXIT: 1
  # hlcPacked 为空时不得补默认值参与比较
  - CMD: 'grep -nE "hlcPacked \?\? 0|hlcPacked\?\?0" drift/lib/sync/record_local_applier.dart'
    EXPECT_EXIT: 1
  # 仲裁在写库之前（arbitrate 的调用行号必须小于 applyRecord 的）
  - CMD: "awk '/arbitrate\\(/{a=NR} /await applyRecord\\(/{b=NR} END{exit !(a && b && a<b)}' drift/lib/sync/record_local_applier.dart"
    EXPECT_EXIT: 0

SELF_CHECK:
  - 把 canAdvanceCursor 临时改回恒 true →
    `failed_change_blocks_cursor_advance` 必须变红 → 改回
  - 把 canAdvanceCursor 临时改成"有任何非 applied 就 false"（把 skipped 也算进去）→
    `skipped_change_does_not_block_cursor_advance` 必须变红 → 改回。
    **这一步最关键** —— 它证明你区分了 failed 与 skipped，而不是一刀切
  - 把 canAdvanceCursor 临时改成恒 false →
    `all_success_still_advances_cursor` 必须变红 → 改回
  - 把仲裁调用临时挪到 applyRecord 之后 →
    `arbiter_keep_local_records_skipped_not_applied` 必须变红 → 改回
  - 把 discardedPayloadJson 临时填成新 payload（而非旧的）→
    `take_remote_archives_the_overwritten_local` 必须变红 → 改回
  - 把"本地实体是否存在"的判断临时去掉（两种情况一律不留档）→
    `stampless_existing_local_is_archived_but_absent_local_is_not` 的②必须变红，
    而①【仍然绿】→ 改回。这一步证明你区分了两种现实，而不是一刀切
  - 把 remote 的 hlcPacked 为空时临时补成 0 →
    `missing_hlc_on_remote_change_keeps_local` 必须变红 → 改回
  - 把 keepLocal 分支的留档临时删掉 →
    `keep_local_archives_the_discarded_remote` 必须变红 → 改回
  - 把畸形 payload 临时归成 skipped →
    `malformed_payload_is_failed_and_blocks_cursor` 必须变红 → 改回
  - 把 `clock.observe(...)` 临时注释掉 →
    `observe_called_on_every_stamped_inbound_change` 必须变红，
    而其余测试【仍然绿】→ 改回。这一步同时证明只有这条抓得到漏调
  - 十一次自检后 `git status --porcelain` 必须为空

ON_FAIL:
  - RED 阶段测试没红（写实现前就绿）→ 测试没真正依赖新类型/新行为，
    停下重写测试，【不要】继续往下做
  - 实现后 VERIFICATION 某条不过 → 先看是不是 EXPECT 写错（尤其 grep -c 的
    双 EXPECT 语义：无匹配时打印 0 且退出码 1），再改实现
  - core / drift / firebase 的【既有】测试变红 → 立即停下。
    本 ACT 只加不改，既有测试变红说明动到了不该动的地方
  - SELF_CHECK 的某条注入后【没有】变红 → 那条门禁是假的，
    必须重写门禁而不是跳过自检
  - 基线类命令（analyze 数量、测试数量）不符 → 不要改基线迁就实现，
    先确认是不是真的引入了新问题
  - 连续两次修不好同一条 → 在纪要「决定记录」写下现象与已排除的可能，停下上报，
    不要连续第三次尝试

DONE_WHEN:
  - failed 阻止游标推进、skipped 不阻止，两条测试成对通过
  - lastError 带上第一条失败的 operationId 与原始错误
  - ConflictArbiter 接进 applier 且仲裁在写库之前
  - takeRemote 时被覆盖的本地 payload 与 stamp 记进 outcome 的 discarded* 三个字段
  - 边表无戳时区分"本地无实体"与"本地有实体无戳"，后者【必须留档】
  - remote 无 hlcPacked 时传 null 而非补 0，走 keepLocal 的 fail-safe 方向
  - 【定序坐标】里不再有 LamportStamp / overwritten* 这两类旧名，
    且 `rev` 不被用作冲突仲裁坐标、版本胜负依据或旧 Lamport 路径
    （⚠ `RecordMeta.rev` 作为**业务字段**的解析与保存是既有合法行为，
    【不得】全局禁裸词 rev —— 那会误杀正常领域字段。Codex R4 · P2-1）
  - 戳与记录走 ACT 08 的 applyWithStamp 同事务接口
  - 十一个测试用例全部存在，十条 SELF_CHECK 已实做并确认能变红
