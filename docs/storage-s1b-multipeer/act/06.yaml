    `pull_backoff_keyed_by_peer_and_entity_type` 必须变红 → 改回
  - 把生命周期清理临时注释掉 → `backoff_maps_do_not_leak_removed_peers` 必须变红 → 改回
  - 四次自检后 `git status --porcelain` 必须为空

DONE_WHEN:
  - 四个退避状态字段全部带 peer 维度，键用 Dart record 而非拼接字符串
  - 判定逻辑逐 peer 生效（不是"任一退避就整轮跳过"）
  - 生命周期清理覆盖新键，无僵尸条目
  - 退避算法本身零变化
  - 六个测试用例全部存在，四条 SELF_CHECK 已实做并确认能变红
