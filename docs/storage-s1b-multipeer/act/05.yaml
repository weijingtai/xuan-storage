TASK_DETAIL:
  primary_key_switch_v8: >
    ACT 05 已把 peer_id 列加好（带默认值 'firestore'，既有行已回填）。
    本 ACT 把主键切到三元组，升 schemaVersion 到 **8**：

      @override
      Set<Column> get primaryKey => {scopeUid, peerId, entityType};

      if (from < 8) {
        await m.alterTable(TableMigration(syncStates));   // 主键变更走建新表+搬数据
      }

    SQLite 改主键做不到 ALTER，必须建新表 + 搬数据 + 改名，drift 的 `TableMigration`
    负责这个流程。【不要】手写 `customStatement('ALTER TABLE ...')` ——
    手写极易漏掉索引重建。
    ⚠ 搬数据时 peer_id 列已经有值（ACT 05 填的），本 ACT 不需要再回填。
    迁移测试要断言：切换后【每一行的每一个字段】与切换前逐字段相等。

    【不要】动 onUpgrade 的 from<2..7 七段。

  peek_batch_join: >
    【本 ACT 的核心逻辑，写错不报错】。peekBatch(scopeUid, peerId, limit) 的正确语义：

      返回 t_outbox 中 scope_uid = ? 的记录，满足：
        该 (operation_id, peerId) 在 t_outbox_peer_ack 中
          · 【不存在】            → 可推（首次推送）
          · 存在且 status 是 'pending' 或 'failed' → 可推（重试）
          · 存在且 status 是 'success' 或 'dead'   → 不可推

    必须用 LEFT JOIN（或 NOT EXISTS 子查询），且【显式处理 ack 行不存在的情况】。
    SQL 提示：`WHERE ack.status IS NULL OR ack.status IN ('pending','failed')`
    —— `ack.status != 'success'` 是错的，NULL != 'success' 求值为 NULL 不是 true。

    排序仍按 created_at_utc 升序（端口约定「返回顺序稳定」，既有测试依赖它）。

  ack_row_creation: >
    ack 行【惰性创建】：enqueue 时【不】为所有对端预建 ack 行。
    理由：入队时对端集合还不确定（ACT 03 的 enqueue 没有 peerId），
    且预建等于要求业务写入层枚举对端 —— 错误的耦合方向。
    markSuccess / markFailed 用 upsert（insertOnConflictUpdate）写 ack 行。

  counts_are_per_peer: >
    backlogCount / watchBacklogCount / deadCount 全部按同一个 JOIN 语义计数：
      backlog = 该 peer 可推的条数（含 ack 行不存在的）
      dead    = 该 peer 的 ack 行 status = 'dead' 的条数
    watchBacklogCount 的 stream 必须在【该 peer 的 ack 行变化时】发射新值 ——
    drift 的 `.watch()` 会自动跟踪被查询表，只要查询里 JOIN 了 t_outbox_peer_ack 就成立；
    若你为了省事改成只查 t_outbox 再在 Dart 里过滤，stream 将【不会】在 ack 变化时发射，
    表现是「云端推完后 LAN 的 backlog 数字不更新」。

  sync_state_store: >
    DriftSyncStateStore 的五个方法把 peerId 加进 where 条件与主键写入。
    setCursorIfNewer 的「不回退」判定仍按 (scopeUid, peerId, entityType) 那一行做比较 ——
    【不要】跨 peer 比较游标新旧，两个对端的游标本来就不可比。

  parity_with_memory_fake: >
    本 ACT 的验收标准是「drift 实现与 ACT 03 的内存 fake 行为逐条一致」。
    最省事也最可靠的做法：把 core/test 里那几条 per-peer 语义测试
    （ack_for_one_peer_does_not_hide_record_from_another 等）在 drift 侧【照抄一遍】，
    只把 store 换成 Drift 实现。两套实现跑同一组断言，差异立刻显形。

CONSTRAINTS:
  - 【不要】用 INNER JOIN 查 peekBatch。见 peek_batch_join —— 会漏掉所有首次推送的记录。
  - 【不要】用 `ack.status != 'success'` 作为可推条件。NULL 语义会咬人。
  - 【不要】在 enqueue 时预建 ack 行。见 ack_row_creation。
  - 【不要】把 backlog/dead 计数改成"查 t_outbox 再在 Dart 里过滤"。见 counts_are_per_peer。
  - 【不要】跨 peer 比较游标新旧。见 sync_state_store。
  - 【不要】在本 ACT 加 channel 策略过滤。那是 ACT 06；混进来会让两个 ACT 的验收纠缠。
  - 【不要】改动 t_outbox 表结构或 ACT 04 的迁移代码。本 ACT 只写查询与方法体。
  - 每个改动的公开声明必须更新中文 dartdoc（A12）。

TESTS_FIRST:
  CASES:
    - NAME: v7_to_v8_primary_key_switch_preserves_all_rows
      FILE: drift/test/sync/outbox_peer_ack_semantics_test.dart
      BEHAVIOR: >
        造一个 v7 库（t_sync_state 主键仍是二元组、peer_id 列已存在且为 'firestore'），
        插入【至少 3 行】，每行各字段填互不相同的可辨识值。
        升级到 v8 后断言：
        - 行数【仍是 3】；
        - 每一行的【每一个字段】逐字段等于插入时的值；
        - `PRAGMA table_info` 显示主键为 (scope_uid, peer_id, entity_type)；
        - `PRAGMA user_version` 为 8。
        主键切换走的是建新表+搬数据，漏搬或搬错列【不报错】，
        只会让所有历史游标失效 → 全量重拉。只断言"主键变了"是不够的。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_semantics_test.dart
      RED_EXPECT: 断言失败（schemaVersion 仍是 7），退出码非 0
      COVERS: [A3]

    - NAME: never_acked_record_is_peekable_by_new_peer
      FILE: drift/test/sync/outbox_peer_ack_semantics_test.dart
      BEHAVIOR: >
        【本 ACT 最重要的一条 —— 专打 INNER JOIN 与 NULL 语义两个坑】。
        enqueue 一条记录，【完全不调用任何 markSuccess/markFailed】
        （即 t_outbox_peer_ack 里一行都没有）。
        断言 `peekBatch(peerId: PeerId('lan'), ...)` 【返回该记录】。
        再断言 `backlogCount(peerId: lan)` 为 1。
        用 INNER JOIN 或 `status != 'success'` 写的实现，这条会红 ——
        而线上表现是「新记录永远推不出去」，且只在新增对端时才暴露。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_semantics_test.dart
      RED_EXPECT: 编译失败（peekBatch 尚无 peerId 参数），退出码非 0
      COVERS: [A4]

    - NAME: success_on_one_peer_leaves_others_peekable
      FILE: drift/test/sync/outbox_peer_ack_semantics_test.dart
      BEHAVIOR: >
        与 ACT 03 内存 fake 的同名断言【逐条一致】（parity 检查）：
        enqueue 一条，对 PeerId('firestore') markSuccess。断言：
        - `peekBatch(peerId: firestore)` 不含该记录；
        - `peekBatch(peerId: lan)`       仍含该记录；
        - t_outbox 里该行【仍在】（success 不删记录 —— compaction 才删，§5.3）。
        最后一条很重要：若实现为了省事在 markSuccess 里删了 t_outbox 行，
        其他对端就永远拿不到了，而这恰恰是 §5.2.1 第一个「不可接受」。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_semantics_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A4]

    - NAME: dead_on_one_peer_does_not_affect_others
      FILE: drift/test/sync/outbox_peer_ack_semantics_test.dart
      BEHAVIOR: >
        对 PeerId('lan') markFailed 10 次、最后一次 isDead: true。断言：
        - `deadCount(peerId: lan)` 为 1、`peekBatch(peerId: lan)` 不含该记录；
        - `deadCount(peerId: firestore)` 为 【0】、`peekBatch(peerId: firestore)` 【仍含】；
        - t_outbox 里该行的 attempt 字段【未被改动】（attempt 是 per-peer 的，
          归 ack 表管；写进 t_outbox 会让一个 peer 的重试次数污染其他 peer）。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_semantics_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A5]

    - NAME: backlog_stream_emits_on_ack_change
      FILE: drift/test/sync/outbox_peer_ack_semantics_test.dart
      BEHAVIOR: >
        订阅 `watchBacklogCount(scopeUid, PeerId('lan'))`，收集发射序列。
        enqueue 一条 → 期望收到 1；对 lan markSuccess → 期望收到 0。
        【关键】：再对 firestore markSuccess → lan 那条流【不应】因此发射新值
        （或即使发射，值仍是 0）。
        若实现改成只查 t_outbox 再在 Dart 里过滤，第二步不会发射 ——
        线上表现是「云端推完后 LAN 的 backlog 数字卡住不动」。
        用超时收集（例如 `.take(2).timeout(...)`），不要用固定 sleep。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_semantics_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A4]

    - NAME: cursor_per_peer_no_cross_peer_regression_guard
      FILE: drift/test/sync/outbox_peer_ack_semantics_test.dart
      BEHAVIOR: >
        对 (scope, firestore, 'record') setCursorIfNewer 一个【较新】的 cursor；
        再对 (scope, lan, 'record') setCursorIfNewer 一个【较旧】的 cursor。
        断言后者【写入成功】—— 两个对端的游标不可比，旧不代表回退。
        若实现跨 peer 比较新旧，lan 的游标会被拒绝写入，
        表现是「LAN peer 永远从头拉」。
        再断言两者各读各的、互不覆盖。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_semantics_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A4]

    - NAME: no_ack_rows_created_at_enqueue
      FILE: drift/test/sync/outbox_peer_ack_semantics_test.dart
      BEHAVIOR: >
        enqueue 一条记录后，直接查 t_outbox_peer_ack 的行数，断言为 【0】。
        ack 行必须惰性创建。预建等于要求业务写入层枚举所有对端 ——
        错误的耦合方向，且新增一个对端时历史记录不会有它的 ack 行，
        逻辑上必须能处理"不存在"，预建只会掩盖这一点直到某天暴露。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_semantics_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A4]

