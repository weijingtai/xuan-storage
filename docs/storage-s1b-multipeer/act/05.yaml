      # fail closed 语义已写死：lookup 返回 null 一律不推。
    - core/lib/model/storage_policy_registry.dart   # lookup / all / clearForTesting
    - core/lib/model/storage_policy.dart            # channels getter（cloud 结构性恒在）
    - core/lib/model/storage_classification.dart    # Channel enum:25
    - core/lib/model/sync_peer.dart                 # SyncPeer.channel（ACT 01）
    - core/lib/model/ports.dart                     # ACT 04 的 peekBatch(peerId) 签名
    - drift/lib/persistence_drift.dart              # ACT 04 的 peekBatch 实现（LEFT JOIN ack 表）
  MODIFY:
    - core/lib/model/ports.dart          # peekBatch + 三个计数方法增加 channel 参数（见 SIGNATURE）
    - core/lib/test_support/in_memory_stores.dart   # ACT 04 抽出的公开 fake，同步实现过滤
    - drift/lib/persistence_drift.dart   # drift 实现接上过滤
    - core/lib/core/sync_coordinator.dart    # 调用点传入该 peer 的 channel
  WRITE:
