WHY_STRONG_MODEL: >
  ⚠ 本 ACT 的核心是一个【左连接 + 空值判定】：
    peekBatch(peerId) 要返回「t_outbox 里存在、但该 peerId 在 t_outbox_peer_ack 里
    尚未 success 也未 dead」的记录 —— 包括【ack 行还不存在】的情况（首次推送）。
  写成 INNER JOIN 会漏掉所有从未推送过的记录（ack 行不存在）——
  表现是「新记录永远推不出去」，而且只在新增对端时才暴露。
  写成 `status != 'success'` 而不处理 NULL，SQL 里 `NULL != 'success'` 结果是 NULL 不是 true，
  同样漏掉首次推送。这两个错误都【不会报错】，测试若只测"推过一次的记录"也不会红。

