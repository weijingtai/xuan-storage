ACT_VERSION: 1
TASK_ID: mimo-storage-s1b-multipeer/05
TITLE: 策略过滤 —— PeerEligibility 单一判定源 + peekBatch 按 channel 过滤
TYPE: security
ORDER: 5
DEPENDS_ON: [mimo-storage-s1b-multipeer/04]
DISPATCH_STATUS: ready
STRONG_MODEL_ONLY: false

OBJECTIVE: >
  §5.4 的第一道锁：`peekBatch` 按 channel 过滤，`shared` 类记录不会被派发给
  非 cloud 的对端（§2.3.1）。
  本 ACT 排在扇出（ACT 06）【之前】是刻意的：不知道谁有资格收，就不该先建扇出。
  转译 v1 把过滤排在扇出之后，结果 peekBatch 挑好的记录被 pushToAll 转头发给所有人
  —— shared 照样泄漏到 LAN，两边测试都绿（Codex R1 · P0-1）。

  本 ACT 交付【单一判定源】 `PeerEligibility`，peekBatch 与 ACT 06 的扇出
  **共用同一个函数**。两处各写一份判定 = 迟早分叉，而分叉的那一天不会有人发现。

WHY_THIS_IS_NOT_OPTIONAL: >
  ⚠ 设计稿 §5.4 明确删除了上一版「拓扑上无法到达」的说法，并标注【该说法为假】：

    去中心化通道的对端确实只有本人授信设备，但这只保证「不会分发给其他用户」，
    不保证「shared 数据不会离开云端」—— 没有策略过滤时，
    草稿 oplog 照样会被 fan-out 到本人的 LAN peer。过滤是主动的，不是被动的。

  所以不要以为"反正只有自己的设备，无所谓" —— 那正是被判定为假的推理。

SCOPE:
  READ:
    - docs/superpowers/specs/2026-07-31-storage-architecture-design.md
      # §5.4 全节（两道锁、被删除的错误说法）；§2.3.1 策略强制点
    - core/test/policy_channel_filter_test.dart
