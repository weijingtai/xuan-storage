    **不做这步不算完成本 ACT** —— fail closed 是它的全部意义
  - 把 drift 侧临时改成"先 limit 截断再过滤" →
    `filter_before_limit_no_silent_starvation` 必须变红 → 改回
  - 把 backlogCount 临时改回不过滤 →
    `counts_agree_with_peek_batch` 必须变红 → 改回
  - 把 `policy.channels.contains(channel)` 临时改成
