      FILE: core/test/s1b_ports_peer_scoped_test.dart
      BEHAVIOR: >
        【本 ACT 最重要的一条，也是整个 S1b 的立身之本】。
        用 InMemoryOutboxStore：enqueue 一条记录，对 PeerId('cloud') 调 markSuccess。
        断言：
        - `peekBatch(peerId: PeerId('cloud'))` 【不含】该记录；
        - `peekBatch(peerId: PeerId('lan'))`   【仍含】该记录。
        写成「success 是 operationId 的属性」这条会红 —— 而那正是 §5.2.1
        「离线的 LAN peer 永远收不到这条操作」的成因。
      RED_COMMAND: cd core && flutter test test/s1b_ports_peer_scoped_test.dart
      RED_EXPECT: 编译失败（peekBatch 尚无 peerId 参数），退出码非 0
      COVERS: [A4]

    - NAME: dead_for_one_peer_does_not_kill_another
      FILE: core/test/s1b_ports_peer_scoped_test.dart
      BEHAVIOR: >
        非 happy-path，对应 §5.2.1 的第二个「不可接受」。
        对 PeerId('lan') 连续 markFailed 10 次，最后一次 isDead: true。断言：
        - `deadCount(peerId: lan)` 为 1；
        - `deadCount(peerId: cloud)` 为 【0】；
        - `peekBatch(peerId: cloud)` 【仍含】该记录（云端照常可推）。
        attempt 计数若不是 per-peer，一个长期离线的 LAN peer 会把整个 outbox 推成 dead，
        连带云端同步一起死。
      RED_COMMAND: cd core && flutter test test/s1b_ports_peer_scoped_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A5]

    - NAME: attempt_for_reads_per_peer_counter
      FILE: core/test/s1b_ports_peer_scoped_test.dart
      BEHAVIOR: >
        【新端口 attemptFor 的验收，对应 Codex R1 · P1-15】。
        - 从未推送过的记录：`attemptFor(op, lan)` 返回 【0】，不抛异常；
        - 对 lan markFailed(attempt: 1) 后：`attemptFor(op, lan)` 为 1，
          `attemptFor(op, cloud)` 【仍为 0】；
        - 对 lan 再 markFailed(attempt: 2)：lan 为 2，cloud 仍为 0。
        没有这个读取端口，ACT 06 只能退回 `record.attempt`，
        两个对端共用一个计数 —— cloud 成功也会被 lan 的失败推高。
      RED_COMMAND: cd core && flutter test test/s1b_ports_peer_scoped_test.dart
      RED_EXPECT: 编译失败（attemptFor 不存在），退出码非 0
      COVERS: [A5]

    - NAME: cursor_is_isolated_per_peer
      FILE: core/test/s1b_ports_peer_scoped_test.dart
      BEHAVIOR: >
        用 InMemorySyncStateStore：对 (scope, cloud, 'record') 写入一个较新的 cursor，
        断言 `getCursor(scope, lan, 'record')` 返回 【null】（lan 从未拉过）。
        再对 lan 写入一个【较旧】的 cursor，断言它【写入成功】——
        两个对端的游标不可比，旧不代表回退。
        再断言两者各读各的、互不覆盖。
        游标若不按 peer 隔离，换个 peer 就会从错误的位置续拉 —— 静默丢变更，
        且丢的量等于两个 peer 的进度差。
      RED_COMMAND: cd core && flutter test test/s1b_ports_peer_scoped_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A4]

    - NAME: backlog_stream_is_per_peer
      FILE: core/test/s1b_ports_peer_scoped_test.dart
      BEHAVIOR: >
        订阅 `watchBacklogCount(scope, cloud)` 与 `watchBacklogCount(scope, lan)` 两条流。
        enqueue 一条记录 → 断言两条流【都】收到 1。
        对 cloud markSuccess → 断言 cloud 流收到 0，而 lan 流【仍是 1】。
        这条守的是 SyncRuntime 的触发逻辑：backlog 流若不 per-peer，
        云端推完后 runtime 会认为「没活了」而不再唤醒 LAN 推送。
        用超时收集（例如 `.take(2).timeout(...)`），不要用固定 sleep。
      RED_COMMAND: cd core && flutter test test/s1b_ports_peer_scoped_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A4]

    - NAME: enqueue_signature_unchanged
      FILE: core/test/s1b_ports_peer_scoped_test.dart
      BEHAVIOR: >
        以纯文本读取 core/lib/model/ports.dart，断言其中【逐字】包含
        `Future<void> enqueue(OutboxRecord record);`。
        入队时对端集合还不确定，给 enqueue 加 peerId 会把「有哪些对端」
        这个运行时问题推给业务写入层 —— 错误的耦合方向。
        这种改动在 review 里极易被当成「保持一致」而放过，所以要有文本级守卫。
      RED_COMMAND: cd core && flutter test test/s1b_ports_peer_scoped_test.dart
      RED_EXPECT: 断言失败或编译失败，先红
      COVERS: [A12]

    - NAME: no_default_value_on_peer_id
      FILE: core/test/s1b_ports_peer_scoped_test.dart
      BEHAVIOR: >
        以纯文本扫描 core/lib/model/ports.dart，断言【不存在】
        `PeerId peerId = ` 或 `PeerId peerId,` 前带 `[` 之类的可选写法 ——
        即 12 个方法的 peerId 全部是 `required`。
        再断言 `required PeerId peerId` 出现次数【恰好 12】
        （不是 >= —— 精确值才能同时抓到"少加了一个"与"给 enqueue 也加了"两个方向的错误）。
        计数说明：OutboxStore 7 个（peekBatch / markSuccess / markFailed / attemptFor /
        backlogCount / watchBacklogCount / deadCount）+ SyncStateStore 5 个 = 12。
        **enqueue 是有意的例外，不在这 12 个里**。
        默认值会让 drift 侧漏传 peerId 变成静默通过，编译器就不再是门禁了。
      RED_COMMAND: cd core && flutter test test/s1b_ports_peer_scoped_test.dart
      RED_EXPECT: 断言失败，先红
      COVERS: [A4]

    - NAME: never_acked_record_is_peekable_by_new_peer
      FILE: drift/test/sync/outbox_peer_ack_semantics_test.dart
      BEHAVIOR: >
        【drift 侧最重要的一条 —— 专打 INNER JOIN 与 NULL 语义两个坑】。
        enqueue 一条记录，【完全不调用任何 markSuccess/markFailed】
        （即 t_outbox_peer_ack 里一行都没有）。
        断言 `peekBatch(peerId: PeerId('lan'), ...)` 【返回该记录】。
        再断言 `backlogCount(peerId: lan)` 为 1、`attemptFor(op, lan)` 为 0。
        用 INNER JOIN 或 `status != 'success'` 写的实现，这条会红 ——
        而线上表现是「新记录永远推不出去」，且只在新增对端时才暴露。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_semantics_test.dart
      RED_EXPECT: 编译失败（peekBatch 尚无 peerId 参数），退出码非 0
      COVERS: [A4]

    - NAME: drift_matches_in_memory_store_parity
      FILE: drift/test/sync/outbox_peer_ack_semantics_test.dart
      BEHAVIOR: >
        【parity 检查，本 ACT 阶段 4 的核心】。
        import `package:persistence_core/test_support/in_memory_stores.dart`，
        把上面 core 侧的【五条行为断言】（ack 隔离 / dead 隔离 / attemptFor /
        游标隔离 / backlog 流）写成一个参数化的断言组，
        对 `InMemoryOutboxStore` 与 `DriftOutboxStore` 【各跑一遍】。
        两套实现跑同一组断言，差异立刻显形 —— 内存 fake 与 drift 各自绿
        但行为不一致，是这类改造最典型的漏。
        ⚠ 【必须真的 import 那个公开类】。若你发现 import 不到，
        说明阶段 1 没把 fake 抽到 lib/test_support/ 下，回去补，不要在 drift 侧另抄一份。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_semantics_test.dart
      RED_EXPECT: 编译失败（InMemoryOutboxStore 不可 import），退出码非 0
      COVERS: [A4, A5]

    - NAME: success_on_one_peer_does_not_delete_outbox_row
      FILE: drift/test/sync/outbox_peer_ack_semantics_test.dart
      BEHAVIOR: >
        enqueue 一条，对 PeerId('firestore') markSuccess。断言：
        - `peekBatch(peerId: firestore)` 不含该记录；
        - `peekBatch(peerId: lan)`       仍含该记录；
        - **t_outbox 里该行【仍在】**（success 不删记录 —— compaction 才删，§5.3）。
        最后一条很重要：若实现为了省事在 markSuccess 里删了 t_outbox 行，
        其他对端就永远拿不到了，而这恰恰是 §5.2.1 第一个「不可接受」。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_semantics_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A4]

    - NAME: dead_on_one_peer_leaves_outbox_attempt_untouched
      FILE: drift/test/sync/outbox_peer_ack_semantics_test.dart
      BEHAVIOR: >
        对 PeerId('lan') markFailed 10 次、最后一次 isDead: true。断言：
        - `deadCount(peerId: lan)` 为 1、`peekBatch(peerId: lan)` 不含该记录；
        - `deadCount(peerId: firestore)` 为 【0】、`peekBatch(peerId: firestore)` 【仍含】；
        - **t_outbox 里该行的 attempt 字段【未被改动】**（attempt 是 per-peer 的，
          归 ack 表管；写进 t_outbox 会让一个 peer 的重试次数污染其他 peer）。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_semantics_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A5]

    - NAME: no_ack_rows_created_at_enqueue
      FILE: drift/test/sync/outbox_peer_ack_semantics_test.dart
      BEHAVIOR: >
        enqueue 一条记录后，直接查 t_outbox_peer_ack 的行数，断言为 【0】。
        ack 行必须惰性创建。预建等于要求业务写入层枚举所有对端 ——
        错误的耦合方向，且新增一个对端时历史记录不会有它的 ack 行，
        逻辑上必须能处理"不存在"，预建只会掩盖这一点直到某天暴露。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_semantics_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A4]

