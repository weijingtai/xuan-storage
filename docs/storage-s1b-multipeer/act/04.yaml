        断言 `peekBatch(peerId: PeerId('lan'), ...)` 【返回该记录】。
        再断言 `backlogCount(peerId: lan)` 为 1。
        用 INNER JOIN 或 `status != 'success'` 写的实现，这条会红 ——
        而线上表现是「新记录永远推不出去」，且只在新增对端时才暴露。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_semantics_test.dart
      RED_EXPECT: 编译失败（peekBatch 尚无 peerId 参数），退出码非 0
      COVERS: [A4]

    - NAME: success_on_one_peer_leaves_others_peekable
      FILE: drift/test/sync/outbox_peer_ack_semantics_test.dart
      BEHAVIOR: >
        与 ACT 02 内存 fake 的同名断言【逐条一致】（parity 检查）：
        enqueue 一条，对 PeerId('firestore') markSuccess。断言：
        - `peekBatch(peerId: firestore)` 不含该记录；
        - `peekBatch(peerId: lan)`       仍含该记录；
        - t_outbox 里该行【仍在】（success 不删记录 —— compaction 才删，§5.3）。
        最后一条很重要：若实现为了省事在 markSuccess 里删了 t_outbox 行，
        其他对端就永远拿不到了，而这恰恰是 §5.2.1 第一个「不可接受」。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_semantics_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A4]

    - NAME: dead_on_one_peer_does_not_affect_others
      FILE: drift/test/sync/outbox_peer_ack_semantics_test.dart
      BEHAVIOR: >
        对 PeerId('lan') markFailed 10 次、最后一次 isDead: true。断言：
        - `deadCount(peerId: lan)` 为 1、`peekBatch(peerId: lan)` 不含该记录；
        - `deadCount(peerId: firestore)` 为 【0】、`peekBatch(peerId: firestore)` 【仍含】；
        - t_outbox 里该行的 attempt 字段【未被改动】（attempt 是 per-peer 的，
          归 ack 表管；写进 t_outbox 会让一个 peer 的重试次数污染其他 peer）。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_semantics_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A5]

    - NAME: backlog_stream_emits_on_ack_change
      FILE: drift/test/sync/outbox_peer_ack_semantics_test.dart
      BEHAVIOR: >
        订阅 `watchBacklogCount(scopeUid, PeerId('lan'))`，收集发射序列。
        enqueue 一条 → 期望收到 1；对 lan markSuccess → 期望收到 0。
        【关键】：再对 firestore markSuccess → lan 那条流【不应】因此发射新值
        （或即使发射，值仍是 0）。
        若实现改成只查 t_outbox 再在 Dart 里过滤，第二步不会发射 ——
        线上表现是「云端推完后 LAN 的 backlog 数字卡住不动」。
        用超时收集（例如 `.take(2).timeout(...)`），不要用固定 sleep。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_semantics_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A4]

    - NAME: cursor_per_peer_no_cross_peer_regression_guard
      FILE: drift/test/sync/outbox_peer_ack_semantics_test.dart
      BEHAVIOR: >
        对 (scope, firestore, 'record') setCursorIfNewer 一个【较新】的 cursor；
        再对 (scope, lan, 'record') setCursorIfNewer 一个【较旧】的 cursor。
        断言后者【写入成功】—— 两个对端的游标不可比，旧不代表回退。
        若实现跨 peer 比较新旧，lan 的游标会被拒绝写入，
        表现是「LAN peer 永远从头拉」。
        再断言两者各读各的、互不覆盖。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_semantics_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A4]

    - NAME: no_ack_rows_created_at_enqueue
      FILE: drift/test/sync/outbox_peer_ack_semantics_test.dart
      BEHAVIOR: >
        enqueue 一条记录后，直接查 t_outbox_peer_ack 的行数，断言为 【0】。
        ack 行必须惰性创建。预建等于要求业务写入层枚举所有对端 ——
        错误的耦合方向，且新增一个对端时历史记录不会有它的 ack 行，
        逻辑上必须能处理"不存在"，预建只会掩盖这一点直到某天暴露。
      RED_COMMAND: cd drift && flutter test test/sync/outbox_peer_ack_semantics_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A4]

