TASK_DETAIL:
  peek_batch_join: >
    【本 ACT 的核心逻辑，写错不报错】。peekBatch(scopeUid, peerId, limit) 的正确语义：

      返回 t_outbox 中 scope_uid = ? 的记录，满足：
        该 (operation_id, peerId) 在 t_outbox_peer_ack 中
          · 【不存在】            → 可推（首次推送）
          · 存在且 status 是 'pending' 或 'failed' → 可推（重试）
          · 存在且 status 是 'success' 或 'dead'   → 不可推

    必须用 LEFT JOIN（或 NOT EXISTS 子查询），且【显式处理 ack 行不存在的情况】。
    SQL 提示：`WHERE ack.status IS NULL OR ack.status IN ('pending','failed')`
    —— `ack.status != 'success'` 是错的，NULL != 'success' 求值为 NULL 不是 true。

    排序仍按 created_at_utc 升序（端口约定「返回顺序稳定」，既有测试依赖它）。

  ack_row_creation: >
    ack 行【惰性创建】：enqueue 时【不】为所有对端预建 ack 行。
    理由：入队时对端集合还不确定（ACT 02 的 enqueue 没有 peerId），
    且预建等于要求业务写入层枚举对端 —— 错误的耦合方向。
    markSuccess / markFailed 用 upsert（insertOnConflictUpdate）写 ack 行。

  counts_are_per_peer: >
    backlogCount / watchBacklogCount / deadCount 全部按同一个 JOIN 语义计数：
      backlog = 该 peer 可推的条数（含 ack 行不存在的）
      dead    = 该 peer 的 ack 行 status = 'dead' 的条数
    watchBacklogCount 的 stream 必须在【该 peer 的 ack 行变化时】发射新值 ——
    drift 的 `.watch()` 会自动跟踪被查询表，只要查询里 JOIN 了 t_outbox_peer_ack 就成立；
    若你为了省事改成只查 t_outbox 再在 Dart 里过滤，stream 将【不会】在 ack 变化时发射，
    表现是「云端推完后 LAN 的 backlog 数字不更新」。

  sync_state_store: >
    DriftSyncStateStore 的五个方法把 peerId 加进 where 条件与主键写入。
    setCursorIfNewer 的「不回退」判定仍按 (scopeUid, peerId, entityType) 那一行做比较 ——
    【不要】跨 peer 比较游标新旧，两个对端的游标本来就不可比。

  parity_with_memory_fake: >
    本 ACT 的验收标准是「drift 实现与 ACT 02 的内存 fake 行为逐条一致」。
    最省事也最可靠的做法：把 core/test 里那几条 per-peer 语义测试
    （ack_for_one_peer_does_not_hide_record_from_another 等）在 drift 侧【照抄一遍】，
    只把 store 换成 Drift 实现。两套实现跑同一组断言，差异立刻显形。

CONSTRAINTS:
  - 【不要】用 INNER JOIN 查 peekBatch。见 peek_batch_join —— 会漏掉所有首次推送的记录。
  - 【不要】用 `ack.status != 'success'` 作为可推条件。NULL 语义会咬人。
  - 【不要】在 enqueue 时预建 ack 行。见 ack_row_creation。
  - 【不要】把 backlog/dead 计数改成"查 t_outbox 再在 Dart 里过滤"。见 counts_are_per_peer。
  - 【不要】跨 peer 比较游标新旧。见 sync_state_store。
  - 【不要】在本 ACT 加 channel 策略过滤。那是 ACT 09；混进来会让两个 ACT 的验收纠缠。
  - 【不要】改动 t_outbox 表结构或 ACT 03 的迁移代码。本 ACT 只写查询与方法体。
  - 每个改动的公开声明必须更新中文 dartdoc（A12）。

