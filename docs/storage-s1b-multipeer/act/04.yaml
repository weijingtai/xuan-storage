OBJECTIVE: >
  给 ACT 04 定下的 per-peer 语义配上持久化结构（§5.2.2 第 1、2 条）。

  ⚠ **本 ACT 只做「加法」：建新表 + 给 t_sync_state 加一个带默认值的 peer_id 列。
  主键【暂不改】。** 这样 drift 整包【仍然编译、276 个既有测试仍然全绿】，
  迁移测试因此可以在本 ACT 内真正跑起来。

  转译 v1 把主键切换也放在这里，结果是死锁（Codex R1 · P1-14）：
  ACT 04 改了端口之后 drift 编译不过，而迁移测试 import 的正是同一个
  persistence_drift.dart —— 测试根本跑不了，"EXPECT_EXIT 0" 无法满足。
  主键切换移到 ACT 07（v8），与 DAO/Store 改造在同一个 ACT 内从红到绿。

WHY_STRONG_MODEL: >
  ⚠ 这个 ACT 为什么必须强模型：
  写错的迁移【不会抛异常、不会让测试变红】。t_sync_state 主键从
  {scopeUid, entityType} 变成 {scopeUid, peerId, entityType}，SQLite 上做不到
  ALTER，必须建新表 + 搬数据 + 改名。搬数据时若把 peerId 回填成空串、或漏搬几行、
  或把 cursor_updated_at_utc 搬丢，结果是【所有历史游标失效 → 全量重拉】——
  用户看到的是"app 突然卡住并重新下载全部数据"，而代码里一行错误日志都没有。
  这类 bug 只有靠"造一个 v6 库、升级、逐字段比对"才能抓到，所以 TESTS_FIRST
  的第一条是本 ACT 的生死线。

