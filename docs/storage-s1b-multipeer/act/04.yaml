SIGNATURE:
  persistence_drift.dart 新增: |
    /// per-peer ack 水位表（§5.2.2 第 1 条）。
    ///
    /// 一条 outbox 记录对 N 个对端各有一行 ack —— 记录本身只存一份，
    /// 「推没推成功」是 (operationId, peerId) 二元组的属性。
    ///
    /// 本表【同时】是 §5.3 oplog compaction 的水位表：
    /// 「所有已知 peer 均已 success 的 operationId 可被压缩」这一判定直接查本表。
    /// 因此 compaction 的数据模型不是待决项，它就是这张表。
    @DataClassName('OutboxPeerAckRow')
    class OutboxPeerAcks extends Table {
      @override
      String get tableName => 't_outbox_peer_ack';

      TextColumn get operationId => text().named('operation_id')();
      TextColumn get peerId => text().named('peer_id')();

      /// pending / success / failed / dead。与 t_outbox.status 同一套取值。
      TextColumn get status =>
          text().withDefault(const Constant('pending')).named('status')();

      /// 该对端的重试次数。per-peer —— 一个对端推成 dead 不影响其他对端。
      IntColumn get attempt =>
          integer().withDefault(const Constant(0)).named('attempt')();

      TextColumn get lastErrorCode => text().nullable().named('last_error_code')();
      TextColumn get lastErrorMessage =>
          text().nullable().named('last_error_message')();
      DateTimeColumn get ackedAtUtc => dateTime().nullable().named('acked_at_utc')();

      @override
      Set<Column> get primaryKey => {operationId, peerId};
    }

  persistence_drift.dart 改动: |
    // SyncStates 新增列，【带默认值】，放在 entityType 之后。
    // 有默认值 ⇒ 既有 DAO 代码不必改就能继续编译，这是本 ACT 不破坏编译的关键。
    TextColumn get peerId =>
        text().withDefault(const Constant('firestore')).named('peer_id')();

    // ⚠ 主键【本 ACT 不动】，仍是 {scopeUid, entityType}。
    // 切换到 {scopeUid, peerId, entityType} 是 ACT 07（v8）的事。

    // schemaVersion:541
    int get schemaVersion => 7;

TASK_DETAIL:
  backfill_value: >
    既有 t_sync_state 行的 peer_id 一律回填 **'firestore'**。

    这个值【不是随便选的】：它必须与 ACT 03 钉死的
    `FirestoreRemoteGateway.peerId = PeerId('firestore')` 逐字一致。
    对不上的后果是所有历史游标查不到 → 全量重拉。
    ACT 03 已经为这个字面量加了 grep 门禁，本 ACT 的迁移测试要再验一次。

    【不要】回填成 'cloud' / 'default' / 空串。'cloud' 是 Channel 的名字不是 peerId；
    空串会让主键三元组退化且永远匹配不上任何真实对端。

  migration_mechanics: >
    本 ACT 是纯加法，用 drift 的 `addColumn`，不需要建新表搬数据：

      if (from < 7) {
        await m.createTable(outboxPeerAcks);
        await m.addColumn(syncStates, syncStates.peerId);   // 带默认值，既有行自动填 'firestore'
        await _createOutboxPeerAckIndices();
      }

    放在既有 from<6 之后，【不要动前五段】。
    因为列带 `withDefault(Constant('firestore'))`，既有行升级后自动获得回填值，
    不需要 columnTransformer，也不会有 NULL 落进 NOT NULL 列。

    索引照既有风格另起一个私有方法，与 _createRecordIndices / _createAuditLogIndices 并列：
      idx_outbox_peer_ack_peer_status   ON t_outbox_peer_ack (peer_id, status)
      idx_outbox_peer_ack_operation     ON t_outbox_peer_ack (operation_id)
    前者服务 peekBatch（按对端筛未 ack 的），后者服务 compaction（按 operationId 聚合）。

  no_dao_changes: >
    【本 ACT 不动 OutboxRecordsDao:226 / SyncStatesDao:350 / DriftOutboxStore:614 /
    DriftSyncStateStore:916 的方法体】。

    ⚠ 但本 ACT 结束时 **drift 整包必须编译通过、276 个既有测试必须全绿**。
    这是本 ACT 与转译 v1 最大的不同：新列有默认值、主键没动，
    所以既有 DAO 代码一个字不改也能编译。
    如果你发现 drift 编译不过，说明你顺手改了主键 —— 那是 ACT 07 的事，撤回来。

  t_outbox_unchanged: >
    t_outbox 表本身【不动】—— 不加 peer_id 列、主键仍是 {operationId}。
    ack 是独立一张表。把 peer 维度塞进 t_outbox 会让同一条操作的 payload
    复制 N 份（N = 对端数），既浪费又制造了 N 份可能不一致的真相。

CONSTRAINTS:
  - 【不要】改动 onUpgrade 里 from<2 到 from<6 的五段。它们是历史迁移路径，
    改一个字都可能让某个停留在旧版本的用户升级失败，而这类用户你无法测试。
  - 【不要】把回填值写成 'cloud' / 'default' / 空串。见 backfill_value。
  - 【不要】给 t_outbox 加 peer_id 列。见 t_outbox_unchanged。
  - 【不要】在本 ACT 顺手修 DriftOutboxStore 的编译错误。那是 ACT 05。
  - 【不要】用 `customStatement('ALTER TABLE ... ')` 手写主键变更。
    drift 的 TableMigration 会处理临时表命名与外键，手写极易漏掉索引重建。
  - 每个新增公开声明必须有中文 dartdoc（A12）。

