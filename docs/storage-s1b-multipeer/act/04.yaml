    // 跨包根本 import 不到。挪进 lib/test_support/ 并去掉下划线才真的可复用。
    //
    // 目录名用 test_support 而非 testing，与 Dart 生态惯例一致；
    // ACT 11 的 barrel 【不导出】它 —— 它不是产品 API。

    /// [OutboxStore] 的内存实现，仅供测试与 parity 比对使用。
    ///
    /// 【本类是 drift 实现的可执行规格】：ack 按 (operationId, peerId) 二元组存，
    /// **不是**给 OutboxRecord 加一个 status 字段 —— 记录本身只有一份，ack 有 N 份。
    final class InMemoryOutboxStore implements OutboxStore { ... }

    /// [SyncStateStore] 的内存实现，仅供测试使用。
    ///
    /// 游标按 (scopeUid, peerId, entityType) 三元组存。
    final class InMemorySyncStateStore implements SyncStateStore { ... }

TASK_DETAIL:
  parameter_position: >
    peerId 一律紧跟 scopeUid 之后（或 operationId 之后），保持 12 个方法的参数顺序一致。
    全是 named 参数，位置本不影响调用，但一致的顺序让 review 时一眼能看出漏了谁。

  in_memory_fake_keying: >
    抽出来的两个 fake 是本 ACT 的【可执行规格】：
      InMemoryOutboxStore    —— 内部状态必须按 (operationId, peerId) 二元组存 ack。
                                记录本身只有一份，ack 有 N 份。
      InMemorySyncStateStore —— 游标按 (scopeUid, peerId, entityType) 三元组存。
    drift 实现的行为必须与它们【逐条一致】，这是阶段 4 parity 测试的全部内容。

    core/test/persistence_core_test.dart 里原来的两个私有 fake 【删掉】，
    改为 import 新文件。不要留两份 —— 留两份就会分叉，而分叉那天不会有人发现。

  peek_batch_join: >
    【drift 侧的核心逻辑，写错不报错】。peekBatch(scopeUid, peerId, limit) 的正确语义：

      返回 t_outbox 中 scope_uid = ? 的记录，满足：
        该 (operation_id, peerId) 在 t_outbox_peer_ack 中
          · 【不存在】            → 可推（首次推送）
          · 存在且 status 是 'pending' 或 'failed' → 可推（重试）
          · 存在且 status 是 'success' 或 'dead'   → 不可推

    必须用 LEFT JOIN（或 NOT EXISTS 子查询），且【显式处理 ack 行不存在的情况】。
    SQL 提示：`WHERE ack.status IS NULL OR ack.status IN ('pending','failed')`
    —— `ack.status != 'success'` 是错的，NULL != 'success' 求值为 NULL 不是 true。

    写成 INNER JOIN 会漏掉所有从未推送过的记录（ack 行不存在）——
    表现是「新记录永远推不出去」，而且只在新增对端时才暴露。

    排序仍按 created_at_utc 升序（端口约定「返回顺序稳定」，既有测试依赖它）。

  ack_row_creation: >
    ack 行【惰性创建】：enqueue 时【不】为所有对端预建 ack 行。
    理由：入队时对端集合还不确定（enqueue 没有 peerId），
    且预建等于要求业务写入层枚举对端 —— 错误的耦合方向。
    markSuccess / markFailed 用 upsert（insertOnConflictUpdate）写 ack 行。

  counts_are_per_peer: >
    backlogCount / watchBacklogCount / deadCount 全部按同一个 JOIN 语义计数：
      backlog = 该 peer 可推的条数（含 ack 行不存在的）
      dead    = 该 peer 的 ack 行 status = 'dead' 的条数
    watchBacklogCount 的 stream 必须在【该 peer 的 ack 行变化时】发射新值 ——
    drift 的 `.watch()` 会自动跟踪被查询表，只要查询里 JOIN 了 t_outbox_peer_ack 就成立；
    若你为了省事改成只查 t_outbox 再在 Dart 里过滤，stream 将【不会】在 ack 变化时发射，
    表现是「云端推完后 LAN 的 backlog 数字不更新」。

  attempt_lives_in_ack_table: >
    `attemptFor` 直接读 t_outbox_peer_ack 的 attempt 列。
    ack 行不存在返回 0。
    t_outbox 上的 attempt 字段【从本 ACT 起不再被更新】——
    它是单 peer 时代的遗留，留着是为了不破坏既有读取点，但 per-peer 的真相在 ack 表。
    在 t_outbox.attempt 的 dartdoc 上写明这一点。

  sync_state_store: >
    DriftSyncStateStore 的五个方法把 peerId 加进 where 条件与主键写入。
    setCursorIfNewer 的「不回退」判定仍按 (scopeUid, peerId, entityType) 那一行做比较 ——
    【不要】跨 peer 比较游标新旧，两个对端的游标本来就不可比。

  sync_coordinator_call_sites: >
    core/lib/core/sync_coordinator.dart:57 与 :74 是 peekBatch / markSuccess 的
    【唯一业务调用点】（已实测：下游 12 个业务仓库没有任何一处引用这两个端口）。
    本 ACT 让它先用一个【单一 peerId】跑通（从构造参数注入，或暂用
    `PeerId('firestore')`），行为与现在完全一致。
    真正的 fan-out 是 ACT 06，【本 ACT 不做】。

  no_schema_changes: >
    【本 ACT 不碰任何建表 / 迁移 / schemaVersion 代码】。schema 已由 ACT 03 全部就位。
    如果你觉得少了一张表或一个列，【停下上报】—— 那说明 ACT 03 漏了，
    应该回去补 ACT 03，而不是在本 ACT 里偷偷加一段迁移。
    有一条 VERIFICATION 专门比对 schemaVersion 与 onUpgrade 段数未变。

CONSTRAINTS:
  - 【不要】给 peerId 加默认值。默认值会让漏传变成静默通过，而编译器是这里唯一可靠的门禁。
  - 【不要】给 enqueue 加 peerId。理由见 SIGNATURE 末尾注释。
  - 【不要】把 peerId 写成 String。ACT 01 定的是 extension type PeerId，
    用 String 会让 peerId 与 scopeUid / entityType 在类型上无法区分（它们都是 String）。
  - 【不要】动 OutboxRecord 的字段。ack 状态不属于记录本身，属于 (记录, 对端) 关系。
  - 【不要】用 INNER JOIN 查 peekBatch。见 peek_batch_join —— 会漏掉所有首次推送的记录。
  - 【不要】用 `ack.status != 'success'` 作为可推条件。NULL 语义会咬人。
  - 【不要】在 enqueue 时预建 ack 行。见 ack_row_creation。
  - 【不要】把 backlog/dead 计数改成"查 t_outbox 再在 Dart 里过滤"。见 counts_are_per_peer。
  - 【不要】跨 peer 比较游标新旧。见 sync_state_store。
  - 【不要】在本 ACT 加 channel 策略过滤。那是 ACT 05；混进来会让两个 ACT 的验收纠缠。
  - 【不要】改任何建表 / 迁移代码。见 no_schema_changes。
  - 【不要】把内存 fake 留在 test 目录下当私有类。见 SIGNATURE.in_memory_stores.dart。
  - 每个改动的公开声明必须更新中文 dartdoc（A12）。

