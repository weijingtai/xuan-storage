  # fail closed：不得出现 "?? true" 之类的默认放行
  - CMD: "grep -nE 'lookup\\([^)]*\\)\\s*\\?\\?|p == null.*return true' drift/lib/persistence_drift.dart core/test/persistence_core_test.dart"
    EXPECT_EXIT: 1
  # S1a 留下的规格文件未被修改
  - CMD: git diff --exit-code main.. -- core/test/policy_channel_filter_test.dart
    EXPECT_EXIT: 0

SELF_CHECK:
  - 把 `if (p == null) return false;` 临时改成 `return true;` →
    `unregistered_entity_type_fails_closed` 必须变红 → 改回。
    **不做这步不算完成本 ACT** —— fail closed 是它的全部意义
  - 把 drift 侧临时改成"先 limit 截断再过滤" →
    `filter_before_limit_no_silent_starvation` 必须变红 → 改回
  - 把 backlogCount 临时改回不过滤 →
    `counts_agree_with_peek_batch` 必须变红 → 改回
  - 把 `policy.channels.contains(channel)` 临时改成
    `channel == Channel.cloud || channel == Channel.lan` →
    `filter_uses_policy_channels_not_hardcoded_enum` 必须变红 → 改回
  - 四次自检后 `git status --porcelain` 必须为空

DONE_WHEN:
  - peekBatch 与三个计数方法都带 channel 且用同一套过滤
  - fail closed 成立：未注册策略的 entityType 对所有通道都不推
  - 先过滤后截断，无静默饥饿
  - 内存 fake 与 drift 实现行为一致（parity 测试通过）
  - 六个测试用例全部存在，四条 SELF_CHECK 已实做并确认能变红
  - policy_channel_filter_test.dart 对 main 零 diff
