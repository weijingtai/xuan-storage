ACT_VERSION: 1
TASK_ID: mimo-storage-s1b-multipeer/09
TITLE: ConflictArbiter —— (hlc, deviceId) 全序仲裁 + 冲突双向可回溯
TYPE: implementation
ORDER: 9
DEPENDS_ON: [mimo-storage-s1b-multipeer/08]
DISPATCH_STATUS: ready
STRONG_MODEL_ONLY: true    # 定序判断写错不报错

OBJECTIVE: >
  §5.2.3：record 主线【没有 LWW，是 RWW】（远端无条件覆盖本地），全文件对
  updatedAt/rev 只有解析、无比较逻辑。本 ACT 交付 `ConflictArbiter` 端口与
  `(hlc, deviceId)` 全序实现，并让 `ChangeApplyOutcome` 能承载
  【被丢弃的那一方】—— 无论丢的是本地还是远端（§5.3 冲突可见化）。

  仲裁纯计算、无 IO。接进 applier 是 ACT 10。

ACT_BASE:
  说明: >
