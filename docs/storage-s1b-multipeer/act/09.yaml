    【开工第一件事】记下不可变基线：

      git rev-parse HEAD > .act-base && cat .act-base

    之后所有 no-touch 检查【逐字】这样写（`$(cat .act-base)` 是可执行的
    shell 命令替换，不是占位符 —— 直接复制粘贴就能跑）：

      git diff --exit-code "$(cat .act-base)"..HEAD -- <路径>

    【不要】用 `HEAD~1` —— 它假设"每个 ACT 恰好一个提交"，
