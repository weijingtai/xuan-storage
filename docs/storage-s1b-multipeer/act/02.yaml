TASK_DETAIL:
  scope_is_exhaustive: >
    上面 MODIFY 列表是【全量】的，由 grep 得出，不要自己再找：
      grep -rn "RemoteGateway\|RegionCapabilities" core/lib core/test drift/test firebase/lib firebase/test
    共 14 个文件（supabase 包不涉及 —— 它只有一个 328 字节的存根，没有 gateway 实现）。
    改完再跑一次这条 grep，除了 `*Gateway` 类名本身，不应再有 `RemoteGateway` 这个标识符。

  class_names_do_not_change: >
    §5.2 命名说明：【类名一个都不改】。
      RemoteGatewayRouter            仍叫 RemoteGatewayRouter
      FirestoreRemoteGateway         仍叫 FirestoreRemoteGateway
      FirebaseRealtimeRemoteGateway  仍叫 FirebaseRealtimeRemoteGateway
    只把 `implements RemoteGateway` 改成 `implements SyncPeer`。
    改类名会连带下游 12 个业务仓库的构造点，而它们【没有】引用这三个类之外的端口
    （已实测），别把这个优势浪费掉。

  peer_id_and_channel: >
    SyncPeer 比 RemoteGateway 多两个 getter（peerId / channel），三个实现都要给出：
      RemoteGatewayRouter            -> 转发给 _active（它是个代理，身份跟随当前 region）
      FirestoreRemoteGateway         -> PeerId('firestore')，Channel.cloud
      FirebaseRealtimeRemoteGateway  -> PeerId('firebase_realtime')，Channel.cloud
    这两个字符串会成为 ACT 03 那张 per-peer ack 表的行键，【定下来就不要再改】——
    改了等于历史 ack 行全部对不上，效果和回填错 peerId 一样。

  get_capabilities_two_errors: >
    两个 firebase 实现【本来就没有】getCapabilities，本 ACT 要新写：
      返回 PeerCapabilities(peerId: <上面定的>, channel: Channel.cloud,
                            entityVersions: ..., supportedFeatures: ..., protocolVersion: ...)
    entityVersions / supportedFeatures / protocolVersion 的取值：
    照 RemoteGatewayRouter 转发的语义与 core 里 RegionCapabilities 既有用法推断，
    【不要凭空发明 feature 名】。当前没有真实后端协商，返回一个诚实的最小值即可
    （例如 entityVersions: const {}、supportedFeatures: const {'outbox_v1'}、
    protocolVersion: 1），并在 dartdoc 里写明「当前为静态值，待后端协商接口就绪后改为真实上报」。
    【不要】抛 UnimplementedError —— 那会让 SyncRuntime 的 feature gating 在运行时炸。

  region_capabilities_disposition: >
    删掉 RemoteGateway 后检查 RegionCapabilities（types.dart:444）是否还有消费者。
    - 若无消费者：【不要删】。它是公开 API，删除属于破坏性变更，超出本 ACT 范围；
      加一行 dartdoc 注明「S1b 后由 PeerCapabilities 取代，保留待清理」即可。
    - 若仍有消费者：原样不动。

  boundary_test_path_fix: >
    firebase/test/account/firebase_account_boundary_test.dart 的 :35 与 :56：
      Directory('../../repository-interface-account/lib')
      Directory('../../xuan-account/lib')
    在主工作区正确，在 worktree（深两级）找不到。
    【不要】改成 `../../../../` —— 那只是把错误挪个位置，主工作区反过来会坏。
    正确做法：从 Directory.current 逐级向上找，直到某一级目录下同时存在
    `repository-interface-account` 与 `xuan-account`，以那一级为基准拼路径；
    向上找到文件系统根仍未命中才 fail。
    这样主工作区与任意深度的 worktree 都成立。
    【只改这两处的定位方式，断言逻辑一个字不动】——
    这两条测试守的是「Firebase SDK 不得泄漏进 account 层」，那个语义不属于本 ACT。

CONSTRAINTS:
  - 【不要】改任何类名。见 class_names_do_not_change。
  - 【不要】保留 RemoteGateway 作为 deprecated 别名。它与 SyncPeer 的 getCapabilities
    返回类型不同，typedef 别名做不到；留一个空壳抽象类只会让下一个人不知道该实现哪个。
  - 【不要】在本 ACT 做 fan-out。RemoteGatewayRouter 仍是 1-of-N 选择器，
    改造成 fan-out 是 ACT 06。本 ACT 只换接口，行为一个字不变。
  - 【不要】用 `../../../../` 修边界测试。见 boundary_test_path_fix。
  - 【不要】动 firebase 那 17 个 WARNING 与 19 个 INFO。本 ACT 只清 ERROR 与 4 个失败测试；
    顺手清理别的会让 diff 混浊，审查时分不清哪些是迁移哪些是打扫。
  - 每个新增公开声明必须有中文 dartdoc（A12）。

TESTS_FIRST:
  CASES:
    - NAME: no_remote_gateway_identifier_left_anywhere
      FILE: core/test/s1b_migration_guard_test.dart
      BEHAVIOR: >
        以纯文本扫描 core/lib、core/test、drift/test、firebase/lib、firebase/test 下的全部
        .dart 文件，断言【不存在】标识符 `RemoteGateway` 单独出现
        （正则要排除 `RemoteGatewayRouter` / `FirestoreRemoteGateway` /
        `FirebaseRealtimeRemoteGateway` 这三个保留类名，用 `\bRemoteGateway\b(?!Router)`
        之类的写法，并对三个类名做显式白名单）。
        失败时打印 文件:行号 与该行内容。
        【必须同时断言扫描到的文件总数 >= 一个写死的下限】——
        没有下限，glob 写错导致一个文件都没扫到时门禁会静默全绿（S1a 的教训）。
      RED_COMMAND: cd core && flutter test test/s1b_migration_guard_test.dart
      RED_EXPECT: 断言失败并列出仍在引用 RemoteGateway 的文件，退出码非 0
      COVERS: [A12]

    - NAME: three_implementors_are_sync_peer_with_stable_ids
      FILE: core/test/s1b_migration_guard_test.dart
      BEHAVIOR: >
        构造 RemoteGatewayRouter（注入两个 fake SyncPeer），断言：
        - `router is SyncPeer` 为 true；
        - `router.peerId` 与 `router.channel` 转发自当前 region 对应的那个 peer
          （切换 currentRegion 后两个值随之改变 —— 证明它是代理而不是硬编码）。
        再断言两个 firebase 实现的 peerId 字面量【逐字】等于
        'firestore' 与 'firebase_realtime'（以纯文本读源文件断言，不构造实例 ——
        构造 Firestore 实例需要真实 SDK 初始化）。
        这两个字符串是 ACT 03 ack 表的行键，改了会让历史 ack 全部对不上，
        所以要有一条测试把它们钉死。
      RED_COMMAND: cd core && flutter test test/s1b_migration_guard_test.dart
      RED_EXPECT: 编译失败（router 尚未 implements SyncPeer），退出码非 0
      COVERS: [A11]

    - NAME: get_capabilities_never_throws
      FILE: core/test/s1b_migration_guard_test.dart
      BEHAVIOR: >
        非 happy-path。对 RemoteGatewayRouter 与两个 fake SyncPeer 调 getCapabilities()，
        断言返回 PeerCapabilities 且【不抛异常】。
        再断言返回值的 peerId 与该实现的 peerId 一致（不是随便填的）。
        写成 `throw UnimplementedError()` 会让 SyncRuntime 的 feature gating 在
        运行时炸而不是编译期报错 —— 这条守的就是那个。
      RED_COMMAND: cd core && flutter test test/s1b_migration_guard_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A11]

    - NAME: router_still_selects_one_of_n_not_fanout
      FILE: core/test/s1b_migration_guard_test.dart
      BEHAVIOR: >
        行为不变守卫。注入两个计数式 fake SyncPeer（记录 push 调用次数，
        【不要用 fail()】—— 若调用方有 catch-all 会被吞掉，S5c 的教训），
        currentRegion 指向其中一个。调 router.push 一次，断言：
        - 被指向的那个 peer 的 pushCount == 1；
        - 另一个的 pushCount == 【0】。
        本 ACT 只换接口不改行为；写成 fan-out 会让这条变红 ——
        fan-out 是 ACT 06 的事，提前做会让两个 ACT 的验收互相污染。
      RED_COMMAND: cd core && flutter test test/s1b_migration_guard_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A11]

    - NAME: firebase_boundary_test_locates_repos_from_any_depth
      FILE: firebase/test/account/firebase_account_boundary_test.dart
      BEHAVIOR: >
        改造既有的两条边界测试（:35 / :56），使其从 Directory.current 逐级向上
        定位容器目录。改完后【在 worktree 里】跑必须通过。
        额外加一条：断言定位函数在找不到时返回 null 而不是抛异常，
        且此时测试给出的失败信息里包含它【实际搜索过的起点路径】——
        否则下一个人看到 "not found" 完全不知道它在哪儿找的（现在就是这样）。
      RED_COMMAND: cd firebase && flutter test test/account/firebase_account_boundary_test.dart
      RED_EXPECT: 两条测试因 `../../` 找不到目录而失败（这是【现状】，先确认它确实红）
      COVERS: [A2]

