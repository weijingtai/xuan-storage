  把 ACT 01 造好的 SyncPeer 真正接上：删掉 RemoteGateway，三个实现者全部改口，
  getCapabilities 返回 PeerCapabilities（§5.2.1 阻断点 6）。
  顺带修掉 firebase 包两个【既有】ERROR 与两个【既有】路径失败测试 ——
  它们不是你弄坏的，是本任务把 firebase 挂上本地 core 之后才显形的，见 PRE_EXISTING_STATE。

PRE_EXISTING_STATE: >
  ⚠ 开工前先读这一段，否则你会以为是自己搞坏的。

  firebase 包的 pubspec.yaml 走 Gitea 拿 persistence_core，钉在 bc7f91d（= gitea/main）。
  本地 main 超前 27 个提交且未推送，那 27 个提交里装着整个 S1a，也包含
  「给 RemoteGateway 加 getCapabilities()」这个改动。于是 firebase 一直编译的是
  【没有 getCapabilities 的旧 core】，两个实现类没跟上也不会报错 —— 藏了很久。

  本任务的 worktree 已通过 firebase/pubspec_overrides.yaml（gitignored）把
  persistence_core 指向本地 ../core，真相因此显形。你会看到的起点是：

    cd firebase && dart analyze  → 38 issues（2 ERROR / 17 WARNING / 19 INFO），退出码 3
      ERROR ①  firebase/lib/persistence_firebase.dart
               Missing concrete implementation of 'RemoteGateway.getCapabilities'
      ERROR ②  firebase/lib/firebase_realtime_remote_gateway.dart
               同上
    cd firebase && flutter test  → 100 通过 / 3 跳过 / 4 失败，退出码 1
      失败 ①②  fake_persistence_test.dart / persistence_firebase_test.dart
               —— Failed to load，是上面两个 ERROR 的连带
      失败 ③④  test/account/firebase_account_boundary_test.dart:35 与 :56
               —— `Directory('../../repository-interface-account/lib')` 在 worktree
                  里深两级找不到，与 core 无关，是【路径写法】的问题

  本 ACT 要把这四个失败全部清零。**这是收紧，不是降低口径。**

