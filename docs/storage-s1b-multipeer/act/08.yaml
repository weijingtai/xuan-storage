REVISION: >
  2026-08-03: HLC 实现库由 hlc_dart 1.1.0+2 更换为 crdt: ^5.1.3（作者 cachapa），
  仅使用其 Hlc 类。理由：hlc_dart 的 HLC 只有 (l, c)、没有 nodeId，同毫秒并发写
  判 isConcurrentWith == true，与 S1b 设计裁定「冲突定序改用 HLC + deviceId」
  （commit cd064c6）相悖 —— 用一个没有 nodeId 的库实现带 nodeId 的全序，
  等于要在包外面再自己包一层，而那层正是本 ACT 标 STRONG_MODEL_ONLY 的原因：
  因果时钟的退化路径全部是静默的，写错了测试照样绿。crdt 的 Hlc 内建 nodeId
  且 compareTo 全序内建（先比 dateTime、再比 counter、再比 nodeId）。
  架构不变：仍是 HLC + deviceId 全序 + LWW，不引入 CRDT 数据结构、不改 drift
  表模型、不换 record/oplog 语义。nodeId 一律取 DeviceIdentity.deviceId。
  Hlc.parse / toString 串格式已在本 ACT 写死成规格（见
  TASK_DETAIL.hlc_wire_format_spec），ACT 11 的线上格式 golden 测试照此断言。
  （依据：hlc_dart 发布于 2026-07-19 只有两周大；crdt 是 sqlite_crdt 的底座，
  生产验证过。）

ACT_VERSION: 1
TASK_ID: mimo-storage-s1b-multipeer/08
TITLE: HLC 接线 —— crdt·Hlc 引入 + 时钟持久化 + 戳边表 + 三节点属性测试
TYPE: implementation
ORDER: 8
DEPENDS_ON: [mimo-storage-s1b-multipeer/07]
DISPATCH_STATUS: ready
STRONG_MODEL_ONLY: true    # 因果时钟：退化路径【全部是静默的】，测试照样绿

OBJECTIVE: >
  给冲突仲裁准备一个【不依赖墙上时钟的正确排序】。
  本 ACT 交付：crdt ^5.1.3 依赖（仅用其 Hlc 类）、跨重启持久化的本地时钟、
  存戳的 drift 边表、RemoteChange 上的可空 hlc/deviceId，以及三节点仿真属性测试。
  仲裁逻辑本身是 ACT 09，本 ACT 只负责"戳是对的、戳存得住、戳传得到"。

WHY_STRONG_MODEL: >
  ⚠ HLC 的每一条退化路径都【不报错】：
  · 只调 localEvent 不调 receiveEvent → 因果性整个消失，退化成墙上时钟，所有单测照样绿
  · 时钟不持久化 → 重启后从物理时间重来，单调性断裂，看不出来
  · 戳与记录分事务写 → 偶发失准，重现不了
  这就是为什么本 ACT 的核心交付不是"调用 crdt 的 Hlc"，而是【属性测试】——
  它是唯一能自动生成上千个反例的裁判。

BACKGROUND: >
  人类 2026-08-02 设计裁定（见纪要「决定记录」），经四个候选实测比选：
    drift_crdt   —— 装不上（依赖 sql_crdt/sqlite_crdt ^4.0.0，pub.dev 最高 3.x）
    Ditto        —— 闭源商业，初始化要 Portal 账号，纯离线 SharedKey 需申请许可
    sql_crdt     —— 抽象层可用 drift 后端，但 200 个写调用点要改裸 SQL + 全局软删
    crdt_lf      —— 质量最高（160/160）但为协同文档编辑而生，需双写 + 升 drift 到 2.34

  **2026-08-03 换库裁定（REVISION）**：曾选 hlc_dart 1.1.0+2（零第三方依赖，
  160/160），但它的 HLC 没有 nodeId —— 只有 (l, c) 两个字段，两台设备同毫秒写
  会判 `isConcurrentWith == true`。而 S1b 的设计裁定是「冲突定序改用 HLC + deviceId」，
  用一个没有 nodeId 的库去实现带 nodeId 的全序，等于要在包外面再自己包一层 ——
  而那一层正是本 ACT/ACT 09 标 STRONG_MODEL_ONLY 的原因：因果时钟的退化路径
  全部是静默的，写错了测试照样绿。故改选 **crdt: ^5.1.3**（作者 cachapa，
  内建 HLC，是 sqlite_crdt 的底座、生产验证过）。只用它的 Hlc 类，
  nodeId 内建、compareTo 全序内建。

  ⚠ 关键澄清：**crdt 的 Hlc 本身携带 nodeId 且是全序的**。`Hlc.compareTo`
  先比 dateTime、再比 counter、再比 nodeId —— 两台设备即使同一物理毫秒写，
  也能比出确定胜负（nodeId 决胜）。这与"墙上时钟"有本质区别：
  Hlc 是因果时钟（B 收到过 A ⇒ B 必 > A），消灭【因果倒置】，把"随机丢数据"
  降级为"并发时按固定规则选一个"。nodeId 一律取 `DeviceIdentity.deviceId`
  （core/lib/model/ports.dart:240），不另造 id 体系。
  真并发谁更晚物理上不可判定，由 §5.3 冲突可见化兜底（ACT 09/10）。

