ACT_VERSION: 1
TASK_ID: mimo-storage-s1b-multipeer/08
TITLE: 修 canAdvanceCursor 恒真 + 把 ConflictArbiter 接进 RecordLocalApplier
TYPE: bugfix
ORDER: 10
DEPENDS_ON: [mimo-storage-s1b-multipeer/07]
DISPATCH_STATUS: ready
STRONG_MODEL_ONLY: false

OBJECTIVE: >
  §5.2.3 指出的两个既有缺陷，本 ACT 一次修掉：
  ① `record_local_applier.dart:60-61` 的成功路径 `canAdvanceCursor: true` 【恒为真】——
     某条 change 应用失败被记为 failed 时，`sync_coordinator.dart:382` 的守卫不触发，
     **游标照常推进，那条变更永久丢失**；
  ② 全文件对 updatedAt/rev 只有解析、没有任何比较逻辑 —— record 主线是 RWW
     （远端无条件覆盖本地），不是 LWW。ACT 07 已备好仲裁器，本 ACT 接上。

PRE_EXISTING_STATE: >
  这两个都是【既有缺陷】，不是本任务改坏的。现状（已核实）：

    drift/lib/sync/record_local_applier.dart
      :19-27  entityType 不匹配时返回 canAdvanceCursor: false —— 这条是对的
      :33-50  成功路径：applied++ 并记 ChangeApplyDecision.applied
      :51-57  catch 路径：记 ChangeApplyDecision.failed（但不影响返回值）
      :60-61  return LocalApplyResult(canAdvanceCursor: true, ... lastError: null)
              ^^^^ 无论 outcomes 里有没有 failed，都是 true，lastError 恒为 null

    core/lib/core/sync_coordinator.dart:382
      if (!applyResult.canAdvanceCursor || applyResult.lastError != null) { ... }
      ^^^^ 守卫写得没错，只是永远不触发

  单 gateway 下这已是缺陷；多 peer 下丢失概率线性放大（§5.2.3 原文）。

SCOPE:
  READ:
    - docs/superpowers/specs/2026-07-31-storage-architecture-design.md
      # §5.2.3 全节，尤其「游标照常推进，那条变更永久丢失」那两行
    - core/lib/model/conflict_arbiter.dart      # ACT 07 的 LamportStamp / ConflictArbiter
    - core/lib/model/types.dart
      # LocalApplyResult:353（canAdvanceCursor / lastError 的语义）
      # ChangeApplyOutcome:322（含 ACT 07 新增的 overwrittenPayloadJson / overwrittenStamp）
      # ChangeApplyDecision:285 / SkipReasonCode:301
      # RemoteChange:232（含 ACT 06b 新增的可空 rev / deviceId）
    - core/lib/core/sync_coordinator.dart       # :382 守卫，本 ACT 不改它，只让它真的能触发
    - drift/lib/sync/record_local_applier.dart  # 全文 107 行
    - drift/test/sync/record_local_applier_test.dart  # 既有测试的写法
  MODIFY:
    - drift/lib/sync/record_local_applier.dart
    - drift/test/sync/record_local_applier_test.dart   # 既有断言若依赖恒真行为，需更新
  WRITE:
    - drift/test/sync/record_local_applier_conflict_test.dart

TASK_DETAIL:
  cursor_rule: >
    正确规则：**只要 outcomes 里存在任何一条 `ChangeApplyDecision.failed`，
    canAdvanceCursor 就必须为 false，且 lastError 非 null。**

    理由：游标推进意味着"这一页我处理完了，下次从后面拉"。
    有一条没应用成功却推进游标，那条变更就再也不会被拉到 —— 永久丢失。
    宁可下次重拉整页（幂等，代价是一点流量），也不能丢。

    `skipped` 【不阻止】游标推进 —— skipped 是"有意不应用"（已应用过、更旧、
    被仲裁判为 keepLocal），不是失败。把 skipped 也算进去会让游标永远卡在
    第一个被仲裁拒绝的位置上，同步彻底停摆。这个区分是本 ACT 最容易写反的地方。

  arbitration_wiring: >
    在应用每条 change 前先仲裁：
      1. 从 change 取 (rev, deviceId) 构造 remote LamportStamp
         —— 两者可空，按 ACT 07 定的降级规则处理（rev null → 0；deviceId null → 视为最小）；
      2. 取本地当前版本的 LamportStamp。**本地版本从哪来是本 ACT 要解决的**：
         RecordMeta 里若已有 rev/deviceId 字段就用；若没有 →
         【停下上报】，不要往 RecordMeta 加字段（那是 repository-interface-record
         仓库的事，跨仓库改动超出本 ACT）。降级方案见 fallback_when_local_stamp_missing。
      3. arbitrate 结果：
         takeRemote → 正常应用，并把【被覆盖的本地 payload 与 stamp】填进
                      ChangeApplyOutcome 的两个新字段（§5.3 冲突可见化）；
         keepLocal  → 记 decision: skipped、reason 用一个表达"被仲裁拒绝"的
                      SkipReasonCode（先看 SkipReasonCode:301 有没有合适的；
                      没有就用最接近的并在 message 里写明，【不要】往那个 enum 加值 ——
                      它是公开 API）；
         identical  → 记 skipped，不写库。

  fallback_when_local_stamp_missing: >
    若 RecordMeta 拿不到本地 rev/deviceId：
    本 ACT 仍然要交付「① canAdvanceCursor 修复」与「② 仲裁器接线的骨架」，
    但仲裁降级为"本地 stamp 不可得 → takeRemote"（即维持现状 RWW），
    并在 ChangeApplyOutcome 的 message 里标注降级原因。
    这样 ACT 08 的第一个目标（游标缺陷）不被第二个目标（仲裁）阻塞。
    降级这件事【必须写进纪要「决定记录」】并作为 S3a 的前置待办，
    否则"仲裁器接上了但其实没生效"会被当成已完成。

  no_coordinator_changes: >
    【不改 sync_coordinator.dart】。:382 的守卫写得是对的，问题在于它永远不触发。
    本 ACT 让它真的能触发即可。改守卫会让"applier 报错了没"与
    "coordinator 拦住了没"两件事混在一起，出问题时无法归因。

CONSTRAINTS:
  - 【不要】让 skipped 阻止游标推进。见 cursor_rule 末段 —— 会让同步彻底停摆。
  - 【不要】改 sync_coordinator.dart。见 no_coordinator_changes。
  - 【不要】往 SkipReasonCode 或 RecordMeta 加字段。前者是公开 API，
    后者在另一个仓库（repository-interface-record）。需要就停下上报。
  - 【不要】在 catch 路径里吞掉异常后仍返回 canAdvanceCursor: true。那就是现在的 bug。
  - 【不要】把 lastError 填成一个笼统的 'some changes failed'。
    要带上【第一条失败的 operationId 与原始错误】，否则线上排查时
    只知道"有东西失败了"却不知道是哪条。
  - 每个改动的公开声明必须更新中文 dartdoc（A12）。

TESTS_FIRST:
  CASES:
    - NAME: failed_change_blocks_cursor_advance
      FILE: drift/test/sync/record_local_applier_conflict_test.dart
      BEHAVIOR: >
        【本 ACT 的生死线 —— 直接对应 §5.2.3「那条变更永久丢失」】。
        构造 3 条 change，让【中间那条】的 applyRecord 抛异常（注入的回调里抛）。
        断言返回的 LocalApplyResult：
        - `canAdvanceCursor` 为 【false】；
        - `lastError` 【非 null】，且其 message 里含【那条失败 change 的 operationId】；
        - `appliedCount` 为 2（另外两条确实应用了 —— 一条失败不该中断整批）；
        - outcomes 里恰好一条 decision 为 failed。
        当前实现这条会红（恒真 true / lastError 恒 null）。
      RED_COMMAND: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
      RED_EXPECT: 断言失败（canAdvanceCursor 恒为 true），退出码非 0
      COVERS: [A10]

    - NAME: skipped_change_does_not_block_cursor_advance
      FILE: drift/test/sync/record_local_applier_conflict_test.dart
      BEHAVIOR: >
        【与上一条方向相反，必须同时成立】。构造 3 条 change，
        让其中一条被仲裁判为 keepLocal（记 skipped），其余正常应用。
        断言 `canAdvanceCursor` 为 【true】。
        写成"有任何非 applied 就不推进"时这条会红 ——
        而那种写法会让游标永远卡在第一个被仲裁拒绝的位置，同步彻底停摆。
        这是本 ACT 最容易写反的地方，两条测试必须成对存在。
      RED_COMMAND: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
      RED_EXPECT: 断言失败，先红
      COVERS: [A10]

    - NAME: all_success_still_advances_cursor
      FILE: drift/test/sync/record_local_applier_conflict_test.dart
      BEHAVIOR: >
        回归守卫：全部应用成功时 canAdvanceCursor 为 true、lastError 为 null。
        修 bug 时把条件写反（变成"恒 false"）会让同步完全不前进，
        而那种错误在只测失败路径的情况下不会被发现。
      RED_COMMAND: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
      RED_EXPECT: 断言失败或编译失败，先红
      COVERS: [A10]

    - NAME: entity_type_mismatch_still_blocks_advance
      FILE: drift/test/sync/record_local_applier_conflict_test.dart
      BEHAVIOR: >
        回归守卫：传一个不匹配的 entityType，断言仍返回 canAdvanceCursor: false
        （applier.dart:19-27 的既有行为是对的，不能被本 ACT 改坏）。
        改 canAdvanceCursor 的计算方式时很容易把这个早退分支一并重写掉。
      RED_COMMAND: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
      RED_EXPECT: 断言失败或编译失败，先红
      COVERS: [A10]

    - NAME: arbiter_keep_local_records_skipped_not_applied
      FILE: drift/test/sync/record_local_applier_conflict_test.dart
      BEHAVIOR: >
        注入一个恒返回 keepLocal 的 fake ConflictArbiter。断言：
        - 注入的 applyRecord 回调【一次都没被调用】（用计数式 fake 记录调用次数，
          【不用 fail()】—— applier 里有 catch-all 会吞掉 TestFailure）；
        - outcome 的 decision 为 skipped；
        - `appliedCount` 为 0。
        证明仲裁真的挡在写库之前，而不是"写完再说"。
      RED_COMMAND: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
      RED_EXPECT: 编译失败（applier 尚不接受 arbiter），退出码非 0
      COVERS: [A8]

    - NAME: take_remote_captures_overwritten_payload
      FILE: drift/test/sync/record_local_applier_conflict_test.dart
      BEHAVIOR: >
        注入恒返回 takeRemote 的 fake arbiter，本地已有一个可辨识的旧 payload。
        断言应用后的 ChangeApplyOutcome：
        - `overwrittenPayloadJson` 【等于那份旧 payload】（不是 null、不是新 payload）；
        - `overwrittenStamp` 非 null。
        §5.3 要求"冲突时保留被覆盖的版本并使其对用户可见可回溯"。
        字段存在但从不填值，是这类需求最常见的落地失败方式 ——
        看起来做了，实际上用户永远看不到自己丢了什么。
      RED_COMMAND: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A9]

VERIFICATION:
  - CMD: cd drift && dart analyze --fatal-infos lib/sync/record_local_applier.dart
    EXPECT_EXIT: 0
  - CMD: cd drift && flutter test test/sync/record_local_applier_conflict_test.dart
    EXPECT_EXIT: 0
  - CMD: cd drift && flutter test
    EXPECT_EXIT: 0
  - CMD: cd core && flutter test
