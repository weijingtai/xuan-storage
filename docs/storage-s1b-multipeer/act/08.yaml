    - NAME: remote_change_hlc_fields_are_nullable
      FILE: core/test/s1b_hlc_property_test.dart
      BEHAVIOR: >
        构造一个【不传】 hlcPacked 与 deviceId 的 RemoteChange，
        断言能编译且两者为 null；再构造传了值的，断言读回正确，
        且既有七个字段逐个未受影响。
        加 required 会让两个 firebase gateway、core 的 fake、
        drift 的多处测试同时编译失败 —— 计划外的破坏。
      RED_COMMAND: cd core && flutter test test/s1b_hlc_property_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A8]

    - NAME: frozen_stamps_are_deterministic_and_contain_concurrent_pairs
      FILE: core/test/s1b_hlc_property_test.dart
      BEHAVIOR: >
        【守住 ACT 09 收敛性测试的前提】（Codex R5 · P0-1 的交接点）。
        对 generateFrozenStamps（见 TASK_DETAIL.frozen_stamps_for_act09）断言：
          ① **确定性**：同一 seed 调用两次，输出逐条相同
             （字段级比较，不是 length 相等就算过）
          ② **含并发对**：存在至少一对【同一物理毫秒、不同 nodeId】的戳 ——
             【2026-08-03 换库修订】：crdt 下 Hlc 内建 nodeId，
             不再可能"hlc 相等而 deviceId 不同"（Hlc 相等 = 三个字段全等 =
             nodeId 也相等）。并发对的判据相应改为：dateTime 相同（同一毫秒）、
             nodeId（deviceId）不同，胜负完全由 nodeId 决出 —— 这仍能
             制造"物理上无法判定先后"的真并发，是收敛性测试的命根子。
             没有并发对，ACT 09 那条就退化成"给一列全序值排序"，什么都证明不了
          ③ **多实体**：entityId 的去重数 >= 3（收敛性是"每个实体各自收敛"）
          ④ 数量 >= 50
        用 Random(seed) 而非 Random()；② 若因 seed 不巧不成立，
        **换 seed 直到成立并把该 seed 写死**，不要放宽断言。
      RED_COMMAND: cd core && flutter test test/s1b_hlc_property_test.dart
      RED_EXPECT: 编译失败（generateFrozenStamps 不存在），先红
      COVERS: [A8]

