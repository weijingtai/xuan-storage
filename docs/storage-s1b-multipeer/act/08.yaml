ON_FAIL:
  - RED 阶段测试没红（写完实现前就绿）→ 说明测试没真正依赖新类型，
    停下重写测试，不要继续
  - 属性测试偶发失败（换 seed 就绿）→ **这是真 bug 不是 flaky**，
    HLC 的单调性与因果性在任何事件序列下都必须成立。记下失败 seed 并定位，
    【不要】加重试、不要放宽断言
  - 用例偶发失败 → 同上，单调性与因果性对任意事件序列都必须成立
  - v7→v8 迁移测试失败 → 优先怀疑漏建表而非漏搬数据（本 ACT 是纯建表），
    逐字段比对旧行
  - core / drift 既有测试变红 → 立即停下。本 ACT 只加不改，
    既有测试变红说明动到了不该动的地方
  - 【换库相关】crdt 依赖装不上 / API 对不上（如 Hlc 没有预期的构造或方法）
    → 以本 ACT 的 SIGNATURE 与实测源码为准核对，不要退回 hlc_dart
  - 连续两次修不好同一条 → 在纪要「决定记录」写下现象与已排除的可能，停下上报

