SIGNATURE:
  hlc_clock.dart: |
    import 'package:crdt/crdt.dart' show Hlc;
    // 只 import Hlc（crdt 主库通过 src/hlc.dart 导出，实测 `lib/crdt.dart`）。
    // 本包内的 Crdt / MapCrdt / LWWMapCrdt / Changeset 一律不碰（见 FORBID）。

    /// 本设备的 HLC 时钟。跨重启持久化，单调不回退。
    ///
    /// 【两条规则】（crdt 的 Hlc 已实现，本类只负责持久化与调用纪律）：
    /// · 本地写入 [tick]：Hlc.increment() —— l = max(旧 l, 物理时间)；l 未变则 c++，变大则 c = 0
    /// · 收到远端 [observe]：Hlc.merge(remote) —— l = max(本地 l, 远端 l, 物理时间)
    ///   ——【收一次别人的东西，自己的钟就被顶上去一次】，这是因果性的全部来源
    ///
    /// ⚠ crdt 的 Hlc 是【不可变】的（increment / merge 都返回新实例），
    /// 本类的实现必须把合并结果存回内部状态，不能只调用不保存。
    abstract interface class HlcClock {
      /// 本地发生一次写入，返回新的戳。
      ///
      /// nodeId 一律取 [deviceId]（= DeviceIdentity.deviceId），不许另造 id 体系。
      Future<Hlc> tick();

      /// 观测到一个远端戳，把本地时钟顶上去（内部走 Hlc.merge）。
      ///
      /// 【必须在每一条入站变更上调用】。漏调不会报错，
      /// 只会让因果性静默消失 —— 属性测试的第 ② 条就是守这个的。
      ///
      /// ⚠ crdt 的 merge 在遇到相同 nodeId 时会抛 DuplicateNodeException；
      /// 真实网络里 nodeId 即 deviceId，不会相同。测试若构造相同 nodeId
      /// 的时钟，属预期报错，不是 bug。
      Future<void> observe(Hlc remote);

      /// 当前戳（只读，不推进）。
      Hlc get current;

      /// 本设备标识，作为 Hlc.nodeId（也是 HLC 相等时的决胜位，crdt 内建）。
      String get deviceId;
    }

    /// 时钟状态的持久化端口。实现由 drift 提供（与 t_entity_stamp 同一次 v8 迁移）。
    ///
    /// 不持久化的后果：重启后 l 从物理时间重来，若期间时钟被回拨，
    /// 新写入的戳会小于重启前的戳 —— 单调性断裂，且没有任何报错。
    ///
    /// 存储时把 Hlc 转成【规格化串】落库（见 TASK_DETAIL.hlc_wire_format_spec），
    /// 读回时用 Hlc.parse 还原 —— 禁止把 Hlc 对象本身或自定义字段布局落库。
    abstract interface class HlcClockStore {
      /// 读回上次退出时的时钟；从未存过返回 null。
      Future<Hlc?> load();

      /// 落盘当前时钟（以规格化串格式）。
      Future<void> save(Hlc clock);
    }

  types.dart RemoteChange 增加: |
    /// 产生该变更的 HLC 戳（因果序，§5.2.3）。
    ///
    /// 线上格式见 TASK_DETAIL.hlc_wire_format_spec（ACT 08 钉死，
    /// 与 docs/storage-s1b-multipeer/HLC-WIRE-FORMAT.md（ACT 11 产出）同一规格）：
    /// 48 位 l + 16 位 c 打包成 int64，`(l << 16) | c`（l = UTC 毫秒，c = Hlc.counter）。
    /// 可空：历史 oplog 条目没有这个字段。
    final int? hlcPacked;

    /// 产生该变更的设备标识（HLC 相等时的决胜位，= Hlc.nodeId）。
    ///
    /// 【2026-08-03 换库】crdt 的 Hlc 内建 nodeId，nodeId 一律取本字段值
    /// （= DeviceIdentity.deviceId）。可空：历史 oplog 条目没有这个字段。
    final String? deviceId;

  persistence_drift.dart 新增: |
    /// 每个实体当前版本的 HLC 戳（边表）。
    ///
    /// 【为什么用边表而不是往 RecordMeta 加字段】：RecordMeta 在
    /// repository-interface-record 仓库，改它要连带下游 12 个业务仓库。
    /// 边表让 S1b 完全留在 xuan-storage 内，所有 Data class 零改动。
    ///
    /// 代价：戳与记录不在同一行，【必须同事务写入】（A13 门禁守着）。
    @DataClassName('EntityStampRow')
    class EntityStamps extends Table {
      @override
      String get tableName => 't_entity_stamp';

      /// 所属账号作用域。
      ///
      /// ⚠ **主键里必须有它**（Codex R2）。本库里所有同步侧的表
      /// （t_outbox / t_sync_state）都以 scope_uid 分片；戳表少了这一维，
      /// 两个账号下 entityId 相同的实体会【共用同一行戳】——
      /// 切换账号后仲裁读到的是另一个账号的版本坐标，于是要么无脑覆盖、
      /// 要么无脑丢弃，而且不报错。
      TextColumn get scopeUid => text().named('scope_uid')();

      TextColumn get entityType => text().named('entity_type')();
      TextColumn get entityId => text().named('entity_id')();

      /// HLC 打包值 `(l << 16) | c`。有效范围与溢出行为见 ACT 11 的线上格式规格。
      IntColumn get hlcPacked => integer().named('hlc_packed')();

      /// 写入该版本的设备。HLC 相等时的决胜位。
      TextColumn get deviceId => text().named('device_id')();

      @override
      Set<Column> get primaryKey => {scopeUid, entityType, entityId};
    }

    /// 本设备 HLC 时钟的持久化状态（单行表）。
    ///
    /// 【为什么是单行表而不是 key-value】：时钟是设备级的唯一状态，
    /// 用固定主键的单行表，读写各一条语句，且不可能出现"存了两份钟"。
    @DataClassName('HlcClockStateRow')
    class HlcClockStates extends Table {
      @override
      String get tableName => 't_hlc_clock_state';

      /// 固定为 0。单行表的哨兵主键 —— 有 CHECK 约束保证只可能有一行。
      IntColumn get id =>
          integer().withDefault(const Constant(0)).named('id')();

      /// 上次退出/上次 tick 时的 HLC 打包值。
      IntColumn get hlcPacked => integer().named('hlc_packed')();

      /// 本设备标识。与 [DeviceIdentity.deviceId] 一致。
      TextColumn get deviceId => text().named('device_id')();

      /// 最后一次落盘时间，仅供诊断，【不参与定序】。
      DateTimeColumn get savedAtUtc => dateTime().named('saved_at_utc')();

      @override
      Set<Column> get primaryKey => {id};

      @override
      List<String> get customConstraints => const ['CHECK (id = 0)'];
    }

  persistence_drift.dart 同事务写入接口: |
    /// 在【同一个 drift 事务】里写业务记录并更新它的 HLC 戳。
    ///
    /// 【A13 的生产落地点】（Codex R2：v2 只有测试意图，没有可调用的接口，
    /// 于是"同事务"这个要求在生产代码里没有任何着力点）。
    ///
    /// [write] 是业务写入回调，在事务内执行；它抛出时整个事务回滚，
    /// 戳与记录【一起】不落盘。调用方【不得】自己开事务再调本方法。
    ///
    /// ACT 10 的 applier 必须走这个方法，不许自己 `transaction(() { ... })`
    /// 里分别调两次 —— 那样写法上看着也在一个事务里，但戳的更新会散落在
    /// applier 的多个分支中，漏掉一个分支不报错。
    Future<void> applyWithStamp({
      required String scopeUid,
      required String entityType,
      required String entityId,
      required int hlcPacked,
      required String deviceId,
      required Future<void> Function() write,
    });

  persistence_drift.dart 戳读取接口: |
    /// 读取某个实体当前的 HLC 戳；边表里没有该行时返回 null。
    ///
    /// 【ACT 10 的 applier 靠它拿"本地版本"参与仲裁】（Codex R3 · P0-1：
    /// v3 只给了写入接口 applyWithStamp，没有读取接口，
    /// 于是 ACT 10 要求的"读本地 stamp 再仲裁"在生产代码里没有通道，
    /// 执行者只能自己去测试里裸查表 —— 那不是生产接线）。
    ///
    /// 返回 null 有【两种现实】且本方法【区分不了】：
    ///   ① 本地压根没有这个实体
    ///   ② 本地有实体，但边表还没有它的戳（v8 迁移前写入的历史数据）
    /// 这个区分【必须由调用方做】—— ACT 10 的 applier 结合
    /// 本地实体是否存在来判定，见 ACT 09 的
    /// TASK_DETAIL.local_null_is_ambiguous_by_design 与 ACT 10 的对应用例。
    Future<EntityStampRow?> getEntityStamp({
      required String scopeUid,
      required String entityType,
      required String entityId,
    });

TASK_DETAIL:
  frozen_stamps_for_act09: >
    【本 ACT 与 ACT 09 的数据交接点】（Codex R5 · P0-1）。
    收敛性测试**不在本 ACT**（本 ACT 没有生产仲裁器，测了只能是
    测试辅助代码自证），但它需要的【一组冻结的 (hlc, deviceId) 版本】
    是本 ACT 的 3 节点仿真产物。所以本 ACT 负责把生成器**做成可复用的**：

    在 `core/test/s1b_hlc_property_test.dart` 里把仿真产出提取为
    一个**可被其它测试文件 import 的顶层函数**（放
    `core/lib/test_support/` 下，与 ACT 04 抽出的内存 fake 同一位置）：

      /// 用 3 节点 HLC 仿真生成一组【确定性的】版本戳，供收敛性测试复用。
      /// [seed] 固定时输出完全一致，便于失败复现。
      List<({String entityId, int hlcPacked, String deviceId})>
          generateFrozenStamps({required int seed, int count = 50});

    要求：
      · 至少 50 条，且**必须含若干并发对**（【2026-08-03 换库修订】：
        crdt 下 Hlc 内建 nodeId，"hlc 相等 deviceId 不同"不再可能；
        并发对改为【同一物理毫秒、nodeId（deviceId）不同】的戳对，
        胜负完全由 nodeId 决出 —— 这仍是"物理上无法判定先后"的真并发。
        没有并发对，收敛性测试就退化成"排个序"，什么都证明不了）
      · 覆盖【多个 entityId】（收敛性是"每个实体各自收敛"）
      · 同一 seed 两次调用输出逐字节相同 —— 本 ACT 有测试守这条

    ⚠ 【不要】在本 ACT 里写任何"归并"逻辑。归并规则属于 ACT 09 的
    `HlcConflictArbiter`，本 ACT 只产数据。

  no_data_class_changes: >
    【本 ACT 不动任何 Data class】。RecordMeta、各模块的 record 类型、
    repository-interface-* 的任何仓库 —— 一个字段都不加。
    戳全部存在 drift 的 t_entity_stamp 边表里，键 (scopeUid, entityType, entityId)。
    这是人类 2026-08-02 的放置决定，理由见纪要决定记录。

  wire_format_is_int64: >
    RemoteChange 上存的是 `hlcPacked`（int64），不是 Hlc 对象，也不是字符串。理由：
    · int64 能直接落进 drift 的 IntColumn 与 Firestore/RTDB 的数字字段；
    · 【将来 Rust / Web 客户端只需实现同一个位布局】——
      这是 A14 要求产出语言中立规格的原因，规格文档在 ACT 11 写。
    · crdt Hlc 的 counter 上限恰为 0xFFFF（16 位，`_maxCounter`），
      与打包位布局 `(l << 16) | c` 天然吻合，不浪费任何一位。
    【不要】用 `hlc.toString()` / "l.c" 字符串格式上线 —— 那会把线上格式绑死在
    crdt 的格式化选择上，换库或换语言时会咬人（字符串只在本地时钟持久化时用，
    见 hlc_wire_format_spec）。

  hlc_wire_format_spec: >
    【2026-08-03 换库后新增。ACT 09 的 VersionStamp / toPacked 与 ACT 11 的
    线上格式 golden 测试都必须照本段规格断言，不许各自猜。】
    与 crdt Hlc 相关的一切序列化格式，在本 ACT 【钉死】如下：

    ① **Hlc 串格式**（`Hlc.toString` / `Hlc.parse` 必须逐字符可逆，crdt 源码实测）：
       `${dateTime.toIso8601String()}-${counter.toRadixString(16).toUpperCase().padLeft(4, '0')}-$nodeId`
       · dateTime 恒为 UTC（crdt 构造时即 toUtc），ISO8601 毫秒级；
       · counter 为 4 位大写十六进制（0x0000..0xFFFF）；
       · nodeId 即 deviceId（本 ACT 的裁决，见 CONSTRAINTS）。
       例：`2026-08-03T12:34:56.789Z-000F-device-abc123`

    ② **int64 打包**（`hlcPacked`，ACT 09 的 `VersionStamp.fromPacked` / `toPacked` 照此）：
       `hlcPacked = (dateTime.millisecondsSinceEpoch << 16) | counter`
       · l = UTC 毫秒时间戳（≤ 48 位，千年内不溢出）；
       · c = Hlc.counter（0..0xFFFF，16 位，恰好与 `_maxCounter` 一致）；
       · 线上/库内一律用 int64，字符串只在 ① 里出现（本地时钟持久化 + 日志）。

    ③ **持久化**：t_hlc_clock_state 落库用 ① 的串格式（HlcClockStore.save/load 的契约），
       边表 t_entity_stamp.hlcPacked 用 ② 的 int64。两者从不同时混淆。

    ⚠ ACT 11 的 golden 用例必须同时钉 ① 与 ② 的正反转换
    （Hlc.parse(Hlc(...).toString()) 恒等；fromPacked/toPacked 位级可逆）。

  migration_is_v8: >
    ACT 03 已把 schema 升到 7（ack 表 + peer_id 列 + t_sync_state 三元组主键）。
    本 ACT 升到 **8**，onUpgrade 新增且仅新增 `if (from < 8)` 一段：
      await m.createTable(entityStamps);
      await m.createTable(hlcClockStates);   // 时钟持久化，单行表
    【不要】动 from<2..7 的六段历史迁移。

  clock_persistence_timing: >
    时钟落盘时机：**每次 tick / observe 之后立刻 save**。
    不要"退出时再存" —— app 被系统杀掉不会走退出路径，那正是最常见的场景。
    单行表（固定主键），写入代价可忽略。

  observe_is_mandatory: >
    【本 ACT 最容易漏、且漏了不报错的一条】：
    每一条入站的 RemoteChange，只要它带了 hlcPacked，
    就【必须】在应用之前调 `clock.observe(remote)`。
    漏掉的后果：本地时钟不会被顶上去，下次本地写入的戳可能小于刚收到的远端戳，
    因果关系倒置。所有功能测试仍会绿。
    属性测试的第 ② 条（因果性）是唯一能抓到它的东西。

  no_arbitration_here: >
    【本 ACT 不做任何比较判断】。不写 ConflictArbiter，不改 applier 的决策逻辑。
    本 ACT 交付"戳"，ACT 09 交付"怎么比"，ACT 10 交付"比完怎么处置"。
    混在一起会让"戳错了"和"比错了"在同一个 diff 里无法区分。

CONSTRAINTS:
  - 【只换 HLC 实现库，架构一个字不动】。仍然是 HLC + deviceId 全序 + LWW，
    不引入 CRDT 数据结构、不改 drift 表模型、不换 record/oplog 语义。
    若你在本 ACT 里看到任何要求改表或改同步模型的措辞，那是理解错了，停下上报。
  - 【nodeId 一律取 DeviceIdentity.deviceId】（core/lib/model/ports.dart:240），
    不许另造一套 id 体系。crdt 的 Hlc 构造必须传 deviceId 作为 nodeId。
  - 【Hlc.parse / toString 串格式已写死成规格】。见 TASK_DETAIL.hlc_wire_format_spec。
    ACT 09 的 VersionStamp/toPacked 与 ACT 11 的线上格式 golden 测试都照此断言，
    不许各自猜、不许在实现里偏离。
  - 【不要】往任何 Data class 或 repository-interface-* 仓库加字段。见 no_data_class_changes。
  - 【不要】用字符串格式上线 HLC。见 wire_format_is_int64。
  - 【不要】把 observe 写成"可选优化"。见 observe_is_mandatory。
  - 【不要】等退出时才保存时钟。见 clock_persistence_timing。
  - 【不要】在本 ACT 写比较逻辑。见 no_arbitration_here。
  - 【不要】动 onUpgrade 的 from<2..7 六段。
  - 【不要】引入 hlc_dart，也不要引入 crdt 包内除 Hlc 之外的任何符号
    （Crdt / MapCrdt / LWWMapCrdt / Changeset / ReplicatedMap 等全部 FORBID）。
    见 DEPENDENCY。
  - 每个公开声明必须有中文 dartdoc（A12）。

TESTS_FIRST:
  CASES:
    - NAME: property_three_node_simulation
      FILE: core/test/s1b_hlc_property_test.dart
      BEHAVIOR: >
        【本 ACT 的生死线，也是整个 HLC 方案能不能自己维护的根据】。
        构造 3 个节点，各自给一个【随机且不同】的物理时钟偏移（±60 秒），
        用一个可注入的假时钟源驱动。随机顺序产生【至少 1000 次】事件：
          · 本地写入（tick）
          · 把某节点的当前戳发给另一节点（对方 observe）
        全程记录每个事件的 (nodeId, hlc)。跑完断言【两条】不变式：

        ① 单调性：同一节点的连续 tick 严格递增（用 compareTo > 0）
        ② **因果性：若节点 B 在时刻 T observe 过节点 A 的戳 S，
           则 B 在 T 之后产生的每一个戳都 > S**（这是 HLC 的全部价值）

        ⚠ 【收敛性不在本用例里】（Codex R3 · P0-2）：
        HLC 的逻辑计数 c 【本身就受 observe 到达顺序影响】——
        同一组事件按不同顺序重放，生成的戳可以合法地不同。
        要求"不同顺序重放后戳相同或胜负相同"是在断言 HLC 【没有承诺】的性质，
        实现正确也可能红，那是个假门禁。
        收敛性改由 **ACT 09 的 `convergence_over_fixed_stamps`** 覆盖：
        它把【本 ACT 生成并冻结的】一组戳，喂给两个独立状态容器 +
        真实的 `HlcConflictArbiter`，以不同到达顺序归并 ——
        那才是收敛性真正的战场（Codex R5 · P0-1：
        v3.2 曾试图在本 ACT 内"收缩职责为数学结构命题"，但那没有
        生产被测对象，测试辅助代码自证不约束实现，已废弃）。

        用固定 seed 的伪随机数，失败时打印 seed 以便复现。
        ② 是抓"漏调 observe"的唯一手段 —— 那个 bug 让①照样绿。
      RED_COMMAND: cd core && flutter test test/s1b_hlc_property_test.dart
      RED_EXPECT: 编译失败（HlcClock 不存在），退出码非 0
      COVERS: [A8]

    - NAME: causality_survives_clock_skew
      FILE: core/test/s1b_hlc_property_test.dart
      BEHAVIOR: >
        定向版本，直接复现设计稿 §5.2.3 那个场景：
        节点 A 时钟准，节点 B 时钟【慢 30 秒】。
        - A 写一次 → 戳 Sa
        - B observe(Sa)，然后 B 写一次 → 戳 Sb
        断言 `Sb > Sa`，即使 B 的物理时钟读数比 A 小 30 秒。
        用墙上时钟的实现这条必红 —— 这就是那个"用户在手机上改的东西
        被平板上更早的版本盖掉且不知情"的 bug。
      RED_COMMAND: cd core && flutter test test/s1b_hlc_property_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A8]

    - NAME: hlc_alone_is_not_a_total_order
      FILE: core/test/s1b_hlc_property_test.dart
      BEHAVIOR: >
        【反向断言，防止误以为"墙上时钟/简单计数器"就够了】。
        【2026-08-03 换库修订】：hlc_dart 里同毫秒并发戳 `compareTo == 0` 是
        "HLC 没有 nodeId 所以不是全序"的体现；crdt 的 Hlc 内建 nodeId，
        `compareTo` 先比 dateTime、再比 counter、最后比 nodeId —— 全序内建。
        本用例在新库下改为断言：
        构造两个节点（nodeId 不同，= 各自的 deviceId）在【同一物理毫秒】
        各自 tick 且互不知情，断言：
          · 两个戳 `compareTo != 0`（nodeId 决胜：dateTime/counter 相同
            也能比出胜负，且胜负是【确定的】）；
          · 反对称性：`a.compareTo(b)` 与 `b.compareTo(a)` 符号相反；
          · 互换提问顺序结论不变（可传递）。
        这条把"crdt Hlc 全序内建、nodeId 即决胜位"钉成可执行事实 ——
        没有它，后人会误以为还要在包外面再包一层决胜逻辑（那正是
        STRONG_MODEL_ONLY 要防的静默退化），或在 ACT 09 里重复实现定序。
        【用例名保留】：ACT 09 的收敛性用例引用"ACT 08 的 hlc_alone_is_not_a_total_order
        造出的那种并发戳"（同一物理毫秒、互不知情的两个戳），本用例仍是它的产地。
      RED_COMMAND: cd core && flutter test test/s1b_hlc_property_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A8]

    - NAME: clock_survives_restart
      FILE: core/test/s1b_hlc_property_test.dart
      BEHAVIOR: >
        用 fake HlcClockStore：tick 若干次到戳 S，模拟重启
        （丢弃 HlcClock 实例，用同一个 store 新建一个），
        断言新实例的第一个 tick 【严格大于】 S。
        再把物理时钟【回拨 1 小时】后重启，断言仍然严格大于 S ——
        持久化的意义正在于抗时钟回拨。
        不持久化的实现这条必红，而线上表现是"重启后写入的戳变小了"，
        没有任何日志会提到它。
      RED_COMMAND: cd core && flutter test test/s1b_hlc_property_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A13]

    - NAME: clock_saved_on_every_tick_not_on_exit
      FILE: core/test/s1b_hlc_property_test.dart
      BEHAVIOR: >
        非 happy-path。用记录调用次数的 fake store，tick 5 次，
        断言 `save` 被调用了 【5 次】（不是 0 次、不是 1 次）。
        再对 observe 做同样断言。
        写成"退出时统一保存"时这条会红 —— 而 app 被系统杀掉不会走退出路径，
        那正是移动端最常见的终止方式。
      RED_COMMAND: cd core && flutter test test/s1b_hlc_property_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A13]

    - NAME: apply_with_stamp_rolls_back_both_on_write_failure
      FILE: drift/test/sync/hlc_stamp_store_test.dart
      BEHAVIOR: >
        【边表方案的核心风险守卫，走【生产接口】而非测试内自拼事务】。
        调 `applyWithStamp(...)`，传一个【抛异常】的 write 回调。断言：
        - 异常向外传播（不被吞掉）；
        - t_entity_stamp 里查不到该 (scopeUid, entityType, entityId)；
        - write 回调里那一步本应写入的业务行也不在。
        再调一次 write 正常返回的，断言两者【都】写进去了。
        ⚠ 【必须调 applyWithStamp】，不许在测试里自己写
        `db.transaction(() { ... })` 然后分别插两张表 —— 那样测的是
        "drift 的事务能回滚"（drift 自己保证的事），不是"生产代码走了同一个事务"
        （Codex R2）。
        戳与记录分事务写的后果是"记录更新了但戳没更新"，
        下次同步该记录会被误判为旧版本而被覆盖。
      RED_COMMAND: cd drift && flutter test test/sync/hlc_stamp_store_test.dart
      RED_EXPECT: 编译失败（applyWithStamp / t_entity_stamp 不存在），退出码非 0
      COVERS: [A13]

    - NAME: stamp_is_scoped_by_scope_uid
      FILE: drift/test/sync/hlc_stamp_store_test.dart
      BEHAVIOR: >
        【对应 Codex R2 指出的主键缺 scopeUid】。
        对 ('scope-a', 'record', 'entity-1') 与 ('scope-b', 'record', 'entity-1')
        各写一个【不同的】戳，断言：
        - 两行【都在】（主键少了 scopeUid 时第二次写会覆盖第一次，这条会红）；
        - 各自读回的 hlcPacked / deviceId 是自己写进去的那个。
        两个账号下 entityId 相同的实体共用一行戳时，切换账号后仲裁读到的是
        另一个账号的版本坐标 —— 要么无脑覆盖、要么无脑丢弃，且不报错。
      RED_COMMAND: cd drift && flutter test test/sync/hlc_stamp_store_test.dart
      RED_EXPECT: 断言失败（第二次写覆盖了第一次），退出码非 0
      COVERS: [A13]

    - NAME: clock_state_table_holds_at_most_one_row
      FILE: drift/test/sync/hlc_stamp_store_test.dart
      BEHAVIOR: >
        往 t_hlc_clock_state 插入 id = 0 的一行，再试图插入 id = 1 —— 断言【被拒】
        （CHECK (id = 0) 生效）。再对 id = 0 做 upsert，断言表里【仍只有一行】
        且值已更新。
        单行表若退化成可存多行，"当前时钟是哪个"会变成一个需要 ORDER BY 才能
        回答的问题，而任何一次读错都让单调性静默断裂。
      RED_COMMAND: cd drift && flutter test test/sync/hlc_stamp_store_test.dart
      RED_EXPECT: 断言失败或表不存在，退出码非 0
      COVERS: [A13]

    - NAME: v7_upgrade_to_v8_preserves_existing_tables
      FILE: drift/test/sync/hlc_stamp_store_test.dart
      BEHAVIOR: >
        造一个 v7 库（含 ACT 03 建的 t_outbox_peer_ack 与切过主键的 t_sync_state），
