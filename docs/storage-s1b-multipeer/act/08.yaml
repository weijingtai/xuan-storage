ACT_VERSION: 1
TASK_ID: mimo-storage-s1b-multipeer/08
TITLE: HLC 接线 —— hlc_dart 引入 + 时钟持久化 + 戳边表 + 三节点属性测试
TYPE: implementation
ORDER: 8
DEPENDS_ON: [mimo-storage-s1b-multipeer/07]
DISPATCH_STATUS: ready
STRONG_MODEL_ONLY: true    # 因果时钟：退化路径【全部是静默的】，测试照样绿

OBJECTIVE: >
  给冲突仲裁准备一个【不依赖墙上时钟的正确排序】。
  本 ACT 交付：hlc_dart 依赖、跨重启持久化的本地时钟、存戳的 drift 边表、
  RemoteChange 上的可空 hlc/deviceId，以及三节点仿真属性测试。
  仲裁逻辑本身是 ACT 09，本 ACT 只负责"戳是对的、戳存得住、戳传得到"。

WHY_STRONG_MODEL: >
  ⚠ HLC 的每一条退化路径都【不报错】：
  · 只调 localEvent 不调 receiveEvent → 因果性整个消失，退化成墙上时钟，所有单测照样绿
  · 时钟不持久化 → 重启后从物理时间重来，单调性断裂，看不出来
  · 戳与记录分事务写 → 偶发失准，重现不了
  这就是为什么本 ACT 的核心交付不是"调用 hlc_dart"，而是【属性测试】——
  它是唯一能自动生成上千个反例的裁判。

BACKGROUND: >
  人类 2026-08-02 设计裁定（见纪要「决定记录」），经四个候选实测比选：
    drift_crdt   —— 装不上（依赖 sql_crdt/sqlite_crdt ^4.0.0，pub.dev 最高 3.x）
    Ditto        —— 闭源商业，初始化要 Portal 账号，纯离线 SharedKey 需申请许可
    sql_crdt     —— 抽象层可用 drift 后端，但 200 个写调用点要改裸 SQL + 全局软删
    crdt_lf      —— 质量最高（160/160）但为协同文档编辑而生，需双写 + 升 drift 到 2.34
  选 hlc_dart 1.1.0+2：只取 HLC，不碰数据模型。

  ⚠ 关键澄清：**HLC 单独不构成全序**。`HybridLogicalClock` 只有 (l, c) 两个字段，
  【没有 nodeId】，两台设备同毫秒写会 `isConcurrentWith == true`。
  所以定序是 **(hlc, deviceId)** 二元组。HLC 的价值是消灭【因果倒置】
  （B 收到过 A ⇒ B 必 > A），把"随机丢数据"降级为"并发时按固定规则选一个"。
  真并发谁更晚物理上不可判定，由 §5.3 冲突可见化兜底（ACT 09/10）。

