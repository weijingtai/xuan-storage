ACT_VERSION: 1
TASK_ID: mimo-storage-s1b-multipeer/07
TITLE: PeerFanoutPusher 实现 —— 按 eligiblePeers 并发扇出 + coordinator 端到端接线
TYPE: implementation
ORDER: 7
DEPENDS_ON: [mimo-storage-s1b-multipeer/06]
DISPATCH_STATUS: ready
STRONG_MODEL_ONLY: false

OBJECTIVE: >
  拆掉 §5.2.1 阻断点 4：`push` 返回单个 `SyncError?`，N 个结果压不成一个。
  本 ACT 交付 ACT 01 定下的 `PeerFanoutPusher` 的唯一实现，并让 SyncCoordinator
  改用它 —— 一条 outbox 记录推给【ACT 08 判定为合格的】对端，各记各的 ack。

  ⚠ **router 保持 1-of-N，不改造成 fan-out**（人类 2026-08-02 确认，见纪要决定记录）。
  纪要原计划「router 改造成 fan-out」措辞不精确：router 管的是【区域轴】
  （大陆 Supabase / 海外 Firebase，用户 VPN 切换或出国才用，一年可能一次），
  按字面执行会变成同时写两个云 —— 那是 bug 不是需求。
  router 作为「云」这一个对端参与扇出；【对端轴】的扇出由本 ACT 的 pusher 承担。

SCOPE:
  READ:
    - docs/superpowers/specs/2026-07-31-storage-architecture-design.md
      # §5.2.1 阻断点 4、5 的证据行；§5.2.2 第 4 条 PeerFanoutPusher 原文签名
    - core/lib/model/sync_peer.dart
      # ACT 01 的 PeerFanoutPusher 契约与它 dartdoc 里写死的【四条】约定 ——
      # 【那四条就是本 ACT 的验收语义，逐条实现】，第一条是「只推 eligiblePeers」
    - core/lib/model/peer_eligibility.dart
      # ACT 08 的单一判定源。coordinator 用 eligiblePeers() 算合格集合，
      # 【不要】在本 ACT 重写判定逻辑
    - core/lib/routing/remote_gateway_router.dart   # 51 行，ACT 03 后已 implements SyncPeer
    - core/lib/routing/region.dart                  # Region enum
    - core/lib/core/sync_coordinator.dart           # :57 peekBatch、:74 markSuccess 调用点
    - core/lib/model/ports.dart                     # ACT 03 的 markSuccess/markFailed(peerId)
  WRITE:
    - core/lib/routing/peer_fanout_pusher.dart
    - core/test/s1b_fanout_test.dart
  MODIFY:
    - core/lib/core/sync_coordinator.dart           # 改用 PeerFanoutPusher，逐 peer 回写 ack

SIGNATURE:
  peer_fanout_pusher.dart: |
    /// [PeerFanoutPusher] 的默认实现：把一条记录并发推给全部对端。
    ///
    /// 与 [RemoteGatewayRouter] 的分工：router 是「按 region 选一个云端后端」，
    /// 是【路由】；本类是「推给所有对端」，是【扇出】。两者不可互相取代 ——
    /// router 仍然作为其中一个 peer 参与扇出（它对外表现为单个 cloud peer）。
    final class DefaultPeerFanoutPusher implements PeerFanoutPusher {
      /// [peers]：参与扇出的全部对端。顺序不影响结果（并发执行）。
      DefaultPeerFanoutPusher({required List<SyncPeer> peers});

      /// 当前参与扇出的对端标识，用于诊断「这条记录被推给了谁」。
      List<PeerId> get peerIds;

      @override
      Future<Map<PeerId, SyncError?>> pushToAll(OutboxRecord record);
    }

TASK_DETAIL:
  four_contracts_from_act01: >
    ACT 01 已在 PeerFanoutPusher 的 dartdoc 里写死四条约定，本 ACT 逐条实现：
      1. **只推 [eligiblePeers] 里的对端，一个都不许多推**；
      2. 返回 Map 的键集合【恰好等于】 eligiblePeers，成功的对端值为 null；
      3. 某个对端抛异常【不得】中断其余对端的推送，异常转成该对端的 SyncError；
      4. 不得因为某个对端失败就把整体判为失败 —— 成败是 per-peer 的。

    第 1 条是 §5.4 第一道锁的最后一段：peekBatch 挑好了，扇出这里不能再放开。
    第 2 条是 ACT 07 的输入：调用方按 Map 逐个写 ack 行；
    省略成功项会让调用方无法区分「成功」与「没推」，漏写 success ack，
    该记录对该对端永远推不完。

  coordinator_computes_eligible: >
    SyncCoordinator 推送一条记录前，用 ACT 08 的单一判定源算合格集合：

      final eligible = PeerEligibility.eligiblePeers(record.entityType, peers);
      final results  = await _pusher.pushToAll(record, eligiblePeers: eligible);

    【不要】在这里重写 `lookup(...).channels.contains(...)`。
    ACT 08 有门禁数这个表达式在库代码里出现的次数，重写会让它变红。

  concurrency: >
    用 `Future.wait` 并发推送，【不要】串行 for 循环 await ——
    一个不可达的 LAN peer 会有秒级超时，串行会让云端推送排在它后面等。
    但 `Future.wait` 默认在任一 future 抛出时立即以该异常完成（其余结果丢失），
    因此【每个 peer 的调用必须各自包一层 try/catch，在进入 Future.wait 之前
    就把异常转成 SyncError】。直接 `Future.wait([...]).catchError(...)` 是错的。

  error_mapping: >
    peer.push 抛出的异常转成 `SyncError(code: SyncErrorCode.unknown, message: ...)`。
    message 里【必须带上该 peer 的 peerId】，否则诊断时看到一条 unknown
    根本不知道是哪个对端出的事。
    若异常本身携带可识别的分类（例如超时/网络），映射到对应的 SyncErrorCode；
    拿不准就用 unknown —— 【不要】猜测性地映射成 permission 或 conflict，
    那会让重试策略走错分支。

  coordinator_rewiring: >
    sync_coordinator.dart 的推送循环从
      `final err = await _remoteGateway.push(record); if (err == null) markSuccess(...)`
    改为
      `final results = await _pusher.pushToAll(record);`
      `for (final entry in results.entries) { entry.value == null ? markSuccess(peerId: entry.key, ...) : markFailed(peerId: entry.key, ...) }`
    markFailed 的 attempt 取【该 peer 的当前 attempt + 1】—— 从 ACT 05 的 ack 表读，
    【不要】用 record.attempt（那是 t_outbox 上的全局字段，ACT 05 已明确它不再被更新）。

  router_stays_one_of_n: >
    `RemoteGatewayRouter` 的行为【不变】—— 它仍是按 region 选一个云端后端。
    它作为【一个 peer】参与扇出。
    把 router 本身改成 fan-out 是错的：region 路由的语义是"大陆用户走 Supabase、
    海外走 Firebase"，同时推给两个后端等于把同一份数据写进两个云，那是另一件事。

CONSTRAINTS:
  - 【不要】用串行 for-await 推送。见 concurrency。
  - 【不要】在 pushToAll 里让任何异常逃逸出去。整体永远成功返回一个 Map。
  - 【不要】把失败的 peer 从返回 Map 里省略，也【不要】省略成功的 peer。
  - 【不要】改 RemoteGatewayRouter 的 1-of-N 行为。见 router_stays_one_of_n。
  - 【不要】在本 ACT 做 channel 策略过滤（哪些记录该推给哪些 peer）。那是 ACT 06。
    本 ACT 的 pushToAll 就是字面意义的 all。
  - 【不要】在 pushToAll 里写 ack 表。写 ack 是 SyncCoordinator 的职责 ——
    pusher 只负责"推"，把持久化混进来会让它没法被单元测试。
  - 每个公开声明必须有中文 dartdoc（A12）。

TESTS_FIRST:
  CASES:
    - NAME: end_to_end_shared_record_never_reaches_lan
      FILE: core/test/s1b_fanout_test.dart
      BEHAVIOR: >
        【本 ACT 的生死线 —— 直接对应 Codex R1 · P0-1，也是 §5.4 第一道锁的终检】。
        走【真实链路】：SyncCoordinator + ACT 08 的过滤 + 本 ACT 的 pusher，
        不用任何绕过 coordinator 的捷径。
        注册 'playground_post' 为 StoragePolicy.shared、'xiang_reading' 为 private。
        对端：cloud + lan，两个都是计数式 fake（记录收到了哪些 operationId，
        【不用 fail()】—— coordinator 里有 catch-all 会吞掉 TestFailure）。
        enqueue 一条 shared 记录与一条 private 记录，跑一轮推送，断言：
        - cloud 收到【两条】；
        - **lan 只收到 private 那条，shared 那条的 operationId 【不在】 lan 的收件列表里**；
        - lan 对 shared 那条【没有】 ack 行（ACT 07 的表里查不到）。
        只在 peekBatch 里过滤而 pushToAll 推给所有人时，这条会红 ——
        而 ACT 08 与本 ACT 各自的单元测试仍然全绿。这就是必须有端到端测试的原因。
      RED_COMMAND: cd core && flutter test test/s1b_fanout_test.dart
      RED_EXPECT: 编译失败（pushToAll 尚无 eligiblePeers），退出码非 0
      COVERS: [A7, A11]

    - NAME: every_peer_gets_an_entry_including_successes
      FILE: core/test/s1b_fanout_test.dart
      BEHAVIOR: >
        三个 fake SyncPeer：cloud 成功（返回 null）、lan 失败（返回 SyncError）、
        webrtc 抛异常。调 pushToAll，断言：
        - `result.length == 3`；
        - `result[PeerId('cloud')]` 为 null（成功也【必须】有条目）；
        - `result[PeerId('lan')]` 是 SyncError；
        - `result[PeerId('webrtc')]` 是 SyncError 且 message 里【含 'webrtc'】。
        省略成功项会让调用方无法区分「成功」与「没推」，
        于是漏写 success ack，该记录对该对端永远推不完。
      RED_COMMAND: cd core && flutter test test/s1b_fanout_test.dart
      RED_EXPECT: 编译失败（DefaultPeerFanoutPusher 不存在），退出码非 0
      COVERS: [A11]

    - NAME: one_peer_throwing_does_not_abort_others
      FILE: core/test/s1b_fanout_test.dart
      BEHAVIOR: >
        【本 ACT 最重要的一条】。第一个 peer 立刻抛异常，第二、三个是计数式 fake
        （记录 pushCount，【不用 fail()】—— catch-all 会吞掉 TestFailure，S5c 教训）。
        调 pushToAll 后断言：
        - 不抛异常，正常返回；
        - 第二、三个 peer 的 pushCount 【都是 1】（都被推了）。
        写成 `Future.wait([...])` 而没有 per-peer try/catch 时，
        Future.wait 会在第一个异常时立即完成，其余结果丢失 —— 这条会红。
      RED_COMMAND: cd core && flutter test test/s1b_fanout_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A11]

    - NAME: pushes_are_concurrent_not_serial
      FILE: core/test/s1b_fanout_test.dart
      BEHAVIOR: >
        三个 fake peer 各自 `await Future.delayed(const Duration(milliseconds: 200))`
        后返回。用 Stopwatch 测 pushToAll 的总耗时，断言【小于 400ms】
        （并发约 200ms，串行约 600ms；阈值取中间留足余量避免 CI 抖动）。
        串行 for-await 会让一个不可达的 LAN peer（秒级超时）把云端推送排在后面等，
        表现是「LAN 一断，云端同步跟着变慢」。
      RED_COMMAND: cd core && flutter test test/s1b_fanout_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A11]

    - NAME: coordinator_writes_ack_per_peer_from_result_map
      FILE: core/test/s1b_fanout_test.dart
      BEHAVIOR: >
        用 ACT 03 的 `_InMemoryOutboxStore` + 一个 fake pusher（cloud 成功、lan 失败）
        驱动 SyncCoordinator 跑一轮推送。断言：
        - `peekBatch(peerId: cloud)` 不含该记录（写了 success ack）；
        - `peekBatch(peerId: lan)`   仍含该记录（写了 failed ack，可重试）；
        - lan 的 attempt 为 1，cloud 的 attempt 为 0。
        这条把 ACT 03/04/05 串起来验一遍 —— 三个 ACT 各自绿但接不上是很常见的。
      RED_COMMAND: cd core && flutter test test/s1b_fanout_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A4, A11]

    - NAME: attempt_comes_from_ack_row_not_from_outbox_record
      FILE: core/test/s1b_fanout_test.dart
      BEHAVIOR: >
        非 happy-path。让同一条记录对 lan 连续失败两轮，断言第二轮写入的 attempt 是 2。
        再断言 cloud（一直成功）的 attempt 仍为 0。
        若实现用 `record.attempt`（t_outbox 上的全局字段）算 attempt，
        两个对端会共用一个计数 —— cloud 成功也会被 lan 的失败推高，
        进而在 10 次内把 cloud 也推成 dead。
      RED_COMMAND: cd core && flutter test test/s1b_fanout_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A5]

    - NAME: router_behavior_unchanged_still_one_of_n
      FILE: core/test/s1b_fanout_test.dart
      BEHAVIOR: >
        回归守卫（与 ACT 03 的同名断言重复是【故意】的 —— 那边守迁移，这边守扇出改造）。
        RemoteGatewayRouter 注入两个计数式 fake SyncPeer，currentRegion 指向其一。
        调 `router.push` 一次，断言另一个的 pushCount 为 【0】。
        region 路由的语义是「大陆走 Supabase、海外走 Firebase」，
        同时推给两个云等于把同一份数据写进两个后端，那是完全不同的一件事。
      RED_COMMAND: cd core && flutter test test/s1b_fanout_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A11]

