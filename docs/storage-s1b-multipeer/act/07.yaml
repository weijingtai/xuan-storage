ACT_VERSION: 1
TASK_ID: mimo-storage-s1b-multipeer/07
TITLE: per-peer 调度接口 + SyncRuntime 退避改造 —— 不可达对端不得拖垮云端
TYPE: implementation
ORDER: 7
DEPENDS_ON: [mimo-storage-s1b-multipeer/06]
DISPATCH_STATUS: ready
STRONG_MODEL_ONLY: true    # 时序状态机，写错不报错，只在"某个对端长期离线"时才显形

OBJECTIVE: >
  §5.2.2 末段的连带改动：`_pushFailureCount` 与 `_nextPullNotBeforeUtcByEntityType`
  都必须 per-peer，否则一个不可达的 LAN peer 会把云端 push 一起拖进 2 分钟退避。
  ACT 06 让一条记录同时推给 N 个合格对端，本 ACT 让 N 个对端的失败互不传染。

  ⚠ **改字段不够，必须先有接口**（Codex R1 · P0-2）：
  当前 SyncCoordinator 只返回聚合的 `OutboxPushRunResult`，`pushOnce`/`pullOnce`
  都没有 peer 参数，也没有枚举/移除对端的正式 API。
  只把四个字段改成 Map，runtime 仍然做不到「只跳过 LAN 而继续 push cloud」。
  所以本 ACT 的第一交付物是【接口】，第二才是退避状态。

WHY_STRONG_MODEL: >
  ⚠ 退避是【时序状态】，写错不会报错也不会让现有测试变红：
  单 peer 场景下 per-peer 与全局退避的行为完全一致，全部既有测试都会绿。
  只有在「一个对端持续失败、另一个持续成功」时差异才显形 ——
  而那正是 LAN peer 的常态（用户不在家时局域网对端永远不可达）。
  线上表现：用户离开家 → LAN peer 连不上 → 云端同步被拖进 2 分钟退避 →
  用户以为 app 坏了。没有任何错误日志能指向这个原因。

SCOPE:
  READ:
    - docs/superpowers/specs/2026-07-31-storage-architecture-design.md
      # §5.2.2 末段「连带的 SyncRuntime 改动」原文（两个字段 + 理由）
    - core/lib/sync/sync_runtime.dart
      # 退避相关的全部现场（769 行，只看这些行）：
      #   :44-47  pushInterval / pullInterval / minBackoff / maxBackoff 四个可注入参数
      #   :92     _nextPushNotBeforeUtc          （全局，要改）
      #   :93     _pushFailureCount              （全局，要改）
      #   :95     _nextPullNotBeforeUtcByEntityType  （按 entityType，要加 peer 维度）
      #   :97     _pullFailureCountByEntityType      （按 entityType，要加 peer 维度）
      #   :341-350 生命周期里对这几个 Map 的 removeWhere / putIfAbsent
      #   :489 :536 :554-570  push 侧退避的读写
      #   :632 :672-692       pull 侧退避的读写
      #   :732-739            reset 路径
      #   _computeBackoff 的实现
    - core/lib/model/sync_peer.dart      # PeerId
    - core/lib/routing/peer_fanout_pusher.dart   # ACT 06：pushToAll 返回 Map<PeerId, SyncError?>
  MODIFY:
    - core/lib/sync/sync_runtime.dart
    - core/lib/core/sync_coordinator.dart    # pushOnce / pullOnce 加 peer 维度
    - core/lib/model/types.dart              # OutboxPushRunResult 拆出 per-peer 结果
  WRITE:
    - core/lib/sync/peer_registry.dart
    - core/test/s1b_per_peer_backoff_test.dart

SIGNATURE:
  peer_registry.dart: |
    /// 当前参与同步的对端集合。SyncRuntime 与 SyncCoordinator 的唯一枚举入口。
    ///
    /// 【为什么要正式接口而不是一个 List 字段】：退避状态、ack 行、游标都按 peer 分片，
    /// 对端集合变化时这些分片必须被清理。没有正式的 add/remove，
    /// 清理时机就散落在各处，漏一处就是内存里留一批僵尸键（且不报错）。
    abstract interface class PeerRegistry {
      /// 当前全部对端。顺序无意义。
      Iterable<SyncPeer> get peers;

      /// 对端标识集合，供退避 Map 做键清理。
      Set<PeerId> get peerIds;

      /// 注册一个对端。
      void register(SyncPeer peer);

      /// 移除一个对端，并【通知监听方清理该 peer 的全部分片状态】。
      void remove(PeerId peerId);

      /// 对端集合变化流。SyncRuntime 订阅它来清理退避 Map。
      Stream<Set<PeerId>> get changes;
    }

  types.dart per-peer 推送结果: |
    /// 一轮推送中【单个对端】的结果。
    ///
    /// 取代把 N 个对端压成一个 OutboxPushRunResult 的做法 ——
    /// 压扁之后 runtime 无从知道该给谁记失败、该跳过谁。
    class PeerPushOutcome {
      /// 对端标识。
      final PeerId peerId;

      /// 本轮成功推送的条数。
      final int succeeded;

      /// 本轮失败的条数。
      final int failed;

      /// 最后一个错误，用于退避决策与诊断。
      final SyncError? lastError;

      /// 构造一个 [PeerPushOutcome]。
      const PeerPushOutcome({...});
    }

  sync_coordinator.dart 签名变更: |
    /// 推一轮。返回【每个对端各一条】结果，不再压成一个。
    Future<List<PeerPushOutcome>> pushOnce({required String scopeUid});

    /// 拉一轮。**按对端拉** —— 游标已是 per-(scope, peer, entityType)（ACT 03/04）。
    Future<PullRunResult> pullOnce({
      required String scopeUid,
      required PeerId peerId,
      required String entityType,
    });

TASK_DETAIL:
  interfaces_before_state: >
    实现顺序【必须】是：先 PeerRegistry + PeerPushOutcome + pushOnce/pullOnce 签名，
    再改四个退避字段。反过来做会得到"字段是 Map 了但判定还是全局"的假完成 ——
    Codex R1 · P0-2 抓的正是这个形状。

  four_fields: >
    四个退避状态字段全部加 peer 维度：

      _nextPushNotBeforeUtc            DateTime?              -> Map<PeerId, DateTime?>
      _pushFailureCount                int                    -> Map<PeerId, int>
      _nextPullNotBeforeUtcByEntityType Map<String, DateTime?> -> Map<(PeerId,String), DateTime?>
      _pullFailureCountByEntityType     Map<String, int>       -> Map<(PeerId,String), int>

    后两个的键从 entityType 变成 (peerId, entityType) 二元组。
    Dart 3 的 record 类型 `(PeerId, String)` 可直接作 Map 键（有值语义的 ==/hashCode），
    比拼字符串 `'$peerId::$entityType'` 安全 —— 拼字符串在 peerId 含分隔符时会串键。
    【不要】用嵌套 Map<PeerId, Map<String, T>>，那会让 :341-350 的 removeWhere /
    putIfAbsent 变成两层遍历，极易漏清理。

  push_side: >
    :554-570 那段：失败时 `_pushFailureCount[peerId] += 1`，
    `_nextPushNotBeforeUtc[peerId] = now.add(_computeBackoff(该 peer 的失败数))`；
    成功时把【该 peer 的】两个值清零/置 null。

    ACT 06 的 pushToAll 返回 `Map<PeerId, SyncError?>` ——
    逐条目更新对应 peer 的退避状态。
    【关键】：某个 peer 失败【不得】改动其他 peer 的 `_nextPushNotBeforeUtc`。

    :489 与 :536 的「是否到点可推」判定改成【逐 peer 判定】：
    某个 peer 在退避窗口内就跳过那个 peer，其余照推。
    【不要】写成「任一 peer 在退避窗口内就整轮跳过」——
    那等于把 per-peer 退避又退化回全局。

  pull_side: >
    :632 / :672-692 同理，键换成 (peerId, entityType)。
    pull 是按对端各自的游标拉的（ACT 03/04 已让游标 per-peer），
    退避自然也要 per-peer。

  lifecycle_cleanup: >
    :341-350 的 removeWhere / putIfAbsent 与 :732-739 的 reset 要同步改：
    entityType 集合变化时清理对应条目，现在要按 (peerId, entityType) 清。
    【漏清理不会报错，只会让 Map 无限增长】—— 每次对端集合变化就留下一批僵尸键。
    本 ACT 的最后一条测试专门验这个。

  backoff_params_stay_global: >
    minBackoff / maxBackoff / pushInterval / pullInterval（:44-47）【保持全局】，
    不要做成 per-peer 可配。它们是策略参数不是运行时状态；
    per-peer 可配会让"为什么这个对端退避这么久"变成一个需要查配置才能回答的问题。

CONSTRAINTS:
  - 【不要】用字符串拼接做复合键。见 four_fields。
  - 【不要】用嵌套 Map。见 four_fields。
  - 【不要】写成「任一 peer 在退避中就整轮跳过」。见 push_side。
  - 【不要】把 minBackoff/maxBackoff 做成 per-peer。见 backoff_params_stay_global。
  - 【不要】动 _computeBackoff 的算法。本 ACT 只改"这个数存在哪"，不改"怎么算"；
    两件事混在一起会让退避行为的回归无法归因。
  - 【不要】在本 ACT 改动 SyncRuntime 里与退避无关的部分。769 行的文件，
    顺手重构会让 diff 无法审查。
  - 每个改动的私有字段也要更新中文注释说明键的含义（A12 只管公开声明，
    但这四个字段的键语义写错就是本 ACT 的全部风险，必须写清楚）。

TESTS_FIRST:
  CASES:
    - NAME: unreachable_peer_does_not_delay_cloud_push
      FILE: core/test/s1b_per_peer_backoff_test.dart
      BEHAVIOR: >
        【本 ACT 的生死线，也是 §5.2.2 末段那句话的可执行版本】。
        两个 fake peer：cloud 恒成功、lan 恒失败。跑若干轮推送后断言：
        - lan 的 `nextPushNotBefore` 被推到了未来（进入退避）；
        - cloud 的 `nextPushNotBefore` 【为 null】（从未退避）；
        - 继续推送时 cloud 【仍被调用】，调用次数随轮次线性增长。
        退避状态若是全局的，cloud 会被 lan 的失败拖进 2 分钟窗口 ——
        线上表现是「用户离开家，云端同步就变慢」，且无任何日志指向原因。
        观测内部退避状态用 `@visibleForTesting` 的【只读 getter】
        （例如 `Map<PeerId, DateTime?> get debugNextPushNotBefore`），
        【不要】把私有字段直接改成 public 字段。
        ⚠ 门禁只禁「可写字段」，合法的只读 getter 必须放行（Codex R1 · P1-16）。
      RED_COMMAND: cd core && flutter test test/s1b_per_peer_backoff_test.dart
      RED_EXPECT: 编译失败（无 per-peer 退避视图），退出码非 0
      COVERS: [A6]

    - NAME: failure_count_resets_per_peer_on_success
      FILE: core/test/s1b_per_peer_backoff_test.dart
      BEHAVIOR: >
        lan 先失败 3 次（失败数 3），随后成功一次，断言 lan 的失败数归 0
        且 `nextPushNotBefore[lan]` 回到 null。
        同时断言 cloud 的失败数【全程为 0】、未被 lan 的归零操作影响
        （写成"任一 peer 成功就全局清零"同样是错的，方向相反而已）。
      RED_COMMAND: cd core && flutter test test/s1b_per_peer_backoff_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A6]

    - NAME: peer_in_backoff_is_skipped_others_still_pushed
      FILE: core/test/s1b_per_peer_backoff_test.dart
      BEHAVIOR: >
        非 happy-path。把 lan 的 `nextPushNotBefore` 置于未来（模拟退避中），
        触发一轮推送，断言：
        - lan 的 pushCount 【未增加】（被跳过）；
        - cloud 的 pushCount 【增加了 1】（照常推）。
        写成「任一 peer 在退避中就整轮跳过」时，cloud 的 pushCount 不增加 ——
        这条会红。那种写法等于把 per-peer 退避退化回全局，
        而且更隐蔽：字段确实是 Map，只是判定逻辑没跟上。
      RED_COMMAND: cd core && flutter test test/s1b_per_peer_backoff_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A6]

    - NAME: pull_backoff_keyed_by_peer_and_entity_type
