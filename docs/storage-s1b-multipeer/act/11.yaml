TASK_DETAIL:
  barrel: >
    在 core/lib/persistence_core.dart 的 export 列表【末尾追加】以下 6 行，不重排既有行：
      export 'model/sync_peer.dart';            // ACT 01
      export 'model/peer_eligibility.dart';     // ACT 05
      export 'routing/peer_fanout_pusher.dart'; // ACT 06
      export 'sync/peer_registry.dart';         // ACT 07
      export 'sync/hlc_clock.dart';             // ACT 08
      export 'model/conflict_arbiter.dart';     // ACT 09

    ⚠ 【不要】导出 core/lib/test_support/in_memory_stores.dart（ACT 04 交付）。
    它是给测试与 parity 比对用的 fake，不是产品 API；导出它等于承诺维护它的兼容性。

  wire_format_spec: >
    【A14 的交付物】。写一份 docs/storage-s1b-multipeer/HLC-WIRE-FORMAT.md，
    语言中立（不出现 Dart 代码，只出现位布局与规则），至少含：

    ① **打包布局**：int64，`(l << 16) | c`。l 占高 48 位（毫秒），c 占低 16 位。
       字节序：大端（与 hlc_dart 的 toUint8List 一致）。
    ② **决胜规则**：先比 hlc（先 l 后 c）；hlc 完全相等时比 deviceId 的
       **UTF-8 字节序**（不是本地化排序），大者胜。
    ③ **时钟漂移阈值**：一个明确的毫秒数。各语言实现必须用同一个值，
       否则一端接受一端拒绝。
    ④ **溢出行为与有效范围**（Codex R2 要求闭合的跨语言边界）：
       · c 达到 65535 时怎么办；
       · l 的【有效上限】必须写明。打包值落在 **signed int64** 里，
         最高位是符号位，因此 l 的合法范围是 `0 <= l < 2^47`，
         超过就会让 packed 变负、比较结果翻转。
         2026-08-02 实测：当前毫秒数 l ≈ 2^40，打包后占 57 位，距符号位还有 6 位，
         **需要 l ≥ 2^47（约公元 6440 年）才会变负** —— 实践安全，
         但规格必须写死这个上限，否则各语言实现各自猜（有的语言默认无符号，
         同一个字节序列会被读成两个不同的数）。
       · 实现遇到 l ≥ 2^47 时的行为：**拒绝并报错**，不许静默截断。
       · deviceId 的比较基准是 **UTF-8 字节序**（见 ②），
         规格里要写明"不是 UTF-16 码元序、不是本地化排序"——
         Dart 的 `String.compareTo` 是 UTF-16 码元序，
         对 BMP 外字符与 UTF-8 字节序【结论不同】，跨语言实现必须对齐到一个。
    ⑤ **黄金用例表**：至少 8 组 `(l, c, deviceId) → packed(hex) → 与另一组的比较结果`，
       将来 Rust / Web 客户端拿它对表即可验证实现正确。

    这份文档是【协议所有权】的载体：包可以换，规格不能丢。
    选 HLC 而不是 crdt_lf/sql_crdt 的最强理由就在这里 ——
    那两个的二进制格式归包作者所有，换包等于换协议。

  analyze_gate_baselines: >
    三段式门禁要覆盖【三个包】，这是它与 S1a 版本的最大区别（S1a 只有 core）。
    2026-08-02 实测基线（挂账值，写死在脚本里）：

      core     退出码 3   总数 58   34 ERROR / 9 WARNING / 15 INFO   9 个文件
      drift    退出码 2   总数 162  0 ERROR / 70 WARNING / 92 INFO   71 个文件
      firebase 退出码 3   总数 38   2 ERROR / 17 WARNING / 19 INFO

    ⚠ firebase 那 2 个 ERROR 【应当已被 ACT 02 清零】。
    脚本里 firebase 的 ERROR 基线写 **0**，不是 2 ——
    ACT 02 的 DONE_WHEN 已要求清零，这里不给它留退路。
    若执行到本 ACT 时 firebase 仍有 ERROR，说明 ACT 02 没做完，【停下上报】。

    core 那 34 个 ERROR 是 main 分支既有断点（four_zhu_card_templates 孤儿模块
    import 了 drift，而 core 没有 drift 依赖），与 S1a 冻结基线逐条一致，继续挂账。

    S1B_FILES（检查1 的 scoped analyze 对象）列本任务新增/重写的文件：
      core/lib/model/sync_peer.dart
      core/lib/model/peer_eligibility.dart
      core/lib/model/conflict_arbiter.dart
      core/lib/routing/peer_fanout_pusher.dart
      core/lib/sync/peer_registry.dart
      core/lib/sync/hlc_clock.dart
      core/lib/model/ports.dart
      core/lib/sync/sync_runtime.dart
      core/lib/core/sync_coordinator.dart
      core/lib/routing/remote_gateway_router.dart
      drift/lib/persistence_drift.dart
      drift/lib/sync/record_local_applier.dart
      firebase/lib/persistence_firebase.dart
      firebase/lib/firebase_realtime_remote_gateway.dart
      + 本任务新增的全部 test 文件
    这些文件的 `dart analyze --fatal-infos` 必须【零 issue】。

  gate_must_be_provable: >
    S1a 的门禁脚本是靠【三条注入负测试】证明有效的，本 ACT 照做：
      注入1 往 S1B_FILES 里的某个文件加一个 unused import → 检查1 必须红
      注入2 往【非白名单】文件（例如 core/lib/model/types.dart 的某个未被本任务
             触及的位置）加 unused import → 检查2 必须红
      注入3 往【白名单内】文件（例如 core/lib/model/calculation_strategy_config_data_model.dart）
             加 unused import → 检查3 必须红（总数超基线）
    三条都要实做并把结果写进纪要，只写脚本不验证等于没做。

  bash_compatibility: >
    macOS 的 /bin/bash 是 **3.2.57**：
      · 没有 `declare -A`（关联数组）
      · 没有 `mapfile` / `readarray`
    S1a 的脚本用多行字符串 + for 循环绕开了这两个，照抄那个写法。

  grep_c_semantics: >
    `grep -c` 在无匹配时【打印 "0" 并且退出码为 1】。
    因此凡是用 grep -c 做断言的地方，EXPECT_STDOUT 与 EXPECT_EXIT 【两个都要写】，
    只写一个会漏判。S1a 的脚本里有现成写法。

  dartdoc_guard: >
    照抄 core/test/s1a_dartdoc_coverage_test.dart 的通用式正则与覆盖下限机制。

    ⚠ **扫描范围是本任务新增/改动的【全部】库文件，不是三个**（Codex R1 · P2-22）：
      core/lib/model/sync_peer.dart              (ACT 01)
      core/lib/model/peer_eligibility.dart       (ACT 05)
      core/lib/model/conflict_arbiter.dart       (ACT 09)
      core/lib/routing/peer_fanout_pusher.dart   (ACT 06)
      core/lib/sync/peer_registry.dart           (ACT 07)
      core/lib/sync/hlc_clock.dart               (ACT 08)
      core/lib/test_support/in_memory_stores.dart (ACT 04)
      core/lib/model/ports.dart                  (ACT 04/05 改动的公开声明)
    只扫三个的写法会让其余四个文件的公开声明【永远没有 dartdoc 门禁】——
    而它们恰好是 HLC / 退避 / 仲裁这三块最需要解释的代码。
    ⚠ 【必须同时断言扫描到的文件数 == 8】—— 硬编码路径列表里漏掉一个不会报错。
    【必须有写死的覆盖数下限】—— 没有下限，正则被改窄后门禁会静默失效。
    下限取实测值往下留少量余量，并在注释里写明实测值与日期。
    S1a 的 A10 为此返工了两轮，教训是：不要手工枚举声明形态白名单，用通用式。

CONSTRAINTS:
  - 【不要】重排或删除 core/lib/persistence_core.dart 里的既有 export 行。
  - 【不要】给 firebase 的 ERROR 留基线余量。见 analyze_gate_baselines。
  - 【不要】用 `declare -A` 或 `mapfile`。见 bash_compatibility。
  - 【不要】只写 EXPECT_STDOUT 不写 EXPECT_EXIT。见 grep_c_semantics。
  - 【不要】重新发明 dartdoc 门禁的正则。见 dartdoc_guard。
  - 【不要】修改任务纪要的「验收标准」区（A1–A14）。转译者与执行者都无权改它。
  - 架构守卫测试必须是【可以变红】的。写完按 SELF_CHECK 反向验证。

TESTS_FIRST:
  CASES:
    - NAME: barrel_exports_all_new_public_api
      FILE: core/test/s1b_architecture_guard_test.dart
      BEHAVIOR: >
        文件顶部【只】`import 'package:persistence_core/persistence_core.dart';`
        （不逐个 import model/ 下的文件）。为每个新增文件各引用至少一个该文件独有的公开类型：
          sync_peer.dart          -> SyncPeer / PeerCapabilities / PeerId / PeerFanoutPusher
          conflict_arbiter.dart   -> VersionStamp / ArbitrationDecision / ConflictArbiter / ConflictSide
          peer_fanout_pusher.dart -> DefaultPeerFanoutPusher
        编译通过即证明 barrel 完整；遗漏任一条则该类型未定义，编译失败。
      RED_COMMAND: cd core && flutter test test/s1b_architecture_guard_test.dart
      RED_EXPECT: 编译失败（barrel 未导出），退出码非 0
      COVERS: [A12]

    - NAME: wire_format_golden_vectors
      FILE: core/test/s1b_wire_format_golden_test.dart
      BEHAVIOR: >
        【A14 的可执行部分】。把 HLC-WIRE-FORMAT.md 里的黄金用例表
        逐条搬进测试（至少 8 组），对每组断言：
        - `(l, c)` 打包后等于文档里写死的 hex 值；
        - 从该 hex 解包后 `(l, c)` 逐字段还原；
        - 与另一组的比较结果等于文档里写死的胜负。
        文档与实现分家是这类规格最常见的死法 —— 文档写了没人对，
        实现改了没人改文档。有了这条，改实现不改文档就会红。
        ⚠ 期望值【写死在测试里】，不许从实现反算。
      RED_COMMAND: cd core && flutter test test/s1b_wire_format_golden_test.dart
      RED_EXPECT: 断言失败或文件不存在，退出码非 0
      COVERS: [A14]

    - NAME: existing_test_counts_do_not_regress
      FILE: core/test/s1b_architecture_guard_test.dart
      BEHAVIOR: >
        【对应 Codex R1 · P2-21：A2 只跑 flutter test 是守不住既有测试的】。
        以纯文本扫描 core/test 与 drift/test 下【S1b 之前就存在】的测试文件，
        断言其中 `test(` 与 `testWidgets(` 的出现次数总和 >= 写死的下限
        （core 64 / drift 276 对应的实测值，2026-08-02 基线）。
        再断言这些文件里【不含】 `skip:` 与 `, skip` 标记。
        只跑 `flutter test` 退出码 0 抓不到"把碍事的既有测试删了/跳过了"——
        删掉之后照样绿。
      RED_COMMAND: cd core && flutter test test/s1b_architecture_guard_test.dart
      RED_EXPECT: 断言失败，退出码非 0
      COVERS: [A2]

    - NAME: six_blockers_are_all_removed
      FILE: core/test/s1b_architecture_guard_test.dart
      BEHAVIOR: >
        §5.2.1 六个阻断点的收口守卫，逐条以纯文本断言：
          ① t_outbox_peer_ack 表存在      -> drift/lib/persistence_drift.dart 含 't_outbox_peer_ack'
          ② t_sync_state 主键含 peerId    -> 含 '{scopeUid, peerId, entityType}'
          ③ markSuccess 带 peerId         -> core/lib/model/ports.dart 含 'required PeerId peerId'
          ④ 存在 pushToAll 且【带 eligiblePeers】
                                          -> sync_peer.dart 含 'required Set<PeerId> eligiblePeers'
          ⑤ 存在 fan-out 实现             -> peer_fanout_pusher.dart 存在且含 'Future.wait'
          ⑥ PeerCapabilities 取代 RegionCapabilities
                                          -> sync_peer.dart 含 'PeerCapabilities'，
                                             且 ports.dart 不再含 'RemoteGateway'
        ④ 特意断言 eligiblePeers 而不只是 pushToAll ——
        没有那个参数的 pushToAll 会架空 §5.4 的过滤（Codex R1 · P0-1）
        六条各一个断言，失败时打印是哪一条。
        这是整个 S1b 的"完工清单"，任何一条被后续改动退化都会在这里红。
      RED_COMMAND: cd core && flutter test test/s1b_architecture_guard_test.dart
      RED_EXPECT: 断言失败（部分阻断点未拆除），退出码非 0
      COVERS: [A12]

    - NAME: fail_closed_semantics_preserved
      FILE: core/test/s1b_architecture_guard_test.dart
      BEHAVIOR: >
        以纯文本读取 core/test/policy_channel_filter_test.dart，断言其中【逐字】包含
        `if (p == null) return false;`。
        这是 S1a 留下的可执行规格，ACT 05 的实现照抄了它。
        规格文件本身被改宽（例如改成 return true）会让 ACT 05 的实现失去参照，
        而这种改动在 review 里极易被当成"修个笔误"放过。
      RED_COMMAND: cd core && flutter test test/s1b_architecture_guard_test.dart
      RED_EXPECT: 断言失败，先红
      COVERS: [A7]

    - NAME: no_wall_clock_in_conflict_path
      FILE: core/test/s1b_architecture_guard_test.dart
      BEHAVIOR: >
        包级守卫（与 ACT 09 的同名单元测试重复是【故意】的 —— 删一个另一个还在）。
        断言 core/lib/model/conflict_arbiter.dart 【不含】
        `DateTime` / `.now()` / `updatedAt`。
        "顺手加个时间戳兜底比较"是定序代码最常见的退化路径，
        加了之后所有功能测试仍会绿。
      RED_COMMAND: cd core && flutter test test/s1b_architecture_guard_test.dart
      RED_EXPECT: 断言失败，先红
      COVERS: [A8]

    - NAME: chinese_dartdoc_on_new_public_declarations
      FILE: core/test/s1b_architecture_guard_test.dart
      BEHAVIOR: >
        照抄 core/test/s1a_dartdoc_coverage_test.dart 的通用式正则（顶层 + 类内成员），
        扫描 TASK_DETAIL.dartdoc_guard 列出的【全部 8 个文件】（不是 3 个），
        对每个公开声明断言紧邻上方存在 `///` 注释块且含 CJK 字符（正则 [一-鿿]）。
        【同时断言扫描到的文件数恰好为 8】——
        路径列表里漏一个不会报错，只会静默少守一个文件（Codex R1 · P2-22）。
        失败时打印 文件:行号 与该行内容。
        【必须同时断言覆盖到的声明总数 >= 一个写死的下限】。
        S1a 的 A10 为这条返工两轮，教训是：不要手工枚举声明形态白名单。
      RED_COMMAND: cd core && flutter test test/s1b_architecture_guard_test.dart
      RED_EXPECT: 断言失败，退出码非 0
      COVERS: [A12]

    - NAME: barrel_existing_lines_intact
      FILE: core/test/s1b_architecture_guard_test.dart
      BEHAVIOR: >
        以纯文本读取 core/lib/persistence_core.dart，断言 S1a 交付的那批 export
        （model/storage_classification.dart / storage_policy.dart /
        storage_policy_registry.dart / transport.dart / export_bundle.dart 等）
        【逐行仍在】，且新增的 6 行各恰好出现一次。
        重排 barrel 不会让任何测试变红，但会让 git blame 失去意义、
        也容易在合并时把某一行吃掉。
      RED_COMMAND: cd core && flutter test test/s1b_architecture_guard_test.dart
      RED_EXPECT: 断言失败，先红
      COVERS: [A12]

VERIFICATION:
