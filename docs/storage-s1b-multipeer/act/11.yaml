    EXPECT_EXIT: 0
  - CMD: cd core && flutter test
    EXPECT_EXIT: 0
  - CMD: cd drift && flutter test
    EXPECT_EXIT: 0
  - CMD: cd firebase && flutter test
    EXPECT_EXIT: 0
  # firebase 的 ERROR 必须为 0（ACT 02 的成果不得回退）
  - CMD: 'cd firebase && dart analyze --format=machine 2>/dev/null | grep -c "^ERROR"'
    EXPECT_STDOUT: "0"
    EXPECT_EXIT: 1
  # barrel 六行各恰好一次
  - CMD: 'for f in "model/sync_peer.dart" "model/peer_eligibility.dart" "routing/peer_fanout_pusher.dart" "sync/peer_registry.dart" "sync/hlc_clock.dart" "model/conflict_arbiter.dart"; do n=$(grep -c "^export ''$f'';" core/lib/persistence_core.dart); [ "$n" = "1" ] || { echo "BAD:$f=$n"; exit 1; }; done; echo BARREL_OK'
    EXPECT_STDOUT: "BARREL_OK"
    EXPECT_EXIT: 0
  # S1a 的 barrel 行未被删
  - CMD: 'for f in "model/storage_classification.dart" "model/storage_policy.dart" "model/storage_policy_registry.dart" "model/transport.dart"; do grep -q "^export ''$f'';" core/lib/persistence_core.dart || { echo "LOST:$f"; exit 1; }; done; echo S1A_BARREL_INTACT'
    EXPECT_STDOUT: "S1A_BARREL_INTACT"
    EXPECT_EXIT: 0
  # 门禁脚本里不得有 `|| true` 之类的恒绿写法（Codex R1 · P2-24）
  - CMD: 'grep -nE "\|\| *true" scripts/run_s1b_analyze_gate.sh'
    EXPECT_EXIT: 1
  # dartdoc 门禁必须扫满 8 个文件
  - CMD: 'grep -c "core/lib/" core/test/s1b_architecture_guard_test.dart'
    EXPECT_STDOUT: "8"
    EXPECT_EXIT: 0
  # A14 规格必须写明 signed int64 的 l 上限与 UTF-8 字节序
  - CMD: 'for k in "2^47" "signed int64" "UTF-8"; do grep -q "$k" docs/storage-s1b-multipeer/HLC-WIRE-FORMAT.md || { echo "MISSING:$k"; exit 1; }; done; echo BOUNDS_OK'
    EXPECT_STDOUT: "BOUNDS_OK"
    EXPECT_EXIT: 0
  # 不得导出测试用 fake
  - CMD: 'grep -n "test_support" core/lib/persistence_core.dart'
    EXPECT_EXIT: 1
  # 门禁脚本 bash 3.2 兼容
  - CMD: 'grep -nE "declare -A|mapfile|readarray" scripts/run_s1b_analyze_gate.sh'
