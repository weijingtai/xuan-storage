SIGNATURE:
  sync_peer.dart: |
    /// 对端标识。是 Map 的键，因此必须有值语义的 == 与 hashCode。
    ///
    /// 用 extension type 而非裸 String：`Map<String, SyncError?>` 无法在类型上
    /// 区分「键是 peerId」还是「键是 entityType」，而 S1b 里两者都是 String，
    /// 混用不会报错只会静默串数据。SDK 约束 >=3.11.0，extension type 可用且零开销。
    extension type const PeerId(String value) {}

    /// 一个对端报告的能力。取代 [RegionCapabilities]（§5.2.1 阻断点 6）。
    ///
    /// 与 RegionCapabilities 的区别：那个描述的是「一个 region 的后端」，
    /// 天然假设只有一个远端；本类描述「某个具体对端」，多带 peerId 与 channel，
    /// 让 SyncRuntime 能按对端而非按 region 做 feature gating。
    final class PeerCapabilities {
      /// 该对端的标识。
      final PeerId peerId;

      /// 该对端走哪条通道。
      final Channel channel;

      /// 每种 entityType 对应的 schema 版本号。语义同 RegionCapabilities。
      final Map<String, int> entityVersions;

      /// 该对端支持的 feature 集合（例如 'outbox_v1'）。
      final Set<String> supportedFeatures;

      /// 对端协议版本号。
      final int protocolVersion;

      /// 构造一个 [PeerCapabilities]。
      const PeerCapabilities({
        required this.peerId,
        required this.channel,
        required this.entityVersions,
        required this.supportedFeatures,
        required this.protocolVersion,
      });
    }

    /// 一个可同步的对端。云端 gateway 与去中心化 peer 共用本接口。
    ///
    /// 命名（§5.2）：接口叫 SyncPeer，实现类仍叫 `*Gateway`，为的是不改既有类名。
    ///
    /// 与 [Transport] 的分层：Transport 在下（物理连接），SyncPeer 在上（oplog 协议）。
    /// [Channel.cloud] 是唯一不经 Transport 的 SyncPeer —— 它直连后端 SDK。
    abstract interface class SyncPeer {
      /// 本对端标识。
      PeerId get peerId;

      /// 本对端走哪条通道。
      Channel get channel;

      /// 推送一条 outbox 记录到该对端。成功返回 null，失败返回 [SyncError]。
      Future<SyncError?> push(OutboxRecord record);

      /// 按游标增量拉取该对端的变更。语义同既有 RemoteGateway.listChanges。
      Future<RemoteChangesPage> listChanges({
        required String scopeUid,
        required String entityType,
        required PullCursor? sinceCursor,
        required int limit,
      });

      /// 该对端报告的能力。
      Future<PeerCapabilities> getCapabilities();
    }

    /// 向【指定的合格对端】扇出推送（§5.2.2 第 4 条 + §5.4 第一道锁）。
    ///
    /// 取代 OutboxPusher 的 1-of-N 语义：一条 outbox 记录要送达 N 个对端，
    /// 每个对端各有各的成败，压不成一个 SyncError?（§5.2.1 阻断点 4）。
    ///
    /// ⚠ **方法名里的 All 指的是「[eligiblePeers] 里的全部」，不是「持有的全部」。**
    /// 没有这个参数的版本（转译 v1）会让 §5.4 的 channel 过滤被整个架空：
    /// peekBatch 辛苦挑出该对端能收的记录，pushToAll 转头又发给了所有人，
    /// shared 数据照样泄漏到 LAN，而两边各自的测试都是绿的（Codex R1 · P0-1）。
    abstract interface class PeerFanoutPusher {
      /// 把 [record] 推给 [eligiblePeers] 中的对端，逐个返回结果。
      ///
      /// [eligiblePeers]：允许接收本条记录的对端集合，由调用方按存储策略算出
      /// （ACT 08 的 `PeerEligibility`）。**实现【必须】只推这个集合里的对端。**
      ///
      /// 约定（四条都是 ACT 10 实现时的硬要求，写在这里让契约测试能验）：
      /// - 只推 [eligiblePeers] 里的对端，一个都不许多推；
      /// - 返回的 Map 的键集合【恰好等于】 [eligiblePeers]，成功的对端值为 null；
      /// - 某个对端抛异常【不得】中断其余对端的推送，异常转成该对端的 SyncError；
      /// - 不得因为某个对端失败就把整体判为失败 —— 成败是 per-peer 的。
      Future<Map<PeerId, SyncError?>> pushToAll(
        OutboxRecord record, {
        required Set<PeerId> eligiblePeers,
      });
    }

TASK_DETAIL:
  file_placement: >
    全部四个类型放同一个新文件 core/lib/model/sync_peer.dart。
    【不要】塞进 ports.dart —— ports.dart 是既有单 peer 时代的端口集合，
    ACT 03 还要在里面改 OutboxStore/SyncStateStore 的签名，两件事混在一个文件里
    会让 git diff 无法区分「新增契约」与「破坏性签名变更」，跨模型审查时看不清。

  no_touching_remote_gateway: >
    【本 ACT 不动 ports.dart 的 RemoteGateway】。它现在有三个实现者：
      core/lib/routing/remote_gateway_router.dart:13         RemoteGatewayRouter
      firebase/lib/persistence_firebase.dart:20              FirestoreRemoteGateway
      firebase/lib/firebase_realtime_remote_gateway.dart:26  FirebaseRealtimeRemoteGateway
    动它等于同时改 core 与 firebase 两个包，且要连带改 sync_coordinator.dart 的四处
    构造参数。那是 ACT 03 的事。
    本 ACT 只是让 SyncPeer 先存在，两个接口并存【一个 ACT 的时间】是故意的。

  barrel: >
    暂【不要】加进 core/lib/persistence_core.dart 的 export 列表 ——
    barrel 与架构守卫统一在 ACT 12 收口，避免每个 ACT 都碰同一行造成串行冲突。

CONSTRAINTS:
  - 【零实现】：本 ACT 不写任何 `class X implements SyncPeer`。只有测试里的 fake 例外。
  - 【不要】把 PeerId 写成裸 `typedef PeerId = String;`。见 SIGNATURE 里的理由 ——
    typedef 只是别名，`Map<PeerId,_>` 与 `Map<String,_>` 完全互换，起不到区分作用。
  - 【不要】让 PeerCapabilities 继承或复用 RegionCapabilities。前者多两个字段且语义不同，
    继承会让「region 能力」与「peer 能力」在类型上混淆，正是 §5.2.1 阻断点 6 要消灭的。
  - 【不要】在 SyncPeer 上加 `watch()` / 推送订阅之类的方法。云端 gateway 与
    LAN peer 的能力差异靠 capabilities 表达，不靠往基类塞会抛 UnsupportedError 的方法
    （S5c 已经踩过这个坑并把它写进了墓地：能力差异必须在类型/数据上可见）。
  - 【不要】给 PeerFanoutPusher 写实现。ACT 10 才实现。
  - 【不要】把 pushToAll 的 eligiblePeers 做成可选参数或给默认值「全部对端」。
    可选即等于没有 —— 调用方漏传就退回泄漏状态，而编译器不会拦。
  - 每个公开声明必须有中文 dartdoc（A12）。

TESTS_FIRST:
  CASES:
    - NAME: peer_id_has_value_semantics_as_map_key
      FILE: core/test/s1b_sync_peer_contract_test.dart
      BEHAVIOR: >
        【本 ACT 最重要的一条】。断言 `PeerId('cloud') == PeerId('cloud')` 为 true，
        且把两个内容相同的 PeerId 先后放进同一个 Map 时【只占一个键】
        （`map[PeerId('cloud')] = a; map[PeerId('cloud')] = b; expect(map.length, 1)`）。
        再断言 `PeerId('cloud') != PeerId('lan')`。
        这条守的是 pushToAll 返回的 Map 能不能正确按对端聚合 —— 若 PeerId 写成
        引用语义的 class 且忘了覆写 ==/hashCode，N 个对端会退化成 N 个互不相等的键，
        调用方按 peerId 查结果永远查不到，而且不会报错。
      RED_COMMAND: cd core && flutter test test/s1b_sync_peer_contract_test.dart
      RED_EXPECT: 编译失败（PeerId 不存在），退出码非 0
      COVERS: [A11]

    - NAME: peer_capabilities_carries_peer_and_channel
      FILE: core/test/s1b_sync_peer_contract_test.dart
      BEHAVIOR: >
        构造一个 PeerCapabilities，断言五个字段都能读回且值正确，
        重点断言 `peerId` 与 `channel` 存在 —— 这两个是它相对
        RegionCapabilities 多出来的东西，被省掉的话 §5.2.1 阻断点 6 等于没解决。
        另断言 `PeerCapabilities` 【不是】 `RegionCapabilities` 的子类型
        （`expect(caps is RegionCapabilities, isFalse)`），防止有人图省事去继承。
      RED_COMMAND: cd core && flutter test test/s1b_sync_peer_contract_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A12]

    - NAME: sync_peer_is_implementable_without_transport
      FILE: core/test/s1b_sync_peer_contract_test.dart
      BEHAVIOR: >
        在测试内写一个最小 fake `_CloudPeer implements SyncPeer`，
        `channel => Channel.cloud`，三个方法返回固定值。
        断言它能编译并被当作 SyncPeer 使用。
        这条证明「云端不经 Transport 也能是 SyncPeer」（§5.2 分层）——
        如果有人把 Transport 或 PeerSession 写成 SyncPeer 的必需成员，这条会编译失败。
      RED_COMMAND: cd core && flutter test test/s1b_sync_peer_contract_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A11]

    - NAME: fanout_result_map_equals_eligible_set_exactly
      FILE: core/test/s1b_sync_peer_contract_test.dart
      BEHAVIOR: >
        非 happy-path 核心。fake pusher 持有【四个】对端
        （cloud 成功、lan 失败、webrtc 抛异常、manualExport 计数式 spy），
        但 `eligiblePeers` 只传【前三个】。断言：
        - 返回 Map 的键集合【恰好等于】 eligiblePeers（length 为 3）；
        - cloud 有条目且值为 null（成功也必须留条目）；
        - lan 的值是 SyncError 且 code 可读；
        - webrtc 的值是 SyncError（异常转成错误，不漏项、不外抛）；
        - **manualExport 的 pushCount 为 0，且它【不在】返回 Map 里**。
        最后一条是 Codex R1 · P0-1 的契约级防线：
        实现若忽略 eligiblePeers 直接推给持有的全部对端，这条会红。
        用计数式 spy 记录调用次数，【不用 fail()】—— 调用方有 catch-all 会吞掉
        TestFailure（S5c 的教训）。
      RED_COMMAND: cd core && flutter test test/s1b_sync_peer_contract_test.dart
      RED_EXPECT: 编译失败，先红
      COVERS: [A7, A11]

    - NAME: sync_peer_has_no_watch_or_push_subscription_method
      FILE: core/test/s1b_sync_peer_contract_test.dart
      BEHAVIOR: >
        以纯文本读取 core/lib/model/sync_peer.dart，断言其中【不含】
        `watch(` / `subscribe(` / `Stream<` 这三类记号出现在 SyncPeer 声明块内。
        理由见 CONSTRAINTS 第四条：能力差异必须靠 capabilities 表达。
        本条是文本级守卫，故意不依赖类型系统 —— 类型系统拦不住「加个方法」。
      RED_COMMAND: cd core && flutter test test/s1b_sync_peer_contract_test.dart
      RED_EXPECT: 断言失败或文件不存在，退出码非 0
      COVERS: [A12]

